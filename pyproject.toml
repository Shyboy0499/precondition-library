[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precondition-library"
version = "0.0.1"
description = "An agent that compiles git maintenance chores into reusable, precondition-gated programs it can replay with zero LLM calls"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/precondition_library"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
