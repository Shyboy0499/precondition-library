id: diverged-occ1-diverged-sync-fork-discard-additive
intent: Make the fork's current branch match upstream exactly by discarding local-only
  commits, but only when those local commits are purely additive (no path that upstream
  already tracks is modified or deleted).
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the upstream tracking ref is already present locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch} >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: has_local_commits_ahead
  description: the branch carries at least one commit that upstream does not have
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: there are no tracked or untracked changes that a hard reset would lose
    or that would block it
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_modify_no_existing_paths
  description: relative to the merge base the local-only commits add fresh files only,
    modifying or deleting nothing that already existed
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    test -z "$(git diff --name-only --diff-filter=MDR "$base" HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: local_changed_paths_absent_from_upstream
  description: no path touched by the local-only commits exists in upstream's tree,
    so the local work is purely new content upstream never had
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    ! comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort) \
      <(git ls-tree -r --name-only -z {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote} || exit 1
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_commits_ahead
  description: the branch has no commits that upstream lacks
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree_after_reset
  description: the working tree is clean after the reset
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-10026'
  fault: diverged
status: admitted
