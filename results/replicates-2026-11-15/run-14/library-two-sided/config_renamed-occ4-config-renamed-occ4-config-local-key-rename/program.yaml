id: config_renamed-occ4-config-renamed-occ4-config-local-key-rename
intent: Bring the user's own gitignored local override config file up to date with
  the app's current setting names by renaming each stale key according to the old
  = new mapping in the tracked config/renames.conf, preserving values and leaving
  the override file untracked so it stays out of git.
parameters: []
preconditions:
- name: renames_file_defined
  description: config/renames.conf exists and defines at least one old = new key mapping
  probe: |-
    [ -f config/renames.conf ] &&
    grep -Eq '^[[:space:]]*[^#[:space:]=]+[[:space:]]*=[[:space:]]*[^[:space:]]+[[:space:]]*$' config/renames.conf
  expect_exit: 0
  expect_pattern: null
- name: ignored_local_override_exists
  description: at least one file under config is untracked and ignored, i.e. a local
    override kept out of git
  probe: git ls-files --others --ignored --exclude-standard -z -- config | tr '\0'
    '\n' | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: stale_key_present
  description: an ignored config file still uses an old key that renames.conf maps
    to a new name
  probe: |-
    stale=0
    while IFS= read -r -d '' f; do
      if [ "$f" = config/renames.conf ]; then
        continue
      fi
      while IFS= read -r old; do
        [ -n "$old" ] || continue
        grep -Eq "^[[:space:]]*$old[[:space:]]*=" "$f" && stale=1
      done < <(sed -n -E 's/^[[:space:]]*([^#[:space:]=]+)[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' config/renames.conf)
    done < <(git ls-files --others --ignored --exclude-standard -z -- config)
    [ "$stale" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
- name: no_tracked_modifications
  description: no tracked file is modified or staged, so any tracked change would
    be visible afterwards
  probe: '! git status --porcelain --untracked-files=no | grep -q .'
  expect_exit: 0
  expect_pattern: null
body: |
  while IFS= read -r -d '' f; do
    if [ "$f" = config/renames.conf ]; then
      continue
    fi
    while read -r old new; do
      [ -n "$old" ] || continue
      [ -n "$new" ] || continue
      if [ "$old" = "$new" ]; then
        continue
      fi
      sed -i -E "s/^([[:space:]]*)$old([[:space:]]*)=/\1$new\2=/" -- "$f"
    done < <(sed -n -E 's/^[[:space:]]*([^#[:space:]=]+)[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1 \2/p' config/renames.conf)
  done < <(git ls-files --others --ignored --exclude-standard -z -- config)
steps: null
postconditions:
- name: no_stale_key_in_ignored_config
  description: no ignored config file still uses an old key that renames.conf has
    renamed
  probe: |-
    stale=0
    while IFS= read -r -d '' f; do
      if [ "$f" = config/renames.conf ]; then
        continue
      fi
      while IFS= read -r old; do
        [ -n "$old" ] || continue
        grep -Eq "^[[:space:]]*$old[[:space:]]*=" "$f" && stale=1
      done < <(sed -n -E 's/^[[:space:]]*([^#[:space:]=]+)[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' config/renames.conf)
    done < <(git ls-files --others --ignored --exclude-standard -z -- config)
    [ "$stale" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
- name: renamed_key_present
  description: an ignored config file now sets at least one of the app's current key
    names
  probe: |-
    found=0
    while IFS= read -r -d '' f; do
      if [ "$f" = config/renames.conf ]; then
        continue
      fi
      while IFS= read -r new; do
        [ -n "$new" ] || continue
        grep -Eq "^[[:space:]]*$new[[:space:]]*=" "$f" && found=1
      done < <(sed -n -E 's/^[[:space:]]*([^#[:space:]=]+)[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\2/p' config/renames.conf)
    done < <(git ls-files --others --ignored --exclude-standard -z -- config)
    [ "$found" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
- name: local_override_still_ignored
  description: the local override files are still untracked and ignored, so they stay
    out of git
  probe: git ls-files --others --ignored --exclude-standard -z -- config | tr '\0'
    '\n' | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: no_tracked_modifications_after
  description: the body neither modified nor staged any tracked file
  probe: '! git status --porcelain --untracked-files=no | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: Bring my configuration up to date with the setting names the
    app uses now. Rename the old key in my own override file, and keep that file out
    of git.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Bring my configuration up to date with the setting names the app uses
    now. Rename the old key in my own override file, and keep that file out of git./seed-2-config_renamed-10026
  fault: config_renamed
status: candidate
