id: dirty_tree-occ2-dirty-tree-commit-then-rebase
intent: Commit the user's uncommitted working-tree changes so they are preserved,
  then bring the current branch up to date with upstream by rebasing onto it, leaving
  both the local work and upstream's work in place and the working tree clean.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_dirty
  description: the working tree has uncommitted changes that must be preserved
  probe: git status --porcelain -z | tr '\0' '\n' | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_present
  description: the upstream-tracking ref exists locally so it can be rebased onto
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: branch_behind_upstream
  description: the upstream-tracking branch has commits that HEAD does not contain
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_file_overwritten_by_upstream
  description: no untracked local file sits on a path that the incoming upstream commits
    add or change, so committing and rebasing cannot clobber it; such a state belongs
    to the stashing resolution instead
  probe: |-
    up={upstream_remote}/{upstream_branch}
    git rev-parse --verify --quiet "$up" >/dev/null || exit 1
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD "$up" | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  git add -A
  git commit -m "wip: commit local changes before syncing with upstream"
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: worktree_clean
  description: no uncommitted changes remain after the commit and rebase
  probe: '! git status --porcelain -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: the upstream-tracking commit is contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_work_preserved
  description: at least one local commit sits on top of upstream, holding the saved
    work
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
variant: commit
provenance:
  compiled_from_task: My working tree has changes and the branch is behind upstream.
    Fix that and keep my changes. Commit my uncommitted work first, then bring the
    branch up to date.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: My working tree has changes and the branch is behind upstream. Fix that
    and keep my changes. Commit my uncommitted work first, then bring the branch up
    to date./seed-0-dirty_tree-10026
  fault: dirty_tree
status: admitted
