id: lockfile_conflict-occ1-merge-upstream-take-upstream
intent: Catch up the current branch with upstream, resolving dependency-file conflicts
  by taking upstream's version as the base and re-adding local insertions.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the upstream remote is configured
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream branch has a remote-tracking ref
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream has at least one commit not in HEAD
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: '[1-9]'
- name: local_has_commits_not_upstream
  description: local HEAD has at least one commit not in upstream
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: '[1-9]'
- name: common_merge_base
  description: the two branches share a merge base
  probe: git merge-base HEAD {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: both_sides_touched_a_common_file
  description: at least one file is modified on both sides relative to the merge base
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch})
    comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: local_side_adds_lines
  description: the local branch adds at least one line relative to the merge base
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch})
    git diff -U0 "$base" HEAD | grep -q '^+[^+]'
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote} {upstream_branch}
  if git merge --no-edit {upstream_remote}/{upstream_branch}; then
    exit 0
  fi
  git rev-parse -q --verify MERGE_HEAD >/dev/null
  tmpdir=$(mktemp -d)
  trap 'rm -rf "$tmpdir"' EXIT
  while IFS= read -r -d '' path; do
    base="$tmpdir/base"
    ours="$tmpdir/ours"
    theirs="$tmpdir/theirs"
    merged="$tmpdir/merged"
    git show ":1:$path" > "$base"
    git show ":2:$path" > "$ours"
    git show ":3:$path" > "$theirs"
    python3 - "$base" "$ours" "$theirs" "$merged" <<'PY'
  import sys
  import difflib

  base_path, ours_path, theirs_path, out_path = sys.argv[1:5]

  def read_lines(path):
      with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
          return f.readlines()

  base = read_lines(base_path)
  ours = read_lines(ours_path)
  theirs = read_lines(theirs_path)

  def get_opcodes(a, b):
      return difflib.SequenceMatcher(None, a, b, autojunk=False).get_opcodes()

  # Map each base-line boundary to the corresponding boundary in theirs.
  mapping = [0] * (len(base) + 1)
  upstream_inserts = {}
  for tag, i1, i2, j1, j2 in get_opcodes(base, theirs):
      if tag == "equal":
          for k in range(i1, i2 + 1):
              mapping[k] = j1 + (k - i1)
      elif tag == "insert":
          mapping[i1] = max(mapping[i1], j2)
          if i1 not in upstream_inserts or j1 < upstream_inserts[i1]:
              upstream_inserts[i1] = j1
      else:  # replace or delete
          mapping[i1] = j1
          mapping[i2] = j2
          for k in range(i1 + 1, i2):
              mapping[k] = j1

  # Keep the mapping monotonic and fill any unset boundaries.
  for i in range(1, len(mapping)):
      if mapping[i] < mapping[i - 1]:
          mapping[i] = mapping[i - 1]

  # Local pure insertions are the changes we re-apply.
  insertions = []
  for tag, i1, i2, j1, j2 in get_opcodes(base, ours):
      if tag == "insert":
          insertions.append((i1, ours[j1:j2]))

  def already_present(block, lines):
      n = len(block)
      if n == 0:
          return True
      for k in range(len(lines) - n + 1):
          if lines[k:k + n] == block:
              return True
      return False

  by_pos = {}
  for base_idx, block in insertions:
      if already_present(block, theirs):
          continue
      pos = upstream_inserts.get(base_idx, mapping[base_idx])
      by_pos.setdefault(pos, []).append(block)

  out = []
  for j in range(len(theirs) + 1):
      for block in by_pos.get(j, []):
          out.extend(block)
      if j < len(theirs):
          out.append(theirs[j])

  with open(out_path, "w", encoding="utf-8", errors="surrogateescape") as f:
      f.writelines(out)
  PY
    cat "$merged" > "$path"
    git add -- "$path"
  done < <(git diff --name-only --diff-filter=U -z)
  git commit --no-edit
steps: null
postconditions:
- name: upstream_is_ancestor
  description: upstream's tip is reachable from HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: no unmerged index entries remain
  probe: '! git diff --name-only --diff-filter=U -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the index and working tree have no pending changes
  probe: '! git status --porcelain=v1 -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_created
  description: HEAD is a merge commit with more than one parent
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: Catch up with upstream without losing what either side added,
    or reviving what either side removed. Start from upstream's dependency file and
    add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Catch up with upstream without losing what either side added, or reviving
    what either side removed. Start from upstream's dependency file and add back what
    I added./seed-5-lockfile_conflict-10026
  fault: lockfile_conflict
status: admitted
