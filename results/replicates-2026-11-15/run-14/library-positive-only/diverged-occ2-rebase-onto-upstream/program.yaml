id: diverged-occ2-rebase-onto-upstream
intent: Replay local commits on top of the upstream branch by rebasing so history
  stays linear
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: clean_worktree
  description: the working tree and index have no changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: remote_tracking_ref_exists
  description: the upstream remote-tracking branch is available locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: local_branch_has_commits
  description: HEAD has commits that are not in the upstream branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_commits
  description: the upstream branch has commits that are not in HEAD
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: attached_to_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_or_merge_in_progress
  description: no rebase or merge operation is already in progress
  probe: test ! -d "$(git rev-parse --git-path rebase-merge)" && test ! -d "$(git
    rev-parse --git-path rebase-apply)" && test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream branch is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_commits
  description: no merge commits remain between upstream and HEAD
  probe: '! git rev-list --merges {upstream_remote}/{upstream_branch}..HEAD | grep
    -q .'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_still_ahead
  description: HEAD still has local commits on top of upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree_after
  description: the working tree and index are clean after the rebase
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: Upstream moved ahead of me. Get me back in line with it. Replay
    my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream moved ahead of me. Get me back in line with it. Replay my local
    commits on top of upstream so the history stays linear./seed-2-diverged-10026
  fault: diverged
status: admitted
