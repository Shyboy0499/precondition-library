id: config_renamed-occ2-migrate-local-config-key-renames
intent: Rename superseded setting names in the local override configuration file to
  the names the app now uses, keeping that file untracked and ignored.
parameters:
- work_dir
preconditions:
- name: renames_map_present
  description: the application rename map exists and lists at least one old-to-new
    key mapping
  probe: |-
    cd "{work_dir}"
    test -s config/renames.conf &&
      grep -qE '^[[:space:]]*[^#[:space:]=]+[[:space:]]*=[[:space:]]*[^[:space:]=#]+' config/renames.conf
  expect_exit: 0
  expect_pattern: null
- name: stale_key_in_untracked_config
  description: an untracked or ignored configuration file still contains a key that
    the rename map supersedes
  probe: |-
    set -e
    cd "{work_dir}"
    map="config/renames.conf"
    found=1
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      [ -f "$f" ] || continue
      case "$f" in */renames.conf|renames.conf) continue;; esac
      grep -Iq . -- "$f" || continue
      if awk -v mapfile="$map" '
        BEGIN {
          while ((getline l < mapfile) > 0) {
            sub(/#.*/, "", l)
            if (l ~ /^[[:space:]]*$/) continue
            p = index(l, "=")
            if (p == 0) continue
            o = substr(l, 1, p - 1)
            n = substr(l, p + 1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
            if (o != "" && n != "" && o != n) keys[o] = 1
          }
          close(mapfile)
        }
        {
          line = $0
          sub(/^[[:space:]]*/, "", line)
          p = index(line, "=")
          if (p > 0) {
            k = substr(line, 1, p - 1)
            gsub(/[[:space:]]+$/, "", k)
            if (k in keys) { found = 1; exit 0 }
          }
        }
        END { exit(found ? 0 : 1) }
      ' "$f"; then
        found=0
        break
      fi
    done < <({ git ls-files --others --exclude-standard -z; git ls-files --others --ignored --exclude-standard -z; } | tr '\0' '\n' | sort -u)
    [ "$found" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
body: |-
  set -eu
  cd "{work_dir}"
  map="config/renames.conf"
  while IFS= read -r f; do
    [ -n "$f" ] || continue
    [ -f "$f" ] || continue
    case "$f" in */renames.conf|renames.conf) continue;; esac
    grep -Iq . -- "$f" || continue
    tmp="${f}.renametmp.$$"
    if awk -v mapfile="$map" '
      BEGIN {
        changed = 0
        while ((getline l < mapfile) > 0) {
          sub(/#.*/, "", l)
          if (l ~ /^[[:space:]]*$/) continue
          p = index(l, "=")
          if (p == 0) continue
          o = substr(l, 1, p - 1)
          n = substr(l, p + 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
          if (o != "" && n != "" && o != n) map[o] = n
        }
        close(mapfile)
      }
      {
        line = $0
        if (match(line, /^[[:space:]]*[^[:space:]=]+[[:space:]]*=/)) {
          head = substr(line, 1, RLENGTH)
          key = head
          sub(/^[[:space:]]*/, "", key)
          sub(/[[:space:]]*=.*$/, "", key)
          if (key in map) {
            rest = substr(line, RLENGTH + 1)
            sub(/^[[:space:]]+/, "", rest)
            lead = head
            sub(/[^[:space:]].*$/, "", lead)
            print lead map[key] " = " rest
            changed = 1
            next
          }
        }
        print line
      }
      END { exit(changed ? 0 : 1) }
    ' "$f" > "$tmp"; then
      if ! cmp -s -- "$f" "$tmp"; then
        cat -- "$tmp" > "$f"
        if ! git check-ignore -q -- "$f"; then
          if [ -f .gitignore ] && grep -qxF -- "$f" .gitignore; then
            :
          else
            printf '%s\n' "$f" >> .gitignore
          fi
        fi
      fi
    fi
    rm -f -- "$tmp"
  done < <({ git ls-files --others --exclude-standard -z; git ls-files --others --ignored --exclude-standard -z; } | tr '\0' '\n' | sort -u)
steps: null
postconditions:
- name: no_superseded_keys_remain
  description: no untracked or ignored configuration file still uses a key that the
    rename map supersedes
  probe: |-
    set -e
    cd "{work_dir}"
    map="config/renames.conf"
    found=1
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      [ -f "$f" ] || continue
      case "$f" in */renames.conf|renames.conf) continue;; esac
      grep -Iq . -- "$f" || continue
      if awk -v mapfile="$map" '
        BEGIN {
          while ((getline l < mapfile) > 0) {
            sub(/#.*/, "", l)
            if (l ~ /^[[:space:]]*$/) continue
            p = index(l, "=")
            if (p == 0) continue
            o = substr(l, 1, p - 1)
            n = substr(l, p + 1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
            if (o != "" && n != "" && o != n) keys[o] = 1
          }
          close(mapfile)
        }
        {
          line = $0
          sub(/^[[:space:]]*/, "", line)
          p = index(line, "=")
          if (p > 0) {
            k = substr(line, 1, p - 1)
            gsub(/[[:space:]]+$/, "", k)
            if (k in keys) { found = 1; exit 0 }
          }
        }
        END { exit(found ? 0 : 1) }
      ' "$f"; then
        found=0
        break
      fi
    done < <({ git ls-files --others --exclude-standard -z; git ls-files --others --ignored --exclude-standard -z; } | tr '\0' '\n' | sort -u)
    [ "$found" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
- name: override_still_ignored_and_untracked
  description: a configuration file carrying an updated key remains outside the index
    and is ignored
  probe: |-
    set -e
    cd "{work_dir}"
    map="config/renames.conf"
    found=1
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      [ -f "$f" ] || continue
      case "$f" in */renames.conf|renames.conf) continue;; esac
      grep -Iq . -- "$f" || continue
      if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then continue; fi
      git check-ignore -q -- "$f" || continue
      if awk -v mapfile="$map" '
        BEGIN {
          while ((getline l < mapfile) > 0) {
            sub(/#.*/, "", l)
            if (l ~ /^[[:space:]]*$/) continue
            p = index(l, "=")
            if (p == 0) continue
            o = substr(l, 1, p - 1)
            n = substr(l, p + 1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
            if (o != "" && n != "" && o != n) newkeys[n] = 1
          }
          close(mapfile)
        }
        {
          line = $0
          sub(/^[[:space:]]*/, "", line)
          p = index(line, "=")
          if (p > 0) {
            k = substr(line, 1, p - 1)
            gsub(/[[:space:]]+$/, "", k)
            if (k in newkeys) { found = 1; exit 0 }
          }
        }
        END { exit(found ? 0 : 1) }
      ' "$f"; then
        found=0
        break
      fi
    done < <({ git ls-files --others --exclude-standard -z; git ls-files --others --ignored --exclude-standard -z; } | tr '\0' '\n' | sort -u)
    [ "$found" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
variant: migrate_local
