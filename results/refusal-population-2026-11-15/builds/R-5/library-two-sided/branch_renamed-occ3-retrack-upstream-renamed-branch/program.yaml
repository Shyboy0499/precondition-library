id: branch_renamed-occ3-retrack-upstream-renamed-branch
intent: Keep the current local branch name, point its tracking at upstream's new branch,
  and fast-forward it to that branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: no_tracked_changes
  description: the index and working tree have no tracked changes
  probe: test -z "$(git status --porcelain --untracked-files=no)"
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch, so its name can be preserved
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote} >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: tracks_a_different_branch_on_upstream
  description: the current branch tracks a branch on the upstream remote other than
    the target
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    remote=$(git config --get "branch.$branch.remote") || exit 1
    merge=$(git config --get "branch.$branch.merge") || exit 1
    [ "$remote" = "{upstream_remote}" ] || exit 1
    [ "$merge" != "refs/heads/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_is_target
  description: the upstream remote's default branch is the target branch
  probe: test "$(git symbolic-ref --quiet refs/remotes/{upstream_remote}/HEAD)" =
    "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: target_branch_exists_and_is_fast_forwardable
  description: the target remote-tracking branch exists and the current branch can
    fast-forward to it
  probe: |-
    target=refs/remotes/{upstream_remote}/{upstream_branch}
    git rev-parse --verify --quiet "$target" >/dev/null || exit 1
    git merge-base --is-ancestor HEAD "$target"
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_collisions
  description: no untracked file would be overwritten by the fast-forward
  probe: |-
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD refs/remotes/{upstream_remote}/{upstream_branch} \
        | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch --prune {upstream_remote}
  branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
  git branch --set-upstream-to={upstream_remote}/{upstream_branch} "$branch"
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracking_points_at_target
  description: the current branch is configured to track the new upstream branch
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    [ "$(git config --get "branch.$branch.remote")" = "{upstream_remote}" ] || exit 1
    [ "$(git config --get "branch.$branch.merge")" = "refs/heads/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: head_matches_target
  description: the local branch is caught up with the target upstream branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: still_on_local_branch
  description: HEAD remains attached to a local branch
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_tracked_changes_after
  description: the fast-forward left no tracked changes in the working tree or index
  probe: test -z "$(git status --porcelain --untracked-files=no)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Keep my branch's name, point its tracking at upstream's new branch
    and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Keep my branch's name, point its tracking at upstream's new branch and
    catch up./seed-6-branch_renamed-7516
  fault: branch_renamed
status: admitted
