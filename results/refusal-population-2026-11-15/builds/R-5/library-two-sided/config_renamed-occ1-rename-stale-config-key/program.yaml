id: config_renamed-occ1-rename-stale-config-key
intent: Rename a stale config key in config/settings.conf to its new name from config/renames.conf,
  preserving the value, and commit the change.
parameters: []
preconditions:
- name: settings_file_tracked
  description: config/settings.conf exists and is tracked by git
  probe: test -f config/settings.conf && git ls-files --error-unmatch config/settings.conf
    >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: renames_file_tracked
  description: config/renames.conf exists and is tracked by git
  probe: test -f config/renames.conf && git ls-files --error-unmatch config/renames.conf
    >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: settings_file_clean
  description: config/settings.conf has no uncommitted changes or merge conflicts
  probe: |-
    git diff --quiet -- config/settings.conf &&
    git diff --cached --quiet -- config/settings.conf &&
    ! git ls-files -u -- config/settings.conf | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: has_stale_key
  description: at least one old key from config/renames.conf is present in config/settings.conf
    and its new key is not present
  probe: |-
    awk '
    FNR == 1 {
      if (FILENAME == ARGV[1]) file_type = "renames"
      else if (FILENAME == ARGV[2]) file_type = "settings"
    }
    file_type == "renames" {
      line = $0
      sub(/^[[:space:]]*#.*/, "", line)
      if (line ~ /^[[:space:]]*$/) next
      eq = index(line, "=")
      if (eq == 0) next
      old = substr(line, 1, eq - 1)
      new = substr(line, eq + 1)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
      map[old] = new
      next
    }
    file_type == "settings" {
      eq = index($0, "=")
      if (eq > 0) {
        key = substr($0, 1, eq - 1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
        existing[key] = 1
      }
      next
    }
    END {
      for (old in map) {
        if (old in existing && !(map[old] in existing)) {
          exit 0
        }
      }
      exit 1
    }
    ' config/renames.conf config/settings.conf
  expect_exit: 0
  expect_pattern: null
body: |-
  set -e
  tmp=$(mktemp)
  trap 'rm -f "$tmp"' EXIT
  awk '
  FNR == 1 {
    if (FILENAME == ARGV[1]) file_type = "renames"
    else if (FILENAME == ARGV[2]) {
      if (settings_pass == 0) { file_type = "settings_old"; settings_pass = 1 }
      else { file_type = "settings_new" }
    }
  }
  file_type == "renames" {
    line = $0
    sub(/^[[:space:]]*#.*/, "", line)
    if (line ~ /^[[:space:]]*$/) next
    eq = index(line, "=")
    if (eq == 0) next
    old = substr(line, 1, eq - 1)
    new = substr(line, eq + 1)
    gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
    gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
    map[old] = new
    next
  }
  file_type == "settings_old" {
    eq = index($0, "=")
    if (eq > 0) {
      key = substr($0, 1, eq - 1)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
      existing[key] = 1
    }
    next
  }
  file_type == "settings_new" {
    line = $0
    eq = index(line, "=")
    if (eq > 0) {
      prefix = substr(line, 1, eq - 1)
      key = prefix
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
      if (key in map) {
        newkey = map[key]
        if (!(newkey in existing)) {
          if (match(prefix, /^[[:space:]]*/)) {
            lead = substr(prefix, 1, RLENGTH)
          } else {
            lead = ""
          }
          rest = substr(prefix, RLENGTH + 1)
          if (match(rest, /[[:space:]]*$/)) {
            trail = substr(rest, RSTART)
          } else {
            trail = ""
          }
          newprefix = lead newkey trail
          line = newprefix substr(line, eq)
          existing[newkey] = 1
        }
      }
    }
    print line
  }
  ' config/renames.conf config/settings.conf config/settings.conf > "$tmp"
  cat "$tmp" > config/settings.conf
  git add config/settings.conf
  git commit -m "fix(config): rename stale settings keys" -- config/settings.conf
steps: null
postconditions:
- name: stale_keys_migrated_with_value
  description: every stale key from the pre-change settings was renamed and its value
    preserved
  probe: |-
    awk '
    FNR == 1 {
      if (FILENAME == ARGV[1]) file_type = "renames"
      else if (FILENAME == ARGV[2]) file_type = "old"
      else if (FILENAME == ARGV[3]) file_type = "new"
    }
    file_type == "renames" {
      line = $0
      sub(/^[[:space:]]*#.*/, "", line)
      if (line ~ /^[[:space:]]*$/) next
      eq = index(line, "=")
      if (eq == 0) next
      old = substr(line, 1, eq - 1)
      new = substr(line, eq + 1)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
      map[old] = new
      next
    }
    file_type == "old" {
      line = $0
      eq = index(line, "=")
      if (eq > 0) {
        key = substr(line, 1, eq - 1)
        val = substr(line, eq + 1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)
        oldval[key] = val
        oldkeys[key] = 1
      }
      next
    }
    file_type == "new" {
      line = $0
      eq = index(line, "=")
      if (eq > 0) {
        key = substr(line, 1, eq - 1)
        val = substr(line, eq + 1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", val)
        newval[key] = val
        newkeys[key] = 1
      }
      next
    }
    END {
      ok = 1
      for (old in map) {
        new = map[old]
        if (old in oldkeys) {
          if (!(new in oldkeys)) {
            if (!(new in newkeys)) {
              print "ERROR: new key missing: " new > "/dev/stderr"
              ok = 0
            } else if (newval[new] != oldval[old]) {
              print "ERROR: value mismatch for " new > "/dev/stderr"
              ok = 0
            }
            if (old in newkeys) {
              print "ERROR: old key still present: " old > "/dev/stderr"
              ok = 0
            }
          }
        }
      }
      exit ok ? 0 : 1
    }
    ' config/renames.conf <(git show HEAD^:config/settings.conf) config/settings.conf
  expect_exit: 0
  expect_pattern: null
- name: config_file_committed
  description: config/settings.conf has no uncommitted changes after the commit
  probe: test -z "$(git status --porcelain -- config/settings.conf)"
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: Fix the stale config entry the app is warning about, without
    losing any setting. Rename the old key in the project's settings and keep its
    value.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Fix the stale config entry the app is warning about, without losing
    any setting. Rename the old key in the project's settings and keep its value./seed-8-config_renamed-7516
  fault: config_renamed
status: admitted
