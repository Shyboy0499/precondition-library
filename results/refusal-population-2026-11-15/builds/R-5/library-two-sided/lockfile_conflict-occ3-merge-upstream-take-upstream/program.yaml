id: lockfile_conflict-occ3-merge-upstream-take-upstream
intent: Catch up with upstream by merging it and resolving every conflicting file
  by starting from upstream's version and re-adding only the lines the local side
  added, so nothing either side removed is revived and nothing either side added is
  lost, then committing the merge.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ref_present
  description: the upstream remote-tracking branch exists locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: behind_upstream
  description: upstream has at least one commit HEAD does not contain
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the local branch has at least one commit upstream does not contain
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree and index are clean and no merge is already in progress
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: merge_really_conflicts
  description: at least one path changed on both sides since the merge base has overlapping
    hunks, so the merge actually conflicts rather than fast-forwarding or merging
    cleanly
  probe: |-
    export LC_ALL=C
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    found=0
    while IFS= read -r -d '' f; do
      [ -n "$f" ] || continue
      a=$(git diff -U0 --no-color "$base" HEAD -- "$f" 2>/dev/null | awk '/^@@ /{split($2,x,","); sub(/^-/,"",x[1]); n=x[1]+0; s=(length(x[2])?x[2]:1)+0; if(s>0) printf "%d %d\n", n*2, (n+s-1)*2; else printf "%d %d\n", n*2+1, n*2+1}')
      b=$(git diff -U0 --no-color "$base" {upstream_remote}/{upstream_branch} -- "$f" 2>/dev/null | awk '/^@@ /{split($2,x,","); sub(/^-/,"",x[1]); n=x[1]+0; s=(length(x[2])?x[2]:1)+0; if(s>0) printf "%d %d\n", n*2, (n+s-1)*2; else printf "%d %d\n", n*2+1, n*2+1}')
      if [ -n "$a" ] && [ -n "$b" ]; then
        if awk -v a="$a" -v b="$b" 'BEGIN{split(a,A,"\n"); split(b,B,"\n"); for(i in A){if(A[i]=="")continue; split(A[i],p," "); for(j in B){if(B[j]=="")continue; split(B[j],q," "); if(p[1]+0<=q[2]+0 && q[1]+0<=p[2]+0) exit 0}} exit 1}'; then
          found=1
          break
        fi
      fi
    done < <(comm -12 <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort -u) <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u) | tr '\n' '\0')
    [ "$found" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
- name: local_removals_not_revived
  description: in every file both sides changed, no line the local side removed is
    still present upstream, so starting from upstream's version cannot revive a locally
    removed line
  probe: |-
    export LC_ALL=C
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    ok=1
    while IFS= read -r -d '' f; do
      [ -n "$f" ] || continue
      git cat-file -e "$base:$f" 2>/dev/null || continue
      git cat-file -e "HEAD:$f" 2>/dev/null || continue
      git cat-file -e "{upstream_remote}/{upstream_branch}:$f" 2>/dev/null || continue
      removed=$(comm -23 <(git show "$base:$f" | sort -u) <(git show "HEAD:$f" | sort -u) | grep -v '^$')
      [ -n "$removed" ] || continue
      revived=$(comm -12 <(printf '%s\n' "$removed" | sort -u) <(git show "{upstream_remote}/{upstream_branch}:$f" | sort -u))
      if [ -n "$revived" ]; then
        ok=0
        break
      fi
    done < <(comm -12 <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort -u) <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u) | tr '\n' '\0')
    [ "$ok" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote} || true
  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git merge --no-ff --no-commit {upstream_remote}/{upstream_branch} || true
  fi
  tmp=$(mktemp -d)
  git diff --name-only --diff-filter=U -z | tr '\0' '\n' > "$tmp/conflicts"
  while IFS= read -r f; do
    [ -n "$f" ] || continue
    if ! git cat-file -e "MERGE_HEAD:$f" 2>/dev/null || ! git cat-file -e "HEAD:$f" 2>/dev/null; then
      git rm -f --ignore-unmatch -- "$f" >/dev/null 2>&1
      continue
    fi
    base=$(git merge-base HEAD MERGE_HEAD)
    git show "MERGE_HEAD:$f" > "$tmp/up"
    git show "HEAD:$f" > "$tmp/local"
    if git cat-file -e "$base:$f" 2>/dev/null; then
      git show "$base:$f" > "$tmp/base"
    else
      : > "$tmp/base"
    fi
    git diff --no-index -U0 "$tmp/base" "$tmp/local" > "$tmp/ldiff" 2>/dev/null || true
    awk '
      function flush(   i) {
        if (na > nd) for (i = nd + 1; i <= na; i++) print adds[i]
        na = 0; nd = 0
      }
      /^@@/ { flush(); next }
      /^\+\+\+/ { next }
      /^---/ { next }
      /^\+/ { adds[++na] = substr($0, 2); next }
      /^-/ { nd++; next }
      END { flush() }
    ' "$tmp/ldiff" > "$tmp/add"
    if [ -s "$tmp/add" ]; then
      grep -v '^$' "$tmp/up" > "$tmp/uppat" 2>/dev/null || true
      grep -vxF -f "$tmp/uppat" "$tmp/add" > "$tmp/add2" 2>/dev/null || true
      cat "$tmp/add2" > "$tmp/add"
    fi
    if [ -s "$tmp/add" ]; then
      anchor=$(ADD="$tmp/add" UP="$tmp/up" awk '
        FILENAME == ENVIRON["ADD"] { add[$0] = 1; next }
        FILENAME == ENVIRON["UP"] { up[$0] = 1; next }
        { L[++n] = $0 }
        END {
          last = 0
          for (i = 1; i <= n; i++) if (L[i] in add) last = i
          for (i = last + 1; i <= n; i++) if (L[i] in up) { print L[i]; exit }
        }' "$tmp/add" "$tmp/up" "$tmp/local")
      if [ -z "$anchor" ] && [ -s "$tmp/up" ]; then
        anchor=$(tail -n 1 "$tmp/up")
      fi
      ADD="$tmp/add" ANCHOR="$anchor" awk '
        FILENAME == ENVIRON["ADD"] { A[++na] = $0; next }
        {
          if (!done && ENVIRON["ANCHOR"] != "" && $0 == ENVIRON["ANCHOR"]) {
            for (i = 1; i <= na; i++) print A[i]
            done = 1
          }
          print
        }
        END { if (!done) for (i = 1; i <= na; i++) print A[i] }
      ' "$tmp/add" "$tmp/up" > "$tmp/merged"
    else
      cat "$tmp/up" > "$tmp/merged"
    fi
    cat "$tmp/merged" > "$f"
    git add -- "$f"
  done < "$tmp/conflicts"
  rm -rf "$tmp"
  git commit -m "merge {upstream_remote}/{upstream_branch}: keep upstream deps and re-add local additions" || true
steps: null
postconditions:
- name: merge_completed
  description: no merge is left in progress
  probe: '! git rev-parse -q --verify MERGE_HEAD'
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: the upstream branch is now an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_keeps_local_history
  description: HEAD is a two-parent commit whose first parent is the pre-merge local
    tip, not upstream
  probe: test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 3 && test
    "$(git rev-parse HEAD^1)" != "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_markers
  description: no tracked file still contains conflict markers
  probe: '! git grep -I -n -e ''^<<<<<<< '' -e ''^>>>>>>> '' -- .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree is clean after the merge commit
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: Catch up with upstream without losing what either side added,
    or reviving what either side removed. Start from upstream's dependency file and
    add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Catch up with upstream without losing what either side added, or reviving
    what either side removed. Start from upstream's dependency file and add back what
    I added./seed-5-lockfile_conflict-7516
  fault: lockfile_conflict
status: candidate
