id: diverged-occ3-sync-fork-discard-no-local-changes
intent: Bring the current branch back in line with upstream by discarding local-only
  commits that introduce no file changes, so the branch matches upstream exactly.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the named upstream remote is configured in this repository
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: a remote-tracking ref for the upstream branch is already present
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch, not detached
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_branch_is_target
  description: the upstream remote's default branch is the branch being synced, or
    the remote HEAD is unset
  probe: '[ -z "$(git symbolic-ref -q refs/remotes/{upstream_remote}/HEAD)" ] || [
    "$(git symbolic-ref -q refs/remotes/{upstream_remote}/HEAD)" = "refs/remotes/{upstream_remote}/{upstream_branch}"
    ]'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no staged, unstaged or untracked changes to lose
  probe: '! git status --porcelain -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index has no unresolved merge entries
  probe: '! git ls-files -u -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: has_local_commits_to_discard
  description: the current branch carries local commits that upstream does not have
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_has_new_commits
  description: upstream has commits the current branch does not have
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: local_commits_change_nothing
  description: the local-only commits introduce no file changes relative to the merge
    base, so discarding them loses no content
  probe: git diff --quiet {upstream_remote}/{upstream_branch}...HEAD
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream branch commit
  probe: '[ "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
    ]'
  expect_exit: 0
  expect_pattern: null
- name: no_local_commits_ahead
  description: the branch has no commits that upstream lacks
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^0$
- name: no_upstream_commits_behind
  description: the branch is not missing any upstream commits
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^0$
- name: worktree_clean_after
  description: the working tree is clean after the reset
  probe: '! git status --porcelain -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths_after
  description: the index has no unresolved merge entries after the reset
  probe: '! git ls-files -u -z | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Upstream moved ahead of me. Get me back in line with it. My
    local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Upstream moved ahead of me. Get me back in line with it. My local commits
    can go: make my branch match upstream exactly./seed-3-diverged-7516'
  fault: diverged
status: admitted
