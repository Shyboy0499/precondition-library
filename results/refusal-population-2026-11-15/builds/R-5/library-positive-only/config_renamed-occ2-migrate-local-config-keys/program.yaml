id: config_renamed-occ2-migrate-local-config-keys
intent: Rename stale setting names in the user's own git-ignored config override file
  to the current names declared by the repository's tracked renames mapping, preserving
  each value and keeping the override file untracked and ignored.
parameters: []
preconditions:
- name: renames_mapping_present
  description: The repository tracks config/renames.conf and it contains at least
    one non-comment "old = new" mapping line.
  probe: |-
    git ls-files --error-unmatch config/renames.conf >/dev/null 2>&1 &&
    grep -Eq '^[[:space:]]*[^#[:space:]][^=]*=[[:space:]]*[^[:space:]]' config/renames.conf
  expect_exit: 0
  expect_pattern: null
- name: ignored_local_override_present
  description: config/local.conf exists on disk, is not tracked by git, and is ignored
    by git (so it is the user's own out-of-git override file).
  probe: |-
    test -f config/local.conf &&
    git check-ignore -q config/local.conf &&
    ! git ls-files --error-unmatch config/local.conf >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: local_override_has_stale_key
  description: config/local.conf sets at least one key that config/renames.conf maps
    from an old name to a current name.
  probe: |-
    awk -F'=' '
      FNR==NR {
        if ($0 ~ /^[[:space:]]*#/ || $0 ~ /^[[:space:]]*$/) next
        old=$1; new=$2
        gsub(/^[[:space:]]+/, "", old); gsub(/[[:space:]]+$/, "", old)
        gsub(/^[[:space:]]+/, "", new); gsub(/[[:space:]]+$/, "", new)
        if (old != "" && new != "") olds[old]=1
        next
      }
      {
        if ($0 ~ /^[[:space:]]*#/) next
        eq=index($0,"="); if (eq==0) next
        key=substr($0,1,eq-1)
        gsub(/^[[:space:]]+/, "", key); gsub(/[[:space:]]+$/, "", key)
        if (key in olds) found=1
      }
      END { exit found ? 0 : 1 }
    ' config/renames.conf config/local.conf
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  map=config/renames.conf
  maps=$(mktemp)
  files=$(mktemp)
  tmp=$(mktemp)
  trap 'rm -f "$maps" "$files" "$tmp"' EXIT

  # old -> new table from the tracked renames mapping
  awk -F'=' '
    /^[[:space:]]*#/ { next }
    /^[[:space:]]*$/ { next }
    {
      old=$1; new=$2
      gsub(/^[[:space:]]+/, "", old); gsub(/[[:space:]]+$/, "", old)
      gsub(/^[[:space:]]+/, "", new); gsub(/[[:space:]]+$/, "", new)
      if (old != "" && new != "") printf "%s\t%s\n", old, new
    }
  ' "$map" > "$maps"

  # the user's own override files: untracked and ignored, under config/
  git ls-files --others --ignored --exclude-standard -z -- config \
    | tr '\0' '\n' > "$files"

  while IFS= read -r f; do
    [ -n "$f" ] || continue
    [ -f "$f" ] || continue
    awk -F'\t' '
      FNR==NR { M[$1]=$2; next }
      {
        eq=index($0,"=")
        if (eq == 0) { print; next }
        key=substr($0,1,eq-1)
        rest=substr($0,eq+1)
        k=key
        gsub(/^[[:space:]]+/, "", k); gsub(/[[:space:]]+$/, "", k)
        if (k in M) print M[k] " =" rest
        else print
      }
    ' "$maps" "$f" > "$tmp"
    cat "$tmp" > "$f"
  done < "$files"
steps: null
postconditions:
- name: no_stale_key_remains
  description: config/local.conf no longer sets any key that config/renames.conf maps
    from an old name.
  probe: |-
    awk -F'=' '
      FNR==NR {
        if ($0 ~ /^[[:space:]]*#/ || $0 ~ /^[[:space:]]*$/) next
        old=$1; new=$2
        gsub(/^[[:space:]]+/, "", old); gsub(/[[:space:]]+$/, "", old)
        gsub(/^[[:space:]]+/, "", new); gsub(/[[:space:]]+$/, "", new)
        if (old != "" && new != "") olds[old]=1
        next
      }
      {
        if ($0 ~ /^[[:space:]]*#/) next
        eq=index($0,"="); if (eq==0) next
        key=substr($0,1,eq-1)
        gsub(/^[[:space:]]+/, "", key); gsub(/[[:space:]]+$/, "", key)
        if (key in olds) found=1
      }
      END { exit found ? 1 : 0 }
    ' config/renames.conf config/local.conf
  expect_exit: 0
  expect_pattern: null
- name: new_key_present
  description: config/local.conf now sets at least one key under its current name
    as listed in config/renames.conf.
  probe: |-
    awk -F'=' '
      FNR==NR {
        if ($0 ~ /^[[:space:]]*#/ || $0 ~ /^[[:space:]]*$/) next
        old=$1; new=$2
        gsub(/^[[:space:]]+/, "", old); gsub(/[[:space:]]+$/, "", old)
        gsub(/^[[:space:]]+/, "", new); gsub(/[[:space:]]+$/, "", new)
        if (old != "" && new != "") news[new]=1
        next
      }
      {
        if ($0 ~ /^[[:space:]]*#/) next
        eq=index($0,"="); if (eq==0) next
        key=substr($0,1,eq-1)
        gsub(/^[[:space:]]+/, "", key); gsub(/[[:space:]]+$/, "", key)
        if (key in news) found=1
      }
      END { exit found ? 0 : 1 }
    ' config/renames.conf config/local.conf
  expect_exit: 0
  expect_pattern: null
- name: local_override_still_untracked_and_ignored
  description: config/local.conf still exists, is still ignored by git, and is still
    not tracked.
  probe: |-
    test -f config/local.conf &&
    git check-ignore -q config/local.conf &&
    ! git ls-files --error-unmatch config/local.conf >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
variant: migrate_local
provenance:
  compiled_from_task: Bring my configuration up to date with the setting names the
    app uses now. Rename the old key in my own override file, and keep that file out
    of git.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Bring my configuration up to date with the setting names the app uses
    now. Rename the old key in my own override file, and keep that file out of git./seed-2-config_renamed-7516
  fault: config_renamed
status: admitted
