id: dirty_tree-occ2-stash-ff-restore
intent: Stash uncommitted work, fast-forward the current branch to upstream, and restore
  the stashed work.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_dirty
  description: the worktree has uncommitted tracked or untracked changes to preserve
  probe: test -n "$(git status --porcelain --untracked-files=all)"
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch that can be updated
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_or_rebase_in_progress
  description: no merge, cherry-pick, revert, or rebase is in progress
  probe: |-
    test ! -e "$(git rev-parse --git-path MERGE_HEAD)" &&
    test ! -e "$(git rev-parse --git-path CHERRY_PICK_HEAD)" &&
    test ! -e "$(git rev-parse --git-path REVERT_HEAD)" &&
    test ! -d "$(git rev-parse --git-path rebase-merge)" &&
    test ! -d "$(git rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index has no unresolved merge entries
  probe: '! git ls-files --unmerged | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the remote-tracking branch to merge exists
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: local_behind_upstream
  description: the current branch is behind the upstream branch
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_not_ahead_of_upstream
  description: the current branch has no commits that upstream lacks, so it can fast-forward
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: tracked_changes_do_not_overlap_upstream
  description: no locally modified tracked file is changed by upstream
  probe: |-
    ! comm -12 \
      <(git diff --name-only -z HEAD | tr '\0' '\n' | sort) \
      <(git diff --no-renames --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: untracked_files_do_not_collide_with_upstream
  description: no untracked file has the same path as a file upstream changes
  probe: |-
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --no-renames --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  git stash push --include-untracked -m "WIP autostash before updating branch"
  if git merge --ff-only {upstream_remote}/{upstream_branch}; then
    git stash pop
  else
    git stash pop
    exit 1
  fi
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is the upstream commit after the fast-forward
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_dirty_restored
  description: the stashed changes are back in the worktree
  probe: test -n "$(git status --porcelain --untracked-files=all)"
  expect_exit: 0
  expect_pattern: null
- name: autostash_entry_consumed
  description: the temporary autostash entry is no longer present
  probe: '! git stash list --format=%s | grep -qF ''WIP autostash before updating
    branch'''
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: restoring the stash left no conflict entries in the index
  probe: '! git ls-files --unmerged | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: stash
provenance:
  compiled_from_task: I am in the middle of something and upstream moved on. Sort
    it out without losing my edits. Stash my uncommitted work, update the branch,
    then put my work back.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I am in the middle of something and upstream moved on. Sort it out without
    losing my edits. Stash my uncommitted work, update the branch, then put my work
    back./seed-10-dirty_tree-7516
  fault: dirty_tree
status: admitted
