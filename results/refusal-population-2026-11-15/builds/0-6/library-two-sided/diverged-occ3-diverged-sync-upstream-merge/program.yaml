id: diverged-occ3-diverged-sync-upstream-merge
intent: Merge the upstream branch into the current local branch so that both histories
  are preserved in a merge commit, firing only when the branch has genuinely diverged
  from the branch the remote actually designates and the merge applies without conflicts.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: there are no staged, unstaged, or untracked changes
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD points at a local branch that a merge can advance
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: the named upstream remote is configured
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream remote-tracking branch is present locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: branches_diverged
  description: local branch and upstream each have commits the other lacks
  probe: |-
    local_ahead=$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD) &&
    upstream_ahead=$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch}) &&
    [ "$local_ahead" -gt 0 ] && [ "$upstream_ahead" -gt 0 ]
  expect_exit: 0
  expect_pattern: null
- name: remote_default_not_elsewhere
  description: when the upstream remote advertises a default branch, it is the branch
    being merged and not one it was renamed to
  probe: |-
    head_ref=$(git symbolic-ref --quiet refs/remotes/{upstream_remote}/HEAD) || exit 0
    [ "$head_ref" = "refs/remotes/{upstream_remote}/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: tracked_upstream_matches
  description: when the current branch records an upstream, it is the branch being
    merged rather than a stale name left behind by a rename
  probe: |-
    tracked=$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null) || exit 0
    [ "$tracked" = "{upstream_remote}/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: merge_applies_cleanly
  description: merging the upstream tip produces no content conflicts
  probe: |-
    git merge-tree --write-tree HEAD {upstream_remote}/{upstream_branch} >/dev/null 2>&1
    rc=$?
    [ "$rc" -eq 0 ] || [ "$rc" -ne 1 ]
  expect_exit: 0
  expect_pattern: null
- name: index_has_no_conflicts
  description: the index holds no unmerged entries to start from
  probe: '[ -z "$(git ls-files -u)" ]'
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git merge --no-edit --no-ff {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit with at least two parents
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_second_parent
  description: the upstream tip is the second parent of the merge
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: upstream_fully_merged
  description: every upstream commit is reachable from HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the merge left no uncommitted changes
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no conflicted merge state remains
  probe: '! git rev-parse --verify --quiet MERGE_HEAD'
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries_after
  description: the index has no unmerged entries after the merge
  probe: '[ -z "$(git ls-files -u)" ]'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-7488
  fault: diverged
status: admitted
