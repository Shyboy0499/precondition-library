id: diverged-occ2-discard-diverged-empty-local
intent: Make the current branch match the upstream branch exactly by hard-resetting
  it to upstream and dropping the local commits, in the case where those local commits
  carry no content changes of their own.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote | grep -Fx -- '{upstream_remote}'
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the remote-tracking ref for the upstream branch is available locally
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}^{commit}'
  expect_exit: 0
  expect_pattern: null
- name: head_is_on_branch
  description: HEAD is attached to a local branch, so the reset moves that branch
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no staged, unstaged, or untracked changes
  probe: git diff --quiet && git diff --cached --quiet && test -z "$(git ls-files
    --others --exclude-standard -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries
  description: the index has no conflicted (unmerged) entries
  probe: test -z "$(git ls-files -u -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_present
  description: the current branch has commits that upstream does not contain
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_present
  description: upstream has commits that the current branch does not contain
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_commits_carry_no_content_changes
  description: the commits unique to the local branch leave the tree identical to
    the merge base, so discarding them keeps no local content and no sibling resolution
    applies
  probe: git diff --quiet "$(git merge-base HEAD '{upstream_remote}/{upstream_branch}')"
    HEAD
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch '{upstream_remote}' '{upstream_branch}'
  git reset --hard '{upstream_remote}/{upstream_branch}'
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream branch commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: no commits remain that upstream lacks
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_reset
  description: the working tree has no staged, unstaged, or untracked changes after
    the reset
  probe: git diff --quiet && git diff --cached --quiet && test -z "$(git ls-files
    --others --exclude-standard -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Upstream moved ahead of me. Get me back in line with it. My
    local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Upstream moved ahead of me. Get me back in line with it. My local commits
    can go: make my branch match upstream exactly./seed-3-diverged-7488'
  fault: diverged
status: admitted
