id: branch_renamed-occ1-retrack-branch-to-upstream-mainline
intent: Keep the current local branch's name, repoint its upstream tracking at the
  upstream remote's current main-line branch, and fast-forward it to that branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_target_ref_exists
  description: the remote-tracking ref for upstream's current main line is present
    locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a local branch, so its name can be preserved and
    its tracking repointed
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: tracking_points_elsewhere
  description: the current branch does not already track the target upstream branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null)"
    != "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no staged, unstaged or untracked changes that a fast-forward would
    have to cross
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: fast_forwardable_to_target
  description: the current branch's tip is an ancestor of the target branch, so only
    a fast-forward is needed
  probe: git merge-base --is-ancestor HEAD refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch --prune {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_target
  description: the current branch now tracks the target upstream branch
  probe: git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}'
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/{upstream_branch}$
- name: matches_target
  description: the current branch's tip equals the target upstream branch's tip
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the fast-forward left no staged, unstaged or untracked changes behind
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Keep my branch's name, point its tracking at upstream's new branch
    and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Keep my branch's name, point its tracking at upstream's new branch and
    catch up./seed-6-branch_renamed-7488
  fault: branch_renamed
status: admitted
