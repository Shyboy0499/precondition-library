id: dirty_tree-occ3-commit-dirty-then-merge-upstream
intent: Commit all uncommitted changes, then fetch and merge the upstream branch so
  the current branch includes the latest upstream work while preserving local changes.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_local_branch
  description: HEAD is attached to a local branch that can be advanced
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_uncommitted_changes
  description: the index, working tree, or untracked files contain changes to save
  probe: git status --porcelain -z | tr '\0' '\n' | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the configured upstream branch is already known locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: the upstream branch contains at least one commit not in HEAD
  probe: test "$(git rev-list --count HEAD..refs/remotes/{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_upstream_collision
  description: no untracked file is also changed by the upstream branch
  probe: |-
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD refs/remotes/{upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: there is no unfinished merge in the repository
  probe: '! test -e "$(git rev-parse --git-path MERGE_HEAD)"'
  expect_exit: 0
  expect_pattern: null
body: |
  git add -A
  git commit -m "wip: save uncommitted work"
  git fetch {upstream_remote}
  git merge {upstream_remote}/{upstream_branch} --no-edit
steps: null
postconditions:
- name: worktree_clean
  description: all pre-existing changes have been committed
  probe: '! git status --porcelain -z | grep -qz .'
  expect_exit: 0
  expect_pattern: null
- name: upstream_merged
  description: the fetched upstream branch is an ancestor of HEAD
  probe: git merge-base --is-ancestor refs/remotes/{upstream_remote}/{upstream_branch}
    HEAD
  expect_exit: 0
  expect_pattern: null
- name: saved_work_commit_present
  description: a commit recording the saved work exists in history
  probe: 'git log --format=%s --grep=''wip: save uncommitted work'' | grep -q ''wip:
    save uncommitted work'''
  expect_exit: 0
  expect_pattern: null
variant: commit
provenance:
  compiled_from_task: Get the latest from upstream here, and keep every change I have
    not saved yet. Commit my uncommitted work first, then bring the branch up to date.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get the latest from upstream here, and keep every change I have not
    saved yet. Commit my uncommitted work first, then bring the branch up to date./seed-1-dirty_tree-10981
  fault: dirty_tree
status: admitted
