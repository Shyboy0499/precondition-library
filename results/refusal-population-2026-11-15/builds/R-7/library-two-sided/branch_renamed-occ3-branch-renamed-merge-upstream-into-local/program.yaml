id: branch_renamed-occ3-branch-renamed-merge-upstream-into-local
intent: Retarget the current branch to track a renamed upstream branch and merge that
  branch into the local commits.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: git_repository
  description: the working directory is inside a Git work tree
  probe: git rev-parse --is-inside-work-tree
  expect_exit: 0
  expect_pattern: ^true$
- name: worktree_clean
  description: there are no tracked or untracked changes in the work tree
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_fetched
  description: the remote-tracking ref for the new upstream branch exists locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: has_local_commits_not_upstream
  description: the current branch has at least one commit that is not on the new upstream
    branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_not_already_merged
  description: the new upstream tip is not already an ancestor of HEAD
  probe: '! git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD'
  expect_exit: 0
  expect_pattern: null
- name: tracking_not_already_new_branch
  description: the current branch is not already tracking the new upstream branch
  probe: b=$(git symbolic-ref --short HEAD) && ! { test "$(git config --get branch.$b.remote)"
    = "{upstream_remote}" && test "$(git config --get branch.$b.merge)" = "refs/heads/{upstream_branch}";
    }
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch --prune {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --no-edit {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_new_upstream
  description: the current branch tracks the new upstream branch
  probe: b=$(git symbolic-ref --short HEAD) && test "$(git config --get branch.$b.remote)"
    = "{upstream_remote}" && test "$(git config --get branch.$b.merge)" = "refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_merged
  description: the new upstream branch is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the merge left no uncommitted changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index has no conflict entries
  probe: '! git ls-files -u | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_created
  description: merging the new upstream branch created a merge commit on the current
    branch
  probe: test "$(git rev-list --count --merges {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_commit_preserved
  description: the branch still has commits that are not on the new upstream branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Track upstream's new branch and merge it into my own commits.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Track upstream's new branch and merge it into my own commits./seed-1-branch_renamed-10981
  fault: branch_renamed
status: admitted
