id: diverged-occ1-diverged-reset-branch-to-upstream-discard
intent: When the current branch has diverged from upstream and its local-only commits
  carry no file changes, drop them and reset the branch so it matches upstream exactly.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: the upstream remote is configured
  probe: git remote | grep -Fxq '{upstream_remote}'
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: a remote-tracking ref for the upstream branch is present locally
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: on_a_local_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no modified, staged or untracked files that a reset would
    trample
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_stashed_work
  description: the stash list is empty, so nothing is hidden away
  probe: '! git stash list | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index holds no conflicted (unmerged) paths
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: branch_diverged_from_upstream
  description: the branch has local-only commits and upstream has commits the branch
    lacks
  probe: |-
    test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -gt 0 &&
    test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_commits_change_no_files
  description: the local-only commits introduce no file changes, so discarding them
    loses no work
  probe: |-
    mb=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
    ! git diff --name-only -z "$mb" HEAD | tr '\0' '\n' | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_branch_not_renamed
  description: the upstream default branch, when it names a real branch, is the branch
    this repository tracks; a renamed upstream default means following the rename
    instead of resetting
  probe: |-
    d=$(git ls-remote --symref {upstream_remote} HEAD 2>/dev/null | sed -n 's|^ref: refs/heads/\([^[:space:]]*\).*|\1|p')
    cur=$(git symbolic-ref --short HEAD)
    test -z "$d" || test "$d" = "$cur" || ! git ls-remote --heads {upstream_remote} "refs/heads/$d" 2>/dev/null | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream tip
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_commits_ahead_or_behind
  description: the branch has no commits on either side that the other lacks
  probe: |-
    test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -eq 0 &&
    test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -eq 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_reset
  description: the working tree is clean after the reset
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths_after_reset
  description: no conflicted paths remain in the index
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Upstream moved ahead of me. Get me back in line with it. My
    local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Upstream moved ahead of me. Get me back in line with it. My local commits
    can go: make my branch match upstream exactly./seed-3-diverged-10981'
  fault: diverged
status: admitted
