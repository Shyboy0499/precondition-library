id: diverged-occ3-sync-fork-discard
intent: Bring the local branch back in sync with upstream by discarding the local-only
  commits, so the branch matches upstream exactly.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_available
  description: a remote-tracking ref for the upstream branch is already known locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked modifications or staged changes to lose
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: has_local_only_commits
  description: the current branch carries commits the upstream branch does not have
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream branch tip
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: no commits remain that upstream does not have
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree has no tracked modifications or staged changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-211'
  fault: diverged
status: admitted
