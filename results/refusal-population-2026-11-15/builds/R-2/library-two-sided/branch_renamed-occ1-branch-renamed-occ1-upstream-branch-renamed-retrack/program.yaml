id: branch_renamed-occ1-branch-renamed-occ1-upstream-branch-renamed-retrack
intent: when upstream renames its default branch, fetch with prune, point the local
  branch's upstream at the renamed upstream branch, and merge it into the local commits
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: clean_worktree
  description: no staged, unstaged or untracked changes in the working tree
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is a symbolic ref to a local branch, not a detached HEAD
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: renamed_upstream_ref_present
  description: the remote-tracking ref for upstream's renamed branch exists locally
  probe: git show-ref --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: not_yet_tracking_renamed_branch
  description: the current branch's configured upstream is not upstream's renamed
    branch
  probe: '! git rev-parse --abbrev-ref ''@{u}'' | grep -qx ''{upstream_remote}/{upstream_branch}'''
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch carries at least one commit upstream's renamed branch
    lacks
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_commits_ahead
  description: upstream's renamed branch carries at least one commit the current branch
    lacks, so a merge is required
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
body: |
  set -e
  git fetch --prune {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --no-edit {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_renamed_upstream
  description: the current branch now tracks upstream's renamed branch
  probe: git rev-parse --abbrev-ref '@{u}'
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/{upstream_branch}$
- name: upstream_merged_into_head
  description: upstream's renamed branch is fully contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_preserved
  description: HEAD still carries commits on top of upstream's renamed branch
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: worktree_clean
  description: the merge left no uncommitted or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Upstream changed something about its branches and my checkout
    is lost. Sort it out. Track upstream's new branch and merge it into my own commits.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream changed something about its branches and my checkout is lost.
    Sort it out. Track upstream's new branch and merge it into my own commits./seed-2-branch_renamed-3202
  fault: branch_renamed
status: admitted
