id: diverged-occ3-diverged-occ3-sync-fork-discard
intent: Bring the local branch back in sync with upstream by discarding the local-only
  commits, so the branch matches upstream exactly.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_available
  description: a remote-tracking ref for the upstream branch is already known locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked modifications or staged changes to lose
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: current_branch_matches_known_upstream_default
  description: the current branch is the upstream default branch when that default
    is known
  probe: |-
    default=$(git rev-parse --abbrev-ref refs/remotes/{upstream_remote}/HEAD 2>/dev/null || true)
    test -z "$default" || test "${default##*/}" = "$(git rev-parse --abbrev-ref HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream carries commits the local branch does not have
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: no_overlapping_changed_files
  description: local-only commits and upstream commits do not touch the same paths
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    ! comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort -u) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: enough_local_commits_for_discard
  description: the branch has at least three local-only commits, the condition under
    which discarding them is the intended resolution
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -ge 3
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream branch tip
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: no commits remain that upstream does not have
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree has no tracked modifications or staged changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-211'
  fault: diverged
status: candidate
