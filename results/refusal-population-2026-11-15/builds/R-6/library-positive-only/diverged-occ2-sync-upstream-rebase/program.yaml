id: diverged-occ2-sync-upstream-rebase
intent: Replay local commits on top of upstream so the history stays linear
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote is present
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the remote-tracking ref for the upstream branch exists
  probe: git rev-parse --verify --quiet "{upstream_remote}/{upstream_branch}^{commit}"
  expect_exit: 0
  expect_pattern: null
- name: on_attached_branch
  description: HEAD is attached to a local branch that rebase can update
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_uncommitted_tracked_changes
  description: the index and tracked working tree have no uncommitted changes
  probe: git diff --quiet && git diff --cached --quiet
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_or_rebase_in_progress
  description: no merge or rebase operation is already in progress
  probe: |-
    ! test -e "$(git rev-parse --git-path MERGE_HEAD)" && \
    ! test -d "$(git rev-parse --git-path rebase-merge)" && \
    ! test -d "$(git rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_collision_with_upstream
  description: no untracked file would be overwritten by upstream's changes
  probe: |-
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD...{upstream_remote}/{upstream_branch} \
        | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead_of_upstream
  description: local history has at least one commit not in upstream
  probe: git rev-list --count "{upstream_remote}/{upstream_branch}..HEAD"
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_commits_ahead_of_local
  description: upstream has at least one commit not in local history
  probe: git rev-list --count "HEAD..{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
body: |
  set -e
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream branch is an ancestor of HEAD after rebasing
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: not_behind_upstream
  description: local history contains every upstream commit
  probe: git rev-list --count "HEAD..{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: ^0$
- name: local_commits_replayed
  description: local commits remain on top of upstream
  probe: git rev-list --count "{upstream_remote}/{upstream_branch}..HEAD"
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: history_is_linear
  description: no merge commits exist above upstream
  probe: '! git rev-list --merges "{upstream_remote}/{upstream_branch}..HEAD" | grep
    -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_uncommitted_tracked_changes_after
  description: the rebase left the index and tracked working tree clean
  probe: git diff --quiet && git diff --cached --quiet
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_in_progress_after
  description: the rebase completed without leaving rebase state behind
  probe: |-
    ! test -d "$(git rev-parse --git-path rebase-merge)" && \
    ! test -d "$(git rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: Upstream moved ahead of me. Get me back in line with it. Replay
    my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream moved ahead of me. Get me back in line with it. Replay my local
    commits on top of upstream so the history stays linear./seed-2-diverged-17967
  fault: diverged
status: admitted
