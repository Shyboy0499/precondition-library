id: diverged-occ5-sync-fork-merge
intent: Get a diverged fork back in sync with upstream without losing local commits
  by merging the upstream branch into the current local branch, keeping both histories
  in a real merge commit.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_local_branch
  description: HEAD points at a local branch (not a detached HEAD), so a merge can
    advance it
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: the repository is not already in the middle of a merge
  probe: test ! -e "$(git rev-parse --git-dir)/MERGE_HEAD"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no staged, unstaged or untracked changes that a merge could
    clobber
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_present
  description: the remote-tracking ref for the upstream branch exists locally
  probe: git rev-parse --verify --quiet '{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch has at least one commit that upstream does not have
    (so a merge, not a fast-forward, is required)
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_ahead
  description: the upstream branch has at least one commit the current branch does
    not have
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git merge --no-edit -m "Merge {upstream_remote}/{upstream_branch}" {upstream_remote}/{upstream_branch} || {
    git merge --abort
    exit 1
  }
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit whose second parent is the upstream tip
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: the upstream branch is fully contained in the current history
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_history_preserved
  description: the first parent of the merge still carries the local commits (it is
    not the upstream tip)
  probe: test "$(git rev-parse HEAD^1)" != "$(git rev-parse {upstream_remote}/{upstream_branch})"
    && test "$(git rev-list --count HEAD^1)" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the merge completed with no leftover conflicts or changes
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is left half-finished
  probe: test ! -e "$(git rev-parse --git-dir)/MERGE_HEAD"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories./seed-4-diverged-17967
  fault: diverged
status: admitted
