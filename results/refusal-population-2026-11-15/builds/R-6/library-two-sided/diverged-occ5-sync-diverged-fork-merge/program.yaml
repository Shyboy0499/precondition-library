id: diverged-occ5-sync-diverged-fork-merge
intent: Get a diverged fork back in sync with upstream without losing local commits
  by merging the upstream branch into the current local branch, so both histories
  survive in a real merge commit.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_local_branch
  description: HEAD points at a local branch (not a detached HEAD), so a merge can
    advance it
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: the repository is not already in the middle of a merge
  probe: test ! -e "$(git rev-parse --git-dir)/MERGE_HEAD"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no staged, unstaged or untracked changes that a merge could
    clobber
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_present
  description: the remote-tracking ref for the upstream branch exists locally
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch has at least one commit upstream does not have,
    so a real merge (not a fast-forward) is required
  probe: test "$(git rev-list --count 'refs/remotes/{upstream_remote}/{upstream_branch}'..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_ahead
  description: the upstream branch has at least one commit the current branch does
    not have
  probe: test "$(git rev-list --count 'HEAD..refs/remotes/{upstream_remote}/{upstream_branch}')"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: branch_name_matches_upstream
  description: the local branch carries the same name as the upstream default/tracked
    branch, so the resolution is a merge and not a rename of the local branch onto
    a differently named upstream branch
  probe: |-
    cur="$(git symbolic-ref --quiet --short HEAD)" || exit 1
    test -n "$cur" || exit 1
    test "$cur" = "{upstream_branch}" || exit 1
    up="$(git for-each-ref --format='%(upstream:short)' "refs/heads/$cur")"
    if [ -n "$up" ] && [ "$up" != "{upstream_remote}/$cur" ]; then exit 1; fi
    rh="$(git symbolic-ref --quiet --short "refs/remotes/{upstream_remote}/HEAD" 2>/dev/null || true)"
    if [ -n "$rh" ] && [ "$rh" != "{upstream_remote}/$cur" ]; then exit 1; fi
    rd="$(git ls-remote --symref "{upstream_remote}" HEAD 2>/dev/null | sed -n 's|^ref: refs/heads/\([^[:space:]]*\).*|\1|p' | head -n 1)"
    if [ -n "$rd" ] && [ "$rd" != "$cur" ]; then exit 1; fi
    exit 0
  expect_exit: 0
  expect_pattern: null
- name: merge_would_be_clean
  description: a three-way merge of the upstream tip into HEAD produces no conflicting
    hunks, so no conflict-resolution decision (take upstream / keep local) is pending
  probe: |-
    base="$(git merge-base HEAD 'refs/remotes/{upstream_remote}/{upstream_branch}')" || exit 1
    out="$(git merge-tree "$base" HEAD 'refs/remotes/{upstream_remote}/{upstream_branch}')" || exit 1
    ! printf '%s\n' "$out" | grep -q '^<<<<<<<'
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git merge --no-edit -m "Merge {upstream_remote}/{upstream_branch}" {upstream_remote}/{upstream_branch} || {
    git merge --abort
    exit 1
  }
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit whose second parent is the upstream tip
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse 'refs/remotes/{upstream_remote}/{upstream_branch}')"
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: the upstream branch is fully contained in the current history
  probe: git merge-base --is-ancestor 'refs/remotes/{upstream_remote}/{upstream_branch}'
    HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_history_preserved
  description: the first parent of the merge still carries the local commits rather
    than being the upstream tip
  probe: test "$(git rev-parse HEAD^1)" != "$(git rev-parse 'refs/remotes/{upstream_remote}/{upstream_branch}')"
    && test "$(git rev-list --count HEAD^1)" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the merge completed with no leftover conflicts or uncommitted changes
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is left half-finished
  probe: test ! -e "$(git rev-parse --git-dir)/MERGE_HEAD"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories./seed-4-diverged-17967
  fault: diverged
status: candidate
