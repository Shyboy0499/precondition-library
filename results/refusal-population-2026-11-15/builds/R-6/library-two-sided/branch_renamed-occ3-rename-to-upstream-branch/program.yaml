id: branch_renamed-occ3-rename-to-upstream-branch
intent: Rename the current local branch to the new upstream branch name, make it track
  the upstream branch, and fast-forward it to that branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: clean_worktree
  description: the index and working tree have no changes or untracked files
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: has_checked_out_branch
  description: HEAD is attached to a local branch rather than a detached commit
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: current_branch_differs_from_upstream_name
  description: the current branch still uses its old name
  probe: test "$(git symbolic-ref --short HEAD)" != "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: target_branch_absent
  description: no existing local branch already has the new upstream branch name
  probe: '! git show-ref --verify --quiet "refs/heads/{upstream_branch}"'
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: the configured upstream remote is present
  probe: git remote get-url "{upstream_remote}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream branch has already been fetched as a remote-tracking ref
  probe: git rev-parse --verify --quiet "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: fast_forward_possible
  description: HEAD is an ancestor of the upstream branch, so the branch can fast-forward
  probe: git merge-base --is-ancestor HEAD "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
body: |-
  git branch -m "{upstream_branch}"
  git branch --set-upstream-to="{upstream_remote}/{upstream_branch}" "{upstream_branch}"
  git merge --ff-only "{upstream_remote}/{upstream_branch}"
steps: null
postconditions:
- name: on_renamed_branch
  description: HEAD is the local branch named after the upstream branch
  probe: git symbolic-ref --short HEAD
  expect_exit: 0
  expect_pattern: ^{upstream_branch}$
- name: tracks_upstream_branch
  description: the renamed branch tracks the upstream remote branch
  probe: git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}'
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/{upstream_branch}$
- name: matches_upstream
  description: HEAD is at the upstream branch commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/{upstream_remote}/{upstream_branch}")"
  expect_exit: 0
  expect_pattern: null
- name: clean_after_sync
  description: the worktree is still clean after the rename and fast-forward
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: I think upstream renamed things. Get this fork following it
    again. Rename my branch to upstream's new name and track it.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I think upstream renamed things. Get this fork following it again. Rename
    my branch to upstream's new name and track it./seed-4-branch_renamed-17967
  fault: branch_renamed
status: admitted
