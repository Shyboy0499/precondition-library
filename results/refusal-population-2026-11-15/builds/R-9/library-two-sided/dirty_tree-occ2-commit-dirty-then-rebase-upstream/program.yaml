id: dirty_tree-occ2-commit-dirty-then-rebase-upstream
intent: Commit all uncommitted work, then bring the current branch up to date by rebasing
  it onto the latest fetched upstream branch, keeping the committed work on top.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: the named upstream remote is configured in this repository
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_branch_exists
  description: a remote-tracking ref for the upstream branch is already present locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: shared_history_with_upstream
  description: HEAD and the upstream branch share a commit, so a rebase is meaningful
  probe: git merge-base HEAD refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_committable_changes
  description: the index or working tree holds tracked or untracked changes that a
    commit can capture
  probe: |-
    ! git diff --quiet ||
    ! git diff --cached --quiet ||
    test -n "$(git ls-files --others --exclude-standard -z)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries
  description: the index contains no unmerged paths
  probe: '! git ls-files -u | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_operation_in_progress
  description: no merge, rebase, cherry-pick or revert is in progress
  probe: |-
    ! git rev-parse -q --verify MERGE_HEAD >/dev/null &&
    ! test -d "$(git rev-parse --git-path rebase-merge)" &&
    ! test -d "$(git rev-parse --git-path rebase-apply)" &&
    ! git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null &&
    ! git rev-parse -q --verify REVERT_HEAD >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: commit_identity_available
  description: git can determine an author identity for the new commit
  probe: git var GIT_AUTHOR_IDENT
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_upstream_collision
  description: no untracked local file sits at a path that upstream's incoming commits
    add or change, since committing everything would sweep that file into the commit
    and then collide with upstream on rebase - such a state needs the aside resolution
    instead
  probe: |-
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD refs/remotes/{upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote} +refs/heads/{upstream_branch}:refs/remotes/{upstream_remote}/{upstream_branch}
  git add -A
  git commit -m "wip: save local changes"
  git rebase refs/remotes/{upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: working_tree_clean
  description: no uncommitted changes remain
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor_of_head
  description: HEAD contains the fetched upstream commit
  probe: git merge-base --is-ancestor refs/remotes/{upstream_remote}/{upstream_branch}
    HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_work_sits_on_top
  description: at least one local commit remains on top of the upstream branch after
    the rebase
  probe: test "$(git rev-list --count refs/remotes/{upstream_remote}/{upstream_branch}..HEAD)"
    -ge 1
  expect_exit: 0
  expect_pattern: null
variant: commit
provenance:
  compiled_from_task: Get the latest from upstream here, and keep every change I have
    not saved yet. Commit my uncommitted work first, then bring the branch up to date.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get the latest from upstream here, and keep every change I have not
    saved yet. Commit my uncommitted work first, then bring the branch up to date./seed-1-dirty_tree-12721
  fault: dirty_tree
status: admitted
