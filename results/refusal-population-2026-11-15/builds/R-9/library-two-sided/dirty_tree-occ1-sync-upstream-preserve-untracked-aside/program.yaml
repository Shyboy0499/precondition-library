id: dirty_tree-occ1-sync-upstream-preserve-untracked-aside
intent: Bring the branch up to date with upstream while preserving untracked files
  that collide with upstream paths as <path>.local.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: has_fast_forwardable_upstream_ahead
  description: HEAD is strictly behind the upstream-tracking branch and has no local
    commits, so a fast-forward is possible.
  probe: |-
    test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0 &&
    test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -eq 0
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch, so the fast-forward updates that
    branch.
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_untracked_collision
  description: At least one untracked file has the same path as a file changed between
    HEAD and upstream.
  probe: |-
    comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: tracked_changes_do_not_collide
  description: Locally modified tracked paths do not overlap with paths changed upstream.
  probe: |-
    ! comm -12 \
      <(git diff --name-only -z HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  declare -A upstream_changed=()
  while IFS= read -r -d '' p; do
    upstream_changed["$p"]=1
  done < <(git diff --name-only -z HEAD "{upstream_remote}/{upstream_branch}")

  while IFS= read -r -d '' path; do
    if [[ -n "${upstream_changed[$path]:-}" ]]; then
      mkdir -p -- "$(dirname -- "$path")"
      mv -- "$path" "$path.local"
    fi
  done < <(git ls-files --others --exclude-standard -z)

  git merge --ff-only "{upstream_remote}/{upstream_branch}"
steps: null
postconditions:
- name: head_matches_upstream
  description: The branch was fast-forwarded to the upstream commit.
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: preserved_local_copy_exists
  description: At least one untracked .local copy sits beside a tracked upstream version
    of the same path.
  probe: |-
    found=1
    while IFS= read -r -d '' f; do
      case "$f" in
        *.local)
          base="${f%.local}"
          if git ls-files --error-unmatch -- "$base" >/dev/null 2>&1 && test -e "$base"; then
            found=0
          fi
          ;;
      esac
    done < <(git ls-files --others --exclude-standard -z)
    test "$found" -eq 0
  expect_exit: 0
  expect_pattern: null
variant: aside
provenance:
  compiled_from_task: Bring this branch up to date with upstream, but my work in progress
    must survive. Keep my unsaved file beside upstream's version, as `<name>.local`,
    and update.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Bring this branch up to date with upstream, but my work in progress
    must survive. Keep my unsaved file beside upstream's version, as `<name>.local`,
    and update./seed-2-dirty_tree-12721
  fault: dirty_tree
status: admitted
