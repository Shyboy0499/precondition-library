id: diverged-occ3-sync-fork-discard
intent: Sync the current branch to exactly match upstream, discarding local-only commits
  that carry no changes to paths present in the upstream tree.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote is present
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream remote-tracking branch exists locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: current_branch_attached
  description: HEAD is attached to a local branch
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree and index have no tracked or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: shares_history_with_upstream
  description: the local branch and the upstream branch have a common ancestor
  probe: git merge-base refs/remotes/{upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_local_only_commits
  description: the current branch has commits not present upstream
  probe: test "$(git rev-list --count refs/remotes/{upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index has no unmerged entries
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_matches_sync_target
  description: if the remote advertises a default branch locally, it is the branch
    being synced
  probe: '! git symbolic-ref --quiet refs/remotes/{upstream_remote}/HEAD | grep -v
    -q "refs/remotes/{upstream_remote}/{upstream_branch}$"'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_touch_no_upstream_paths
  description: the local-only commits change no path that exists in the upstream tree,
    so discarding them drops no tracked upstream content
  probe: |-
    ! comm -12 \
      <(git diff --name-only -z refs/remotes/{upstream_remote}/{upstream_branch}...HEAD | tr '\0' '\n' | sort -u) \
      <(git ls-tree -r --name-only -z refs/remotes/{upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git reset --hard refs/remotes/{upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree and index are clean
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-29979'
  fault: diverged
status: admitted
