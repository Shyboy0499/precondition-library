id: diverged-occ1-diverged-merge-upstream-keep-both
intent: Merge the upstream branch into the current branch with a real merge commit,
  preserving both local and upstream histories.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: the working tree and index have no uncommitted changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is already in progress
  probe: test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the upstream remote-tracking branch resolves to a commit
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}^{commit}
  expect_exit: 0
  expect_pattern: null
- name: histories_diverged
  description: both HEAD and upstream have commits the other does not
  probe: |-
    test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -gt 0 &&
    test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: merge_would_be_clean
  description: a three-way merge of HEAD and the upstream branch has no content conflicts
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    conflicts=0
    while IFS= read -r path; do
      [ -n "$path" ] || continue
      if ! git merge-file -p \
          <(git show "HEAD:$path" 2>/dev/null || true) \
          <(git show "$base:$path" 2>/dev/null || true) \
          <(git show "{upstream_remote}/{upstream_branch}:$path" 2>/dev/null || true) \
          >/dev/null 2>&1; then
        conflicts=1
        break
      fi
    done < <(comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort))
    test "$conflicts" -eq 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_matches_current_branch
  description: the upstream remote advertises no default branch, or its default branch
    is the current branch
  probe: |-
    remote_head=$(git symbolic-ref --quiet refs/remotes/{upstream_remote}/HEAD) || exit 0
    remote_branch=${remote_head#refs/remotes/{upstream_remote}/}
    current=$(git symbolic-ref --quiet --short HEAD) || exit 1
    test "$remote_branch" = "$current"
  expect_exit: 0
  expect_pattern: null
body: |-
  git fetch {upstream_remote}
  git merge --no-ff -m "Merge {upstream_remote}/{upstream_branch} into HEAD" {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_is_merge_commit
  description: HEAD is a merge commit with two parents
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_merged
  description: the upstream branch is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the working tree and index are clean after the merge
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories./seed-4-diverged-29979
  fault: diverged
status: candidate
