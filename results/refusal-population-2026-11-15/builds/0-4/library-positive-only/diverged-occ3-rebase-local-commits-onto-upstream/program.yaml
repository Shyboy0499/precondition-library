id: diverged-occ3-rebase-local-commits-onto-upstream
intent: Untangle local work from new upstream commits by replaying the local branch's
  commits on top of upstream so the history stays linear.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_branch
  description: HEAD is a symbolic ref (a branch), not a detached commit
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch has at least one commit that upstream does not have
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_commits_ahead
  description: upstream has at least one commit the current branch does not have
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: worktree_clean
  description: no tracked modifications, staged changes or untracked files
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_operation_in_progress
  description: no rebase or merge is already underway
  probe: test ! -e "$(git rev-parse --git-path rebase-merge)" && test ! -e "$(git
    rev-parse --git-path rebase-apply)" && test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
body: |
  if ! git rebase {upstream_remote}/{upstream_branch}; then
    git rebase --abort || true
    exit 1
  fi
steps: null
postconditions:
- name: upstream_is_ancestor_of_head
  description: the upstream tip is contained in HEAD, so the local commits sit on
    top of it
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: history_linear
  description: no merge commits exist between upstream and HEAD
  probe: '! git rev-list --merges {upstream_remote}/{upstream_branch}..HEAD | grep
    -q .'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_replayed
  description: commits remain on top of upstream after the replay
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: local_changes_preserved
  description: the tree still differs from upstream by the local work
  probe: '! git diff --quiet {upstream_remote}/{upstream_branch} HEAD'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the rebase left no modified or untracked files behind
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_state_left
  description: no rebase state directory remains
  probe: test ! -e "$(git rev-parse --git-path rebase-merge)" && test ! -e "$(git
    rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: I have local work and upstream has new commits. Untangle it.
    Replay my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I have local work and upstream has new commits. Untangle it. Replay
    my local commits on top of upstream so the history stays linear./seed-5-diverged-4812
  fault: diverged
status: admitted
