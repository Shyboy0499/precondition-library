id: config_renamed-occ2-migrate-local-config-rename
intent: Rename stale setting keys in the ignored local override file to the names
  the app currently uses, keeping the file out of git.
parameters: []
preconditions:
- name: rename_map_present
  description: The app declares at least one old-to-new setting rename.
  probe: |-
    test -f config/renames.conf
    awk '
      /^[[:space:]]*#/ { next }
      /^[[:space:]]*$/ { next }
      {
        eq = index($0, "=")
        if (eq == 0) next
        old = substr($0, 1, eq-1)
        new = substr($0, eq+1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
        if (old != "" && new != "" && old != new) found = 1
      }
      END { exit found ? 0 : 1 }
    ' config/renames.conf
  expect_exit: 0
  expect_pattern: null
- name: local_override_ignored
  description: The local override file exists, is ignored by git, and is not tracked.
  probe: |-
    test -f config/local.conf
    git check-ignore -q config/local.conf
    ! git ls-files --error-unmatch config/local.conf >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: local_override_has_stale_key
  description: The local override file still uses at least one key that the app has
    renamed.
  probe: |-
    awk '
      BEGIN {
        while ((getline line < "config/renames.conf") > 0) {
          if (line ~ /^[[:space:]]*#/ || line ~ /^[[:space:]]*$/) continue
          eq = index(line, "=")
          if (eq == 0) continue
          old = substr(line, 1, eq-1)
          new = substr(line, eq+1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          if (old != "" && new != "" && old != new) map[old] = new
        }
        close("config/renames.conf")
      }
      {
        line = $0
        match(line, /^[[:space:]]*/)
        rest = substr(line, RLENGTH+1)
        eq = index(rest, "=")
        if (eq == 0) next
        key = substr(rest, 1, eq-1)
        sub(/[[:space:]]+$/, "", key)
        if (key in map) found = 1
      }
      END { exit found ? 0 : 1 }
    ' config/local.conf
  expect_exit: 0
  expect_pattern: null
body: |
  set -euo pipefail
  tmp=$(mktemp)
  awk '
    BEGIN {
      while ((getline line < "config/renames.conf") > 0) {
        if (line ~ /^[[:space:]]*#/ || line ~ /^[[:space:]]*$/) continue
        eq = index(line, "=")
        if (eq == 0) continue
        old = substr(line, 1, eq-1)
        new = substr(line, eq+1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
        if (old != "" && new != "" && old != new) map[old] = new
      }
      close("config/renames.conf")
    }
    {
      line = $0
      match(line, /^[[:space:]]*/)
      lead = substr(line, 1, RLENGTH)
      rest = substr(line, RLENGTH+1)
      eq = index(rest, "=")
      if (eq > 0) {
        keypart = substr(rest, 1, eq-1)
        key = keypart
        sub(/[[:space:]]+$/, "", key)
        if (key in map) {
          trailing = substr(keypart, length(key)+1)
          printf "%s%s%s%s\n", lead, map[key], trailing, substr(rest, eq)
          next
        }
      }
      print line
    }
  ' config/local.conf > "$tmp"
  cat "$tmp" > config/local.conf
  rm -f "$tmp"
steps: null
postconditions:
- name: local_override_ignored
  description: The local override file still exists, is ignored by git, and is not
    tracked.
  probe: |-
    test -f config/local.conf
    git check-ignore -q config/local.conf
    ! git ls-files --error-unmatch config/local.conf >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: no_stale_keys_remain
  description: No old setting name from the app's rename map remains as a key in the
    override file.
  probe: |-
    awk '
      BEGIN {
        while ((getline line < "config/renames.conf") > 0) {
          if (line ~ /^[[:space:]]*#/ || line ~ /^[[:space:]]*$/) continue
          eq = index(line, "=")
          if (eq == 0) continue
          old = substr(line, 1, eq-1)
          new = substr(line, eq+1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          if (old != "" && new != "" && old != new) map[old] = new
        }
        close("config/renames.conf")
      }
      {
        line = $0
        match(line, /^[[:space:]]*/)
        rest = substr(line, RLENGTH+1)
        eq = index(rest, "=")
        if (eq == 0) next
        key = substr(rest, 1, eq-1)
        sub(/[[:space:]]+$/, "", key)
        if (key in map) found = 1
      }
      END { exit found ? 1 : 0 }
    ' config/local.conf
  expect_exit: 0
  expect_pattern: null
- name: mapped_new_key_present
  description: At least one new setting name from the app's rename map is present
    in the override file.
  probe: |-
    awk '
      BEGIN {
        while ((getline line < "config/renames.conf") > 0) {
          if (line ~ /^[[:space:]]*#/ || line ~ /^[[:space:]]*$/) continue
          eq = index(line, "=")
          if (eq == 0) continue
          old = substr(line, 1, eq-1)
          new = substr(line, eq+1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          if (old != "" && new != "" && old != new) newkeys[new] = 1
        }
        close("config/renames.conf")
      }
      {
        line = $0
        match(line, /^[[:space:]]*/)
        rest = substr(line, RLENGTH+1)
        eq = index(rest, "=")
        if (eq == 0) next
        key = substr(rest, 1, eq-1)
        sub(/[[:space:]]+$/, "", key)
        if (key in newkeys) found = 1
      }
      END { exit found ? 0 : 1 }
    ' config/local.conf
  expect_exit: 0
  expect_pattern: null
variant: migrate_local
provenance:
  compiled_from_task: Bring my configuration up to date with the setting names the
    app uses now. Rename the old key in my own override file, and keep that file out
    of git.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Bring my configuration up to date with the setting names the app uses
    now. Rename the old key in my own override file, and keep that file out of git./seed-2-config_renamed-4812
  fault: config_renamed
status: admitted
