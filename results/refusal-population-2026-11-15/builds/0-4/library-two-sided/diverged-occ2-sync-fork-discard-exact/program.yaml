id: diverged-occ2-sync-fork-discard-exact
intent: Make the current branch match its upstream exactly by discarding local-only
  commits that carry no content changes, after saving the pre-reset tip to a backup
  branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote resolves to a URL
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream branch is already present as a remote-tracking ref to
    compare against
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_named_branch
  description: HEAD is on a named local branch, not detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked, untracked, or conflicted changes in the worktree
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries
  description: the index has no unresolved merge conflicts
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_present
  description: the local branch has commits that are not in upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_present
  description: upstream has commits the local branch does not have, so the branch
    has really diverged
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_commits_carry_no_changes
  description: every local-only commit leaves the tree identical to the merge base,
    so discarding them loses no work
  probe: git diff --quiet {upstream_remote}/{upstream_branch}...HEAD
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  branch=$(git symbolic-ref --quiet --short HEAD)
  git fetch {upstream_remote} "+refs/heads/{upstream_branch}:refs/remotes/{upstream_remote}/{upstream_branch}"
  git branch -f "backup/pre-sync-$branch" HEAD
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream tip
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: the branch has no commits beyond upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_still_clean
  description: no tracked, untracked, or conflicted changes remain
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: backup_branch_preserves_old_tip
  description: a backup branch holds the pre-reset commit, which differs from the
    new HEAD
  probe: |-
    b="backup/pre-sync-$(git symbolic-ref --quiet --short HEAD)"
    git rev-parse --verify --quiet "refs/heads/$b" &&
    test "$(git rev-parse "refs/heads/$b")" != "$(git rev-parse HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: discarded_commits_introduced_no_changes
  description: the discarded commits left the backup's tree identical to its merge
    base with HEAD
  probe: |-
    b="backup/pre-sync-$(git symbolic-ref --quiet --short HEAD)"
    git diff --quiet "$(git merge-base "refs/heads/$b" HEAD)" "refs/heads/$b"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-4812'
  fault: diverged
status: admitted
