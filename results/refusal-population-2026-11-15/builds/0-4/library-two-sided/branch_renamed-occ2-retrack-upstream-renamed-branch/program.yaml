id: branch_renamed-occ2-retrack-upstream-renamed-branch
intent: Keep the current local branch name, retarget its upstream tracking to the
  remote's new default branch, fetch and prune stale remote-tracking refs, and fast-forward
  the branch to match the new upstream branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: clean_worktree
  description: The index and worktree have no staged, unstaged, or untracked changes.
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: on_a_local_branch
  description: HEAD is attached to a local branch, so its upstream can be changed.
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: The named remote is configured.
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: target_remote_branch_tracking_ref_exists
  description: The remote-tracking ref for the new upstream branch is already present.
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: current_upstream_differs_from_target
  description: The current branch has an upstream configured, and it is not already
    the requested target.
  probe: |-
    current="$(git for-each-ref --format='%(upstream:short)' "refs/heads/$(git symbolic-ref --short HEAD)")"
    test -n "$current" && test "$current" != "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: branch_has_no_local_only_commits
  description: The current branch is an ancestor of the new upstream branch, so a
    fast-forward is possible.
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: There is no merge already in progress.
  probe: '! git rev-parse --verify --quiet MERGE_HEAD'
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote} --prune
  git merge-base --is-ancestor HEAD {upstream_remote}/{upstream_branch}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_new_upstream
  description: HEAD is exactly the commit of the new upstream branch.
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: tracking_points_at_new_upstream
  description: The current branch's configured upstream is the new remote branch.
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name @{u})" = "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: worktree_remains_clean
  description: The fast-forward left no staged, unstaged, or untracked changes.
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: still_on_a_local_branch
  description: HEAD is still attached to a local branch.
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Keep my branch's name, point its tracking at upstream's new branch
    and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Keep my branch's name, point its tracking at upstream's new branch and
    catch up./seed-6-branch_renamed-4812
  fault: branch_renamed
status: admitted
