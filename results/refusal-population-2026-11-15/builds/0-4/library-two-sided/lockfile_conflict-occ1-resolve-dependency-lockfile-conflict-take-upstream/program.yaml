id: lockfile_conflict-occ1-resolve-dependency-lockfile-conflict-take-upstream
intent: Resolve the sync conflict on the shared dependency/lock file by starting from
  upstream's version of the file and re-adding only the lines the local branch added,
  then commit the merge.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_tracking_ref_exists
  description: the upstream remote-tracking branch is available locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: branches_have_diverged
  description: local and upstream each contain commits the other lacks
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0 && test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: both_sides_change_a_common_path
  description: the local and upstream branches both modify at least one shared path
  probe: |-
    comm -12 \
      <(git diff --name-only -z "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" HEAD | tr '\0' '\n' | sort -u) \
      <(git diff --name-only -z "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u) | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no tracked changes and no untracked files are present before the sync
    starts
  probe: git diff --quiet HEAD && test -z "$(git ls-files --others --exclude-standard
    -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: merge_would_conflict
  description: a three-way merge of the local and upstream tips genuinely conflicts
    on content, rather than merging cleanly
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    git merge-tree "$base" HEAD {upstream_remote}/{upstream_branch} | grep -q '<<<<<<<'
  expect_exit: 0
  expect_pattern: null
- name: local_changes_are_additive
  description: no line the local branch removed from a shared path survives on upstream,
    so rebuilding from upstream's file and re-adding local additions loses nothing
    the local branch deliberately deleted
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    mapfile -t common < <(comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort -u) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u))
    bad=0
    for f in "${common[@]}"; do
      [ -n "$f" ] || continue
      if comm -12 \
        <(git diff -U0 "$base" HEAD -- "$f" | awk '/^@@/{seen=1} seen && /^-/{print substr($0,2)}' | sort -u) \
        <(git show "{upstream_remote}/{upstream_branch}:$f" 2>/dev/null | sort -u) | grep -q .; then
        bad=1
      fi
    done
    exit "$bad"
  expect_exit: 0
  expect_pattern: null
body: |
  set -u

  base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1

  git merge --no-ff --no-commit {upstream_remote}/{upstream_branch} >/dev/null 2>&1 || true

  if [ ! -e "$(git rev-parse --git-path MERGE_HEAD)" ]; then
    echo "merge did not start" >&2
    exit 1
  fi

  tmp=$(mktemp -d) || exit 1
  trap 'rm -rf "$tmp"' EXIT

  git diff --name-only --diff-filter=U -z | tr '\0' '\n' > "$tmp/conflicted"

  while IFS= read -r f; do
    [ -n "$f" ] || continue
    if ! git cat-file -e "MERGE_HEAD:$f" 2>/dev/null; then
      git rm -q -f -- "$f" || exit 1
      continue
    fi
    git show "MERGE_HEAD:$f" > "$tmp/up" || exit 1
    if git cat-file -e "HEAD:$f" 2>/dev/null; then
      git show "HEAD:$f" > "$tmp/local" || exit 1
    else
      : > "$tmp/local"
    fi
    cp "$tmp/up" "$tmp/result"
    git diff -U0 "$base" HEAD -- "$f" > "$tmp/diff"
    awk '
      function flush(   i) {
        if (!del && nplus > 0) { for (i = 1; i <= nplus; i++) print plus[i] }
        nplus = 0; del = 0
      }
      /^@@/ { flush(); seen = 1; next }
      !seen { next }
      /^-/ { del = 1; next }
      /^\+/ { plus[++nplus] = substr($0, 2); next }
      END { flush() }
    ' "$tmp/diff" > "$tmp/adds"
    while IFS= read -r add; do
      [ -n "$add" ] || continue
      if grep -qxF -- "$add" "$tmp/result"; then
        continue
      fi
      prev=$(awk -v want="$add" '
        !found && $0 == want { if (NR > 1) print prevline; found = 1; next }
        { prevline = $0 }
      ' "$tmp/local")
      if [ -n "$prev" ] && grep -qxF -- "$prev" "$tmp/result"; then
        awk -v prev="$prev" -v add="$add" '{ print } !done && $0 == prev { print add; done = 1 }' "$tmp/result" > "$tmp/result.new" && mv "$tmp/result.new" "$tmp/result"
      else
        nextline=$(awk -v want="$add" '
          !found && $0 == want { found = 1; next }
          found { print; exit }
        ' "$tmp/local")
        if [ -n "$nextline" ] && grep -qxF -- "$nextline" "$tmp/result"; then
          awk -v nxt="$nextline" -v add="$add" '!done && $0 == nxt { print add; done = 1 } { print }' "$tmp/result" > "$tmp/result.new" && mv "$tmp/result.new" "$tmp/result"
        else
          printf '%s\n' "$add" >> "$tmp/result"
        fi
      fi
    done < "$tmp/adds"
    cat "$tmp/result" > "$f"
    git add -- "$f" || exit 1
  done < "$tmp/conflicted"

  git commit --no-edit || exit 1
steps: null
postconditions:
- name: no_unmerged_entries
  description: every conflicted path has been resolved and staged
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_markers
  description: no tracked file still contains merge conflict markers
  probe: '! git grep -q -I -E ''^(<<<<<<<|>>>>>>>) '' -- .'
  expect_exit: 0
  expect_pattern: null
- name: head_is_merge_commit
  description: HEAD is a merge commit joining the local and upstream histories
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
- name: upstream_merged_into_head
  description: the upstream branch tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the merge is committed and no worktree changes remain
  probe: git diff --quiet HEAD && test -z "$(git ls-files --others --exclude-standard
    -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: The sync conflicts. Resolve it the way this project expects.
    Start from upstream's dependency file and add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: The sync conflicts. Resolve it the way this project expects. Start from
    upstream's dependency file and add back what I added./seed-6-lockfile_conflict-4812
  fault: lockfile_conflict
status: admitted
