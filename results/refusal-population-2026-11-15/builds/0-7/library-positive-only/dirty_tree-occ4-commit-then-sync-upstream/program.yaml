id: dirty_tree-occ4-commit-then-sync-upstream
intent: Commit the uncommitted working-tree changes and then bring the current branch
  up to date with upstream.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: has_upstream_tracking_ref
  description: the remote-tracking ref for the upstream branch exists locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_uncommitted_changes
  description: the index or working tree differs from HEAD, or untracked files exist
  probe: '! git diff --quiet HEAD -- || git ls-files --others --exclude-standard -z
    | tr ''\0'' ''\n'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: branch_behind_upstream
  description: upstream has at least one commit that HEAD does not contain
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*\s*$
- name: no_untracked_collision_with_upstream
  description: no untracked file occupies a path that upstream also changes
  probe: |-
    ! comm -12 \
      <(git ls-files --others --exclude-standard -z | tr '\0' '\n' | sort) \
      <(git diff --name-only -z HEAD {upstream_remote}/{upstream_branch} \
        | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git add -A
  git commit -m "chore: save uncommitted work before syncing with {upstream_remote}/{upstream_branch}"
  git merge --no-edit {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: worktree_clean
  description: no changes remain uncommitted relative to HEAD
  probe: git diff --quiet HEAD --
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: upstream's tip is contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_upstream_commits_missing
  description: HEAD contains every commit reachable from upstream
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^\s*0\s*$
- name: local_work_was_committed
  description: HEAD is no longer the commit it was before the dirty work was saved
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*\s*$
variant: commit
provenance:
  compiled_from_task: My working tree has changes and the branch is behind upstream.
    Fix that and keep my changes. Commit my uncommitted work first, then bring the
    branch up to date.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: My working tree has changes and the branch is behind upstream. Fix that
    and keep my changes. Commit my uncommitted work first, then bring the branch up
    to date./seed-0-dirty_tree-12454
  fault: dirty_tree
status: admitted
