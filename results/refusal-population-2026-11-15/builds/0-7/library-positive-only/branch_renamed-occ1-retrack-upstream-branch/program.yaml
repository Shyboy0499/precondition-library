id: branch_renamed-occ1-retrack-upstream-branch
intent: Point a local branch at the upstream branch that replaced the one it tracked,
  keep the branch's name, and fast-forward it to the new upstream head.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: there are no staged, unstaged or untracked changes in the working tree
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: on_branch_with_stale_upstream
  description: HEAD is on a local branch that has a configured upstream, and that
    upstream is not the branch the remote now uses
  probe: |-
    cur=$(git symbolic-ref --short HEAD) &&
    up=$(git for-each-ref --format='%(upstream:short)' "refs/heads/$cur") &&
    test -n "$up" &&
    test "$up" != "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_target_exists
  description: the remote-tracking ref for the upstream branch the runtime names is
    present locally
  probe: git rev-parse --verify --quiet "refs/remotes/{upstream_remote}/{upstream_branch}"
    >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: fast_forwardable
  description: the local branch carries no commits that are absent from the upstream
    branch, so catching up is a fast-forward
  probe: git merge-base --is-ancestor HEAD "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote} --prune
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracking_retargeted
  description: the current local branch now tracks the upstream branch
  probe: |-
    cur=$(git symbolic-ref --short HEAD) &&
    test "$(git for-each-ref --format='%(upstream:short)' "refs/heads/$cur")" = "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: caught_up_with_upstream
  description: HEAD is at the same commit as the upstream branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_still_clean
  description: the operation left no staged, unstaged or untracked changes behind
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: My branch seems to follow something upstream no longer has.
    Point it at whatever upstream uses now, and keep my work. Keep my branch's name,
    point its tracking at upstream's new branch and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: My branch seems to follow something upstream no longer has. Point it
    at whatever upstream uses now, and keep my work. Keep my branch's name, point
    its tracking at upstream's new branch and catch up./seed-10-branch_renamed-12454
  fault: branch_renamed
status: admitted
