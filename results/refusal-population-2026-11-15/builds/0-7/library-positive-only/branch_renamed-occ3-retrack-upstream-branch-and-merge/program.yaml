id: branch_renamed-occ3-retrack-upstream-branch-and-merge
intent: Retarget the current branch to track upstream's new default branch and merge
  that branch into the local commits.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: The named upstream remote is configured.
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: new_upstream_branch_present
  description: The new upstream branch exists as a remote-tracking ref.
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch.
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: branch_tracks_old_upstream
  description: The current branch does not already track the new upstream branch.
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name @{upstream} 2>/dev/null)"
    != "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_not_in_upstream
  description: The current branch has commits that the new upstream branch does not.
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_not_local
  description: The new upstream branch has commits not yet in the current branch.
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: The worktree has no staged, unstaged, or untracked changes.
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch --prune {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --no-edit --no-ff {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_new_upstream
  description: The current branch tracks the new upstream branch.
  probe: git rev-parse --abbrev-ref --symbolic-full-name @{upstream}
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/{upstream_branch}$
- name: upstream_merged
  description: The new upstream branch is an ancestor of HEAD.
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_created
  description: HEAD is a merge commit, so the local commits were joined rather than
    discarded.
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree_after_merge
  description: The worktree is clean after the merge.
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Track upstream's new branch and merge it into my own commits.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Track upstream's new branch and merge it into my own commits./seed-1-branch_renamed-12454
  fault: branch_renamed
status: admitted
