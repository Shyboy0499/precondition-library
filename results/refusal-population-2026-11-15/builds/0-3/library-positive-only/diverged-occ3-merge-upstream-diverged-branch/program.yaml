id: diverged-occ3-merge-upstream-diverged-branch
intent: Bring a diverged branch back into line with upstream by merging upstream into
  the current branch and preserving both histories with a merge commit.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: the upstream remote is configured in this repository
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream remote-tracking branch exists locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: there are no staged, unstaged, or untracked changes
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_has_unique_commits
  description: the current branch has commits that upstream does not have
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -ge 1
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream has commits that the current branch does not have
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -ge 1
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is already in progress in this repository
  probe: test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git merge --no-edit {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: every upstream commit is now reachable from HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_created
  description: HEAD is a merge commit with at least two parents
  probe: git rev-list --parents -n 1 HEAD | grep -Eq '^[0-9a-f]+( [0-9a-f]+){2,}'
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_second_parent
  description: the merge commit's second parent is the upstream tip
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: local_history_preserved
  description: the merge commit's first parent is the local line, not upstream
  probe: test "$(git rev-parse HEAD^1)" != "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the merge left no conflicts or pending changes
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-28874
  fault: diverged
status: admitted
