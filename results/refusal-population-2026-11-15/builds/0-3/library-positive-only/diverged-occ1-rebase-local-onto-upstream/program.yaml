id: diverged-occ1-rebase-local-onto-upstream
intent: Rebase the current branch's local commits onto the upstream branch so the
  history stays linear.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote resolves to a URL
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the remote-tracking ref for the upstream branch exists locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_attached_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no tracked or untracked changes are present before rebasing
  probe: |-
    git diff --quiet &&
    git diff --cached --quiet &&
    test -z "$(git ls-files --others --exclude-standard -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_in_progress
  description: the repository is not already in the middle of a rebase
  probe: |-
    test ! -d "$(git rev-parse --git-path rebase-merge)" &&
    test ! -d "$(git rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
- name: branches_have_diverged
  description: the current branch has local commits and upstream has commits not yet
    in HEAD
  probe: |-
    test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -gt 0 &&
    test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream tip is now part of the current branch history
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: history_is_linear
  description: no merge commits were introduced above the upstream tip
  probe: test -z "$(git rev-list --merges {upstream_remote}/{upstream_branch}..HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch still contains at least one local commit above upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_rebase
  description: the rebase left no uncommitted or conflicted changes
  probe: |-
    git diff --quiet &&
    git diff --cached --quiet &&
    test -z "$(git ls-files --others --exclude-standard -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_left_behind
  description: no rebase state remains after completion
  probe: |-
    test ! -d "$(git rev-parse --git-path rebase-merge)" &&
    test ! -d "$(git rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: I have local work and upstream has new commits. Untangle it.
    Replay my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I have local work and upstream has new commits. Untangle it. Replay
    my local commits on top of upstream so the history stays linear./seed-5-diverged-28874
  fault: diverged
status: admitted
