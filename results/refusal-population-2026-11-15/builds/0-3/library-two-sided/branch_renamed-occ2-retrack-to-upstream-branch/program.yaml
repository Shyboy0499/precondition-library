id: branch_renamed-occ2-retrack-to-upstream-branch
intent: Repoint the current local branch at the branch upstream now uses, keeping
  its name, and fast-forward it to that branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: the working tree and index have no changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a local branch
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_configured_upstream
  description: the current branch has configured upstream remote and merge refs
  probe: test -n "$(git config --get "branch.$(git symbolic-ref --short HEAD).remote")"
    && test -n "$(git config --get "branch.$(git symbolic-ref --short HEAD).merge")"
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_available
  description: the remote-tracking ref for upstream's current branch exists locally
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: tracking_is_stale
  description: the current branch's configured upstream is not upstream's current
    branch
  probe: test "$(git config --get "branch.$(git symbolic-ref --short HEAD).remote"):$(git
    config --get "branch.$(git symbolic-ref --short HEAD).merge")" != "{upstream_remote}:refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: can_fast_forward
  description: local HEAD is an ancestor of upstream's current branch, so catching
    up cannot drop local commits
  probe: git merge-base --is-ancestor HEAD '{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: is_behind
  description: local HEAD is strictly behind upstream's current branch
  probe: test "$(git rev-list --count 'HEAD..{upstream_remote}/{upstream_branch}')"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: no_operation_in_progress
  description: no merge, rebase, cherry-pick or revert is mid-flight
  probe: test ! -e "$(git rev-parse --git-path MERGE_HEAD)" && test ! -d "$(git rev-parse
    --git-path rebase-merge)" && test ! -d "$(git rev-parse --git-path rebase-apply)"
    && test ! -e "$(git rev-parse --git-path CHERRY_PICK_HEAD)" && test ! -e "$(git
    rev-parse --git-path REVERT_HEAD)"
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_new_upstream
  description: the current branch's configured upstream is upstream's current branch
  probe: test "$(git config --get "branch.$(git symbolic-ref --short HEAD).remote"):$(git
    config --get "branch.$(git symbolic-ref --short HEAD).merge")" = "{upstream_remote}:refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: head_matches_upstream
  description: HEAD is exactly the tip of upstream's current branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse '{upstream_remote}/{upstream_branch}')"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_fast_forward
  description: the working tree and index remain clean
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: My branch seems to follow something upstream no longer has.
    Point it at whatever upstream uses now, and keep my work. Keep my branch's name,
    point its tracking at upstream's new branch and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: My branch seems to follow something upstream no longer has. Point it
    at whatever upstream uses now, and keep my work. Keep my branch's name, point
    its tracking at upstream's new branch and catch up./seed-10-branch_renamed-28874
  fault: branch_renamed
status: admitted
