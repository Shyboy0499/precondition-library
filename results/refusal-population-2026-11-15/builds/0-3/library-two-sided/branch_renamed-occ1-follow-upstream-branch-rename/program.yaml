id: branch_renamed-occ1-follow-upstream-branch-rename
intent: Rename the current local branch to the upstream repository's renamed default
  branch, set it to track that upstream branch, and fast-forward it to match.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote exists in the repository
  probe: git remote get-url "{upstream_remote}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_is_bound_branch
  description: the upstream remote-tracking HEAD points at the requested upstream
    branch
  probe: test "$(git symbolic-ref --quiet refs/remotes/{upstream_remote}/HEAD)" =
    "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_ref_present
  description: the remote-tracking ref for the renamed upstream branch exists locally
  probe: git show-ref --verify --quiet "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_branch_differs_from_upstream_name
  description: the current local branch does not already have upstream's new name
  probe: test "$(git symbolic-ref --quiet --short HEAD)" != "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: new_local_branch_absent
  description: no local branch already occupies the requested new name
  probe: '! git show-ref --verify --quiet "refs/heads/{upstream_branch}"'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree has no tracked or untracked changes that renaming
    and fast-forwarding could disturb
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: can_fast_forward_to_upstream
  description: the current branch is an ancestor of the upstream branch, so it can
    be fast-forwarded
  probe: git merge-base --is-ancestor HEAD "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch --prune "{upstream_remote}"
  old_branch=$(git symbolic-ref --quiet --short HEAD)
  git branch -m "$old_branch" "{upstream_branch}"
  git branch --set-upstream-to="{upstream_remote}/{upstream_branch}" "{upstream_branch}"
  git merge --ff-only "{upstream_remote}/{upstream_branch}"
steps: null
postconditions:
- name: current_branch_renamed
  description: HEAD is attached to the upstream branch's new name
  probe: test "$(git symbolic-ref --quiet --short HEAD)" = "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: tracks_upstream_branch
  description: the renamed branch tracks the upstream remote's new branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" =
    "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: matches_upstream_tip
  description: the local branch has been fast-forwarded to the upstream branch tip
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/{upstream_remote}/{upstream_branch}")"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_update
  description: the working tree remains clean after the rename and fast-forward
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: I think upstream renamed things. Get this fork following it
    again. Rename my branch to upstream's new name and track it.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I think upstream renamed things. Get this fork following it again. Rename
    my branch to upstream's new name and track it./seed-4-branch_renamed-28874
  fault: branch_renamed
status: admitted
