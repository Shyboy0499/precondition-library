id: diverged-occ3-diverged-sync-fork-discard-empty-local
intent: Sync a diverged fork branch with upstream by discarding local commits that
  carry no file changes, making the branch match upstream exactly
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: the working tree has no staged, unstaged or untracked changes, so a
    hard reset cannot clobber user work
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_configured
  description: the upstream remote named by the task is a configured remote
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the remote-tracking ref for the upstream branch is present locally
    and usable as a reset target
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the local branch has at least one commit that upstream does not, so
    this is a genuine discard rather than a no-op
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: local_commits_change_nothing
  description: the local-only commits introduce no file changes relative to the merge
    base, so discarding them loses no content
  probe: git diff --quiet "$(git merge-base HEAD {upstream_remote}/{upstream_branch})"
    HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_or_operation
  description: no unmerged index entries and no merge or rebase is underway that a
    hard reset would leave half-finished
  probe: |-
    test -z "$(git ls-files -u)" &&
    test ! -e "$(git rev-parse --git-path MERGE_HEAD)" &&
    test ! -d "$(git rev-parse --git-path rebase-merge)" &&
    test ! -d "$(git rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD points at exactly the same commit as the upstream branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: no commit remains on the local branch that upstream does not have
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^0$
- name: tree_matches_upstream
  description: the local branch has no tree difference from upstream
  probe: git diff --quiet {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the working tree is clean after the reset
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-29016'
  fault: diverged
status: admitted
