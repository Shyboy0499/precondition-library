id: config_renamed-occ4-config-migrate-local-override
intent: Rename a key that upstream renamed inside the user's own ignored, untracked
  local override config file, preserving the value and leaving that file out of git.
parameters: []
preconditions:
- name: is_git_worktree
  description: The current directory is inside a git worktree.
  probe: '[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = true ]'
  expect_exit: 0
  expect_pattern: null
- name: renames_mapping_present
  description: A tracked file whose name mentions renames lists at least one old-to-new
    key mapping.
  probe: |-
    renames=$(git ls-files -z | tr '\0' '\n' | grep -Ei '(^|/)[^/]*rename[^/]*$' | head -n1)
    [ -n "$renames" ] || exit 1
    out=$(awk '
      /^[[:space:]]*#/ { next }
      /^[[:space:]]*$/ { next }
      {
        eq = index($0, "=")
        if (eq == 0) next
        old = substr($0, 1, eq - 1)
        new = substr($0, eq + 1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
        sub(/[[:space:]]+#.*$/, "", new)
        if (old != "" && new != "" && old != new) printf "%s\t%s\n", old, new
      }
    ' "$renames")
    [ -n "$out" ]
  expect_exit: 0
  expect_pattern: null
- name: tracked_worktree_clean
  description: No tracked file has staged or unstaged changes.
  probe: '[ -z "$(git status --porcelain --untracked-files=no)" ]'
  expect_exit: 0
  expect_pattern: null
- name: tracked_configs_free_of_old_keys
  description: No tracked config-like file still uses an old key from the renames
    mapping (the renames file itself excluded).
  probe: |-
    renames=$(git ls-files -z | tr '\0' '\n' | grep -Ei '(^|/)[^/]*rename[^/]*$' | head -n1)
    [ -n "$renames" ] || exit 1
    stale=1
    while IFS= read -r f; do
      case "$f" in
        config/*|*/config/*|*.conf|*.ini|*.cfg) ;;
        *) continue ;;
      esac
      [ "$f" = "$renames" ] && continue
      [ -f "$f" ] || continue
      if awk -F'\t' '
        NR == FNR { if (NF >= 2) old[$1] = 1; next }
        /^[[:space:]]*#/ { next }
        /^[[:space:]]*$/ { next }
        {
          eq = index($0, "=")
          if (eq == 0) next
          key = substr($0, 1, eq - 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
          if (key in old) { found = 1; exit }
        }
        END { exit(found ? 0 : 1) }
      ' <(awk '
        /^[[:space:]]*#/ { next }
        /^[[:space:]]*$/ { next }
        {
          eq = index($0, "=")
          if (eq == 0) next
          old = substr($0, 1, eq - 1)
          new = substr($0, eq + 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          sub(/[[:space:]]+#.*$/, "", new)
          if (old != "" && new != "" && old != new) printf "%s\t%s\n", old, new
        }
      ' "$renames") "$f"; then
        stale=0
        break
      fi
    done < <(git ls-files -z | tr '\0' '\n')
    [ "$stale" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
- name: ignored_override_has_old_key
  description: An ignored, untracked config-like file contains at least one old key
    from the renames mapping.
  probe: |-
    renames=$(git ls-files -z | tr '\0' '\n' | grep -Ei '(^|/)[^/]*rename[^/]*$' | head -n1)
    [ -n "$renames" ] || exit 1
    hit=1
    while IFS= read -r f; do
      case "$f" in
        config/*|*/config/*|*.conf|*.ini|*.cfg) ;;
        *) continue ;;
      esac
      [ -f "$f" ] || continue
      if awk -F'\t' '
        NR == FNR { if (NF >= 2) old[$1] = 1; next }
        /^[[:space:]]*#/ { next }
        /^[[:space:]]*$/ { next }
        {
          eq = index($0, "=")
          if (eq == 0) next
          key = substr($0, 1, eq - 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
          if (key in old) { found = 1; exit }
        }
        END { exit(found ? 0 : 1) }
      ' <(awk '
        /^[[:space:]]*#/ { next }
        /^[[:space:]]*$/ { next }
        {
          eq = index($0, "=")
          if (eq == 0) next
          old = substr($0, 1, eq - 1)
          new = substr($0, eq + 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          sub(/[[:space:]]+#.*$/, "", new)
          if (old != "" && new != "" && old != new) printf "%s\t%s\n", old, new
        }
      ' "$renames") "$f"; then
        hit=0
        break
      fi
    done < <(git ls-files --others --ignored --exclude-standard -z | tr '\0' '\n')
    [ "$hit" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  renames=$(git ls-files -z | tr '\0' '\n' | grep -Ei '(^|/)[^/]*rename[^/]*$' | head -n1)
  [ -n "$renames" ]
  map=$(mktemp)
  tmp=$(mktemp)
  trap 'rm -f "$map" "$tmp"' EXIT
  awk '
    /^[[:space:]]*#/ { next }
    /^[[:space:]]*$/ { next }
    {
      eq = index($0, "=")
      if (eq == 0) next
      old = substr($0, 1, eq - 1)
      new = substr($0, eq + 1)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
      sub(/[[:space:]]+#.*$/, "", new)
      if (old != "" && new != "" && old != new) printf "%s\t%s\n", old, new
    }
  ' "$renames" > "$map"
  while IFS= read -r f; do
    case "$f" in
      config/*|*/config/*|*.conf|*.ini|*.cfg) ;;
      *) continue ;;
    esac
    [ -f "$f" ] || continue
    if awk -F'\t' '
      NR == FNR { if (NF >= 2) old[$1] = 1; next }
      /^[[:space:]]*#/ { next }
      /^[[:space:]]*$/ { next }
      {
        eq = index($0, "=")
        if (eq == 0) next
        key = substr($0, 1, eq - 1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
        if (key in old) { found = 1; exit }
      }
      END { exit(found ? 0 : 1) }
    ' "$map" "$f"; then
      awk -F'\t' '
        NR == FNR { if (NF >= 2) new[$1] = $2; next }
        {
          line = $0
          eq = index(line, "=")
          if (eq == 0) { print line; next }
          left = substr(line, 1, eq - 1)
          right = substr(line, eq)
          key = left
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
          if (key in new) {
            lead = left
            sub(/[^[:space:]].*$/, "", lead)
            trail = left
            sub(/^.*[^[:space:]]/, "", trail)
            print lead new[key] trail right
          } else {
            print line
          }
        }
      ' "$map" "$f" > "$tmp"
      cat "$tmp" > "$f"
    fi
  done < <(git ls-files --others --ignored --exclude-standard -z | tr '\0' '\n')
steps: null
postconditions:
