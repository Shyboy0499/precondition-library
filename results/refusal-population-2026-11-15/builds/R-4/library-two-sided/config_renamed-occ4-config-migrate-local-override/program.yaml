      [ -f "$f" ] || continue
      if awk -F'\t' '
        NR == FNR { if (NF >= 2) new[$1] = 1; next }
        /^[[:space:]]*#/ { next }
        /^[[:space:]]*$/ { next }
        {
          eq = index($0, "=")
          if (eq == 0) next
