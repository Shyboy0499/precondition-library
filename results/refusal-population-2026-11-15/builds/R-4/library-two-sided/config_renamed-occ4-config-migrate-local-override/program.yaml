          if (old != "" && new != "" && old != new) printf "%s\t%s\n", old, new
        }
      ' "$renames") "$f"; then
        found=0
        break
      fi
    done < <(git ls-files --others --ignored --exclude-standard -z | tr '\0' '\n')
    [ "$found" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
- name: tracked_worktree_still_clean
  description: The rename touched no tracked file, so the override stays out of git.
  probe: '[ -z "$(git status --porcelain --untracked-files=no)" ]'
  expect_exit: 0
