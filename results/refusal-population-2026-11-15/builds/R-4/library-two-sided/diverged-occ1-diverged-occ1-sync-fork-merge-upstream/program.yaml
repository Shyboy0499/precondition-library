id: diverged-occ1-diverged-occ1-sync-fork-merge-upstream
intent: Merge the upstream branch into the current branch, preserving both local and
  upstream histories.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the named upstream remote is configured with a URL
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the remote-tracking branch for upstream exists locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: merge_base_exists
  description: the local branch and the upstream branch share history
  probe: git merge-base HEAD refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: worktree_is_clean
  description: there are no staged, unstaged, or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch, not detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: there is no existing merge state to resume or abort
  probe: test -z "$(git rev-parse --verify --quiet MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_ahead
  description: upstream has at least one commit not present on the current branch
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_ahead
  description: the current branch has at least one commit not present upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_head_is_our_branch
  description: the upstream remote's default branch, when it can be resolved, is the
    branch being merged
  probe: |-
    br="{upstream_branch}"
    bad=0
    h=$(git symbolic-ref --quiet "refs/remotes/{upstream_remote}/HEAD" 2>/dev/null || true)
    if [ -n "$h" ] && [ "$h" != "refs/remotes/{upstream_remote}/$br" ]; then
      bad=1
    fi
    url=$(git remote get-url {upstream_remote} 2>/dev/null || true)
    url=${url#file://}
    if [ -n "$url" ] && [ -d "$url" ]; then
      d=$(git -C "$url" symbolic-ref --short HEAD 2>/dev/null || true)
      if [ -n "$d" ] && git -C "$url" rev-parse --verify --quiet "refs/heads/$d" >/dev/null 2>&1; then
        if [ "$d" != "$br" ]; then
          bad=1
        fi
      fi
    fi
    [ "$bad" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
- name: merge_would_be_clean
  description: a trial merge of the upstream branch into HEAD produces no conflicts
  probe: |-
    mb=$(git merge-base HEAD {upstream_remote}/{upstream_branch} 2>/dev/null) || exit 0
    tmp=$(mktemp -d 2>/dev/null) || tmp=""
    if [ -n "$tmp" ]; then
      alt="$(cd "$(git rev-parse --git-common-dir)" && pwd)/objects"
      GIT_OBJECT_DIRECTORY="$tmp" GIT_ALTERNATE_OBJECT_DIRECTORIES="$alt" git merge-tree --write-tree HEAD {upstream_remote}/{upstream_branch} >/dev/null 2>&1
      rc=$?
      rm -rf "$tmp"
      case "$rc" in
        0) exit 0 ;;
        2) exit 1 ;;
      esac
    fi
    if git merge-tree "$mb" HEAD {upstream_remote}/{upstream_branch} 2>/dev/null | grep -q -e '^changed in both' -e '<<<<<<<'; then
      exit 1
    fi
    exit 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git merge --no-ff --no-edit -m "Merge {upstream_remote}/{upstream_branch} into $(git rev-parse --abbrev-ref HEAD)" {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD has a second parent, so it is a merge commit
  probe: git rev-parse --verify --quiet HEAD^2
  expect_exit: 0
  expect_pattern: null
- name: upstream_parent_is_tip
  description: the second parent of HEAD is the upstream branch tip
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: upstream is merged into the current branch history
  probe: git merge-base --is-ancestor refs/remotes/{upstream_remote}/{upstream_branch}
    HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the merge left no staged, unstaged, or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories./seed-4-diverged-29016
  fault: diverged
status: candidate
