id: diverged-occ2-diverged-merge-upstream
intent: merge the upstream branch into the diverged local branch, preserving both
  histories
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ref_present
  description: the upstream remote-tracking branch exists locally as a commit
  probe: git rev-parse --verify --quiet "{upstream_remote}/{upstream_branch}^{commit}"
  expect_exit: 0
  expect_pattern: null
- name: branch_diverged
  description: the local branch and upstream each carry commits the other lacks
  probe: |-
    a=$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD) &&
    b=$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch}) &&
    [ "$a" -gt 0 ] && [ "$b" -gt 0 ]
  expect_exit: 0
  expect_pattern: null
- name: common_ancestor
  description: the local branch and upstream share a common ancestor
  probe: git merge-base {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: nothing is staged, unstaged or untracked in the working tree
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: on_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is currently in progress
  probe: '! git rev-parse --verify --quiet MERGE_HEAD'
  expect_exit: 0
  expect_pattern: null
- name: tracks_upstream
  description: the current branch's configured upstream is exactly the branch being
    merged
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" =
    "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_head_agrees
  description: when the remote declares a default branch, that default is the branch
    being merged
  probe: |-
    h=$(git symbolic-ref --quiet "refs/remotes/{upstream_remote}/HEAD" || true)
    [ -z "$h" ] || [ "$h" = "refs/remotes/{upstream_remote}/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: merge_would_be_clean
  description: the two branches merge without conflicting changes
  probe: |-
    if git merge-tree -h 2>&1 | grep -q -- '--write-tree'; then
      git merge-tree --write-tree --no-messages HEAD {upstream_remote}/{upstream_branch} >/dev/null
    else
      ! git merge-tree $(git merge-base HEAD {upstream_remote}/{upstream_branch}) HEAD {upstream_remote}/{upstream_branch} | grep -q '^<<<<<<<'
    fi
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  branch=$(git rev-parse --abbrev-ref HEAD)
  git merge --no-ff {upstream_remote}/{upstream_branch} -m "Merge {upstream_remote}/{upstream_branch} into $branch"
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit with at least two parents
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_second_parent
  description: the upstream tip is recorded as the merge commit's second parent
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: upstream_ancestor
  description: the upstream branch is contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_history_preserved
  description: the first parent carries local commits that upstream does not have
  probe: '! git merge-base --is-ancestor HEAD^1 {upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the working tree is clean after the merge
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-29016
  fault: diverged
status: admitted
