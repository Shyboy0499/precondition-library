id: diverged-occ4-diverged-rebase-onto-upstream-clean
intent: replay the local commits on top of upstream so history stays linear
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: has_upstream_tracking_ref
  description: the upstream remote-tracking ref exists locally
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no staged, unstaged or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: local_branch_named_like_upstream_branch
  description: the checked-out branch has the same name as the upstream branch, so
    no branch-rename is in play
  probe: test "$(git symbolic-ref --short HEAD)" = "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_head_not_renamed
  description: if the remote advertises a default branch locally, it is the upstream
    branch being rebased onto
  probe: |-
    h=$(git symbolic-ref -q "refs/remotes/{upstream_remote}/HEAD") || exit 0
    test "$h" = "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: tracks_the_upstream_branch
  description: the checked-out branch's configured upstream, if it has one, is the
    upstream branch being rebased onto
  probe: |-
    m=$(git config --get "branch.$(git symbolic-ref --short HEAD).merge") || exit 0
    test "$m" = "refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the local branch has at least one commit upstream does not have
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -ge 1
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_ahead
  description: upstream has at least one commit the local branch does not have
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -ge 1
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index has no unresolved merge entries
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: no_file_changed_on_both_sides
  description: no path is modified by both the local commits and the upstream commits,
    so the replay cannot conflict
  probe: |-
    ! comm -12 \
      <(git diff --name-only -z "{upstream_remote}/{upstream_branch}...HEAD" | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "HEAD...{upstream_remote}/{upstream_branch}" | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch} || { git rebase --abort 2>/dev/null; exit 1; }
steps: null
postconditions:
- name: upstream_is_ancestor
  description: upstream's tip is now an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_preserved
  description: HEAD still carries at least one commit beyond upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -ge 1
  expect_exit: 0
  expect_pattern: null
- name: linear_history
  description: no merge commits are reachable from HEAD
  probe: '! git rev-list --merges HEAD | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the working tree is clean after the rebase
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_after
  description: the index has no unresolved entries after the rebase
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_in_progress
  description: no rebase state is left behind
  probe: '! test -d "$(git rev-parse --git-path rebase-merge)" -o -d "$(git rev-parse
    --git-path rebase-apply)"'
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: I have local work and upstream has new commits. Untangle it.
    Replay my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I have local work and upstream has new commits. Untangle it. Replay
    my local commits on top of upstream so the history stays linear./seed-5-diverged-29016
  fault: diverged
status: admitted
