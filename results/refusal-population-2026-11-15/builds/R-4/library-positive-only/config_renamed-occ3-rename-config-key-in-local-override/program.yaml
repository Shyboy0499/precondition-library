id: config_renamed-occ3-rename-config-key-in-local-override
intent: Rename stale configuration keys in an ignored local override file using the
  repository's rename map, while keeping that file untracked and ignored.
parameters: []
preconditions:
- name: local_override_untracked_and_ignored
  description: config/local.conf exists, is not tracked, and is ignored by git
  probe: |-
    test -f config/local.conf &&
    ! git ls-files --error-unmatch -- config/local.conf >/dev/null 2>&1 &&
    git check-ignore -q -- config/local.conf
  expect_exit: 0
  expect_pattern: null
- name: stale_key_present_in_local_override
  description: config/local.conf contains at least one old key listed in config/renames.conf
  probe: |-
    awk '
      function trim(s) {
        sub(/^[[:space:]]+/, "", s)
        sub(/[[:space:]]+$/, "", s)
        return s
      }
      FNR == NR {
        line = $0
        sub(/#.*/, "", line)
        if (line ~ /^[[:space:]]*$/) next
        eq = index(line, "=")
        if (eq == 0) next
        old = trim(substr(line, 1, eq - 1))
        new = trim(substr(line, eq + 1))
        if (old != "" && new != "" && old != new) map[old] = new
        next
      }
      {
        line = $0
        if (line ~ /^[[:space:]]*#/ || index(line, "=") == 0) next
        eq = index(line, "=")
        key = trim(substr(line, 1, eq - 1))
        if (key in map) found = 1
      }
      END { exit(found ? 0 : 1) }
    ' config/renames.conf config/local.conf
  expect_exit: 0
  expect_pattern: null
body: |
  set -euo pipefail
  local_file=config/local.conf
  renames_file=config/renames.conf
  tmp=$(mktemp)
  trap 'rm -f "$tmp"' EXIT
  awk '
    function trim(s) {
      sub(/^[[:space:]]+/, "", s)
      sub(/[[:space:]]+$/, "", s)
      return s
    }
    FNR == NR {
      line = $0
      sub(/#.*/, "", line)
      if (line ~ /^[[:space:]]*$/) next
      eq = index(line, "=")
      if (eq == 0) next
      old = trim(substr(line, 1, eq - 1))
      new = trim(substr(line, eq + 1))
      if (old != "" && new != "" && old != new) map[old] = new
      next
    }
    {
      line = $0
      if (line ~ /^[[:space:]]*#/ || index(line, "=") == 0) {
        print line
        next
      }
      eq = index(line, "=")
      left = substr(line, 1, eq - 1)
      right = substr(line, eq)
      key = trim(left)
      if (key in map) {
        match(left, /^[[:space:]]*/)
        lead = substr(left, 1, RLENGTH)
        rest = substr(left, RLENGTH + 1)
        match(rest, /[[:space:]]*$/)
        trail = substr(rest, RSTART)
        print lead map[key] trail right
        next
      }
      print line
    }
  ' "$renames_file" "$local_file" > "$tmp"
  cat "$tmp" > "$local_file"
steps: null
postconditions:
- name: no_stale_keys_remain
  description: no old key from config/renames.conf remains as a key in config/local.conf
  probe: |-
    awk '
      function trim(s) {
        sub(/^[[:space:]]+/, "", s)
        sub(/[[:space:]]+$/, "", s)
        return s
      }
      FNR == NR {
        line = $0
        sub(/#.*/, "", line)
        if (line ~ /^[[:space:]]*$/) next
        eq = index(line, "=")
        if (eq == 0) next
        old = trim(substr(line, 1, eq - 1))
        new = trim(substr(line, eq + 1))
        if (old != "" && new != "" && old != new) map[old] = new
        next
      }
      {
        line = $0
        if (line ~ /^[[:space:]]*#/ || index(line, "=") == 0) next
        eq = index(line, "=")
        key = trim(substr(line, 1, eq - 1))
        if (key in map) found = 1
      }
      END { exit(found ? 1 : 0) }
    ' config/renames.conf config/local.conf
  expect_exit: 0
  expect_pattern: null
- name: renamed_key_present
  description: config/local.conf contains at least one new key from config/renames.conf
  probe: |-
    awk '
      function trim(s) {
        sub(/^[[:space:]]+/, "", s)
        sub(/[[:space:]]+$/, "", s)
        return s
      }
      FNR == NR {
        line = $0
        sub(/#.*/, "", line)
        if (line ~ /^[[:space:]]*$/) next
        eq = index(line, "=")
        if (eq == 0) next
        old = trim(substr(line, 1, eq - 1))
        new = trim(substr(line, eq + 1))
        if (old != "" && new != "" && old != new) map[new] = 1
        next
      }
      {
        line = $0
        if (line ~ /^[[:space:]]*#/ || index(line, "=") == 0) next
        eq = index(line, "=")
        key = trim(substr(line, 1, eq - 1))
        if (key in map) found = 1
      }
      END { exit(found ? 0 : 1) }
    ' config/renames.conf config/local.conf
  expect_exit: 0
  expect_pattern: null
- name: local_override_stays_untracked_and_ignored
  description: config/local.conf remains untracked and ignored by git
  probe: |-
    test -f config/local.conf &&
    ! git ls-files --error-unmatch -- config/local.conf >/dev/null 2>&1 &&
    git check-ignore -q -- config/local.conf
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: Bring my configuration up to date with the setting names the
    app uses now. Rename the old key in my own override file, and keep that file out
    of git.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Bring my configuration up to date with the setting names the app uses
    now. Rename the old key in my own override file, and keep that file out of git./seed-2-config_renamed-29016
  fault: config_renamed
status: admitted
