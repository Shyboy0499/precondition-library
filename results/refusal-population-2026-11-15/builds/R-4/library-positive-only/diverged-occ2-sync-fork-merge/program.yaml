id: diverged-occ2-sync-fork-merge
intent: merge upstream into the current branch, preserving both histories
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ref_present
  description: the upstream remote-tracking branch exists
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: branch_diverged
  description: the local branch and upstream have diverged, each with commits the
    other lacks
  probe: |-
    a=$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD) &&
    b=$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch}) &&
    [ "$a" -gt 0 ] && [ "$b" -gt 0 ]
  expect_exit: 0
  expect_pattern: null
- name: common_ancestor
  description: the local branch and upstream share a common ancestor
  probe: git merge-base {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree is clean, with no staged, unstaged, or untracked changes
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: on_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is currently in progress
  probe: '! git rev-parse --verify --quiet MERGE_HEAD'
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git merge --no-ff {upstream_remote}/{upstream_branch} -m "Merge {upstream_remote}/{upstream_branch} into $(git rev-parse --abbrev-ref HEAD)"
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit with at least two parents
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_second_parent
  description: the merge commit records the upstream tip as its second parent
  probe: test "$(git rev-parse HEAD^2)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: upstream_ancestor
  description: the upstream branch is contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_history_preserved
  description: the merge commit's first parent carries local commits not in upstream
  probe: '! git merge-base --is-ancestor HEAD^1 {upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: the working tree is clean after the merge
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-29016
  fault: diverged
status: admitted
