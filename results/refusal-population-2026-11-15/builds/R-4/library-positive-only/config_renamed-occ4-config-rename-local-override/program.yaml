  expect_exit: 0
  expect_pattern: null
- name: ignored_override_has_new_key
  description: An ignored config-like file contains at least one new key from the
    renames mapping.
  probe: |-
    renames=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)renames[^/]*\.conf$' | head -n1)
    [ -n "$renames" ] || exit 1
    found=1
    while IFS= read -r f; do
      case "$f" in
        config/*|*.conf|*.ini|*.cfg) ;;
        *) continue ;;
      esac
      [ -f "$f" ] || continue
      while IFS=$'\t' read -r old new; do
        [ -n "$new" ] || continue
        if awk -v new="$new" '
          {
            eq=index($0,"=")
            if (eq == 0) next
            key=substr($0,1,eq-1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
            if (key == new) { found=1; exit }
          }
          END { exit(found ? 0 : 1) }
        ' "$f"; then
          found=0
          break 2
        fi
      done < <(awk '
        /^[[:space:]]*#/ { next }
        /^[[:space:]]*$/ { next }
        {
          eq=index($0,"=")
          if (eq == 0) next
          old=substr($0,1,eq-1); new=substr($0,eq+1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          sub(/[[:space:]]+#.*$/, "", new)
          if (old != "" && new != "" && old != new) printf "%s\t%s\n", old, new
        }
      ' "$renames")
    done < <(git ls-files --others --ignored --exclude-standard -z | tr '\0' '\n')
    [ "$found" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
- name: tracked_worktree_still_clean
  description: The rename did not add or modify any tracked file.
  probe: '[ -z "$(git status --porcelain --untracked-files=no)" ]'
  expect_exit: 0
  expect_pattern: null
variant: rename
