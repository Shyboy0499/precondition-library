id: branch_renamed-occ1-follow-upstream-rename
intent: Recover a fork after upstream renamed its default branch by renaming the local
  branch to upstream's new name, retargeting it to track the upstream remote branch,
  and fast-forwarding it to upstream.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: the working tree and index have no pending changes
  probe: test -z "$(git --no-optional-locks status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: branch_not_yet_renamed
  description: the current branch is not already named like upstream's branch
  probe: test "$(git symbolic-ref --short HEAD)" != "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: new_name_is_free
  description: no local branch already occupies upstream's branch name
  probe: '! git show-ref --verify --quiet refs/heads/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: tracks_upstream_remote
  description: the current branch's configured upstream remote is the fork's upstream
  probe: test "$(git for-each-ref --format='%(upstream:remotename)' refs/heads/$(git
    symbolic-ref --short HEAD))" = "{upstream_remote}"
  expect_exit: 0
  expect_pattern: null
- name: tracking_ref_is_stale
  description: the current branch still tracks its old upstream name rather than upstream's
    new one
  probe: test "$(git for-each-ref --format='%(upstream)' refs/heads/$(git symbolic-ref
    --short HEAD))" != "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: fast_forward_only
  description: the local branch has no commits that upstream does not already contain,
    so a plain rename and fast-forward is the correct resolution rather than a merge
  probe: test "$(git rev-list --count HEAD --not --remotes={upstream_remote})" = 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git branch -m {upstream_branch}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch} {upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: on_renamed_branch
  description: HEAD is on the branch named like upstream's
  probe: git symbolic-ref --short HEAD
  expect_exit: 0
  expect_pattern: ^{upstream_branch}$
- name: tracks_renamed_upstream
  description: the branch tracks the upstream remote branch
  probe: git for-each-ref --format='%(upstream)' refs/heads/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^refs/remotes/{upstream_remote}/{upstream_branch}$
- name: matches_upstream
  description: the branch is at the upstream commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_still_clean
  description: the fast-forward left no pending changes
  probe: test -z "$(git --no-optional-locks status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: I think upstream renamed things. Get this fork following it
    again. Rename my branch to upstream's new name and track it.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I think upstream renamed things. Get this fork following it again. Rename
    my branch to upstream's new name and track it./seed-0-branch_renamed-25586
  fault: branch_renamed
status: admitted
