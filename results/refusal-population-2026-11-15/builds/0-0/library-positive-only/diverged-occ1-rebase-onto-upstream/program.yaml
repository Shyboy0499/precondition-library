id: diverged-occ1-rebase-onto-upstream
intent: replay the local commits on top of the moved upstream branch so history stays
  linear
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: clean_worktree
  description: the working tree and index have no uncommitted or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the remote-tracking ref for the upstream branch is present locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_attached_branch
  description: HEAD is on a local branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_not_upstream
  description: the local branch has at least one commit upstream does not contain
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: '[1-9]'
- name: upstream_commits_not_local
  description: the upstream branch has at least one commit the local branch does not
    contain
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: '[1-9]'
- name: no_rebase_or_merge_in_progress
  description: no rebase or merge is already underway
  probe: '! test -e "$(git rev-parse --git-path rebase-merge)" && ! test -e "$(git
    rev-parse --git-path REBASE_HEAD)" && ! test -e "$(git rev-parse --git-path MERGE_HEAD)"'
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: linear_history
  description: no merge commits sit between the upstream tip and HEAD
  probe: '! git rev-list --merges {upstream_remote}/{upstream_branch}..HEAD | grep
    -q .'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_replayed
  description: at least one local commit now sits on top of the upstream tip
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: '[1-9]'
- name: no_rebase_in_progress
  description: the rebase finished and left no in-progress state
  probe: '! test -e "$(git rev-parse --git-path rebase-merge)" && ! test -e "$(git
    rev-parse --git-path REBASE_HEAD)"'
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: the working tree and index are clean after the rebase
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: Upstream moved ahead of me. Get me back in line with it. Replay
    my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream moved ahead of me. Get me back in line with it. Replay my local
    commits on top of upstream so the history stays linear./seed-2-diverged-25586
  fault: diverged
status: admitted
