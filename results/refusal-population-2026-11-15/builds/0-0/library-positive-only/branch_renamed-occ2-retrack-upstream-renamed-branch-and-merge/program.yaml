id: branch_renamed-occ2-retrack-upstream-renamed-branch-and-merge
intent: Retarget the current local branch to track the upstream remote's renamed default
  branch and merge that branch into the local commits.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_attached_branch
  description: HEAD is attached to a local branch
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_ref_present
  description: the new upstream branch already has a remote-tracking ref
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: upstream_head_points_to_new_branch
  description: the upstream remote's default branch is the requested new branch
  probe: test "$(git symbolic-ref refs/remotes/{upstream_remote}/HEAD 2>/dev/null)"
    = "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: local_tracking_is_stale
  description: the current branch does not already track the new upstream branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null)"
    != "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_unmerged_commits
  description: the new upstream branch has commits not yet in HEAD
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_branch_has_commits
  description: the current branch has local commits not in the new upstream branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_is_clean
  description: there are no uncommitted tracked or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote} --prune
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --no-edit {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_new_upstream
  description: the current branch's upstream is the new upstream branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null)"
    = "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_merged
  description: the new upstream branch is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_survive
  description: HEAD still contains commits not in the new upstream branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the merge left no uncommitted changes or conflicts
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Upstream changed something about its branches and my checkout
    is lost. Sort it out. Track upstream's new branch and merge it into my own commits.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream changed something about its branches and my checkout is lost.
    Sort it out. Track upstream's new branch and merge it into my own commits./seed-2-branch_renamed-25586
  fault: branch_renamed
status: admitted
