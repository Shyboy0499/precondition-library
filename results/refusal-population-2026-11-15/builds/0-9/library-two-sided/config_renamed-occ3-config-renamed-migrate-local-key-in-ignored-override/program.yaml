id: config_renamed-occ3-config-renamed-migrate-local-key-in-ignored-override
intent: Migrate a machine-local, git-ignored override config to the upstream key names
  declared in the repository's tracked rename map, leaving the override untracked
  and ignored.
parameters: []
preconditions:
- name: tracked_rename_map
  description: a tracked file whose path contains "rename" declares at least one old
    = new key mapping
  probe: |-
    map=
    while IFS= read -r -d '' f; do
      case "$f" in
        *[Rr][Ee][Nn][Aa][Mm][Ee]*)
          if awk '
            {
              line=$0
              sub(/#.*/, "", line)
              if (line ~ /^[[:space:]]*$/) next
              e=index(line, "=")
              if (e == 0) next
              o=substr(line, 1, e-1)
              n=substr(line, e+1)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
              if (o != "" && n != "") { hit=1; exit }
            }
            END { exit !hit }
          ' "$f"; then
            map=$f
            break
          fi
          ;;
      esac
    done < <(git ls-files -z)
    [ -n "$map" ]
  expect_exit: 0
  expect_pattern: null
- name: ignored_override_has_stale_key
  description: at least one ignored, untracked override file contains an old key from
    the rename map
  probe: |-
    has_key() {
      awk -v want="$2" '
        {
          e=index($0, "=")
          if (e == 0) next
          l=substr($0, 1, e-1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", l)
          if (l == want) { hit=1 }
        }
        END { exit !hit }
      ' "$1"
    }
    map=
    while IFS= read -r -d '' f; do
      case "$f" in
        *[Rr][Ee][Nn][Aa][Mm][Ee]*)
          if awk '
            {
              line=$0
              sub(/#.*/, "", line)
              if (line ~ /^[[:space:]]*$/) next
              e=index(line, "=")
              if (e == 0) next
              o=substr(line, 1, e-1)
              n=substr(line, e+1)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
              if (o != "" && n != "") { hit=1; exit }
            }
            END { exit !hit }
          ' "$f"; then
            map=$f
            break
          fi
          ;;
      esac
    done < <(git ls-files -z)
    [ -n "$map" ] || exit 1
    pairs=$(awk '
      {
        line=$0
        sub(/#.*/, "", line)
        if (line ~ /^[[:space:]]*$/) next
        e=index(line, "=")
        if (e == 0) next
        o=substr(line, 1, e-1)
        n=substr(line, e+1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
        if (o != "" && n != "") print o "=" n
      }' "$map")
    [ -n "$pairs" ] || exit 1
    found=0
    while IFS= read -r -d '' f; do
      while IFS= read -r pr; do
        [ -n "$pr" ] || continue
        if has_key "$f" "${pr%%=*}"; then found=1; break; fi
      done <<< "$pairs"
      [ "$found" -eq 1 ] && break
    done < <(git ls-files --others --ignored --exclude-standard -z)
    [ "$found" -eq 1 ]
  expect_exit: 0
  expect_pattern: null
