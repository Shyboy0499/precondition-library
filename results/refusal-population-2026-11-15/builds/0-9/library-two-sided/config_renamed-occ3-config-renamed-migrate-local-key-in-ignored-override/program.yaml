        if (o != "" && n != "") print o "=" n
      }' "$map")
    [ -n "$pairs" ] || exit 1
    found=0
    while IFS= read -r -d '' f; do
      case "$f" in
        *[Rr][Ee][Nn][Aa][Mm][Ee]*) continue ;;
