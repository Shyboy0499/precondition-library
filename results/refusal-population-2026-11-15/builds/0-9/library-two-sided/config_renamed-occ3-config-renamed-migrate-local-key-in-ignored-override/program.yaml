- name: tracked_worktree_clean
  description: there are no staged or unstaged changes to tracked files, so the only
    edit will be to an ignored override file
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
body: |
  set -euo pipefail

  map=
  while IFS= read -r -d '' f; do
    case "$f" in
      *[Rr][Ee][Nn][Aa][Mm][Ee]*)
        if awk '
          {
            line=$0
            sub(/#.*/, "", line)
            if (line ~ /^[[:space:]]*$/) next
            e=index(line, "=")
            if (e == 0) next
            o=substr(line, 1, e-1)
            n=substr(line, e+1)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
            if (o != "" && n != "") { hit=1; exit }
          }
          END { exit !hit }
        ' "$f"; then
          map=$f
          break
        fi
        ;;
    esac
  done < <(git ls-files -z)
  [ -n "$map" ] || { echo "no tracked rename map found" >&2; exit 1; }

  pairs=$(awk '
    {
      line=$0
      sub(/#.*/, "", line)
      if (line ~ /^[[:space:]]*$/) next
      e=index(line, "=")
      if (e == 0) next
      o=substr(line, 1, e-1)
      n=substr(line, e+1)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", o)
      gsub(/^[[:space:]]+|[[:space:]]+$/, "", n)
      if (o != "" && n != "") print o "=" n
    }' "$map")
  [ -n "$pairs" ] || { echo "rename map is empty" >&2; exit 1; }

  has_key() {
    awk -v want="$2" '
      {
        e=index($0, "=")
        if (e == 0) next
        l=substr($0, 1, e-1)
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", l)
        if (l == want) { hit=1 }
      }
      END { exit !hit }
    ' "$1"
  }

  while IFS= read -r -d '' file; do
    [ -f "$file" ] || continue
    grep -Iq . "$file" || continue

    needs=0
    while IFS= read -r pr; do
      [ -n "$pr" ] || continue
      if has_key "$file" "${pr%%=*}"; then needs=1; break; fi
    done <<< "$pairs"
    [ "$needs" -eq 1 ] || continue

    tmp=$(mktemp "${file}.XXXXXX")
    awk -v pairs="$pairs" '
      BEGIN {
        n = split(pairs, lines, "\n")
        for (i = 1; i <= n; i++) {
          e = index(lines[i], "=")
          if (e > 0) {
            o = substr(lines[i], 1, e-1)
            nn = substr(lines[i], e+1)
            repl[o] = nn
          }
        }
      }
      {
        e = index($0, "=")
        if (e == 0) { print; next }
        left = substr($0, 1, e-1)
        right = substr($0, e+1)
        key = left
        gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
        if (key in repl) {
          pos = index(left, key)
          if (pos > 0) {
            left = substr(left, 1, pos-1) repl[key] substr(left, pos+length(key))
          }
        }
        print left "=" right
      }
    ' "$file" > "$tmp"

    if ! cmp -s "$file" "$tmp"; then
      cat "$tmp" > "$file"
    fi
    rm -f "$tmp"
  done < <(git ls-files --others --ignored --exclude-standard -z)
steps: null
