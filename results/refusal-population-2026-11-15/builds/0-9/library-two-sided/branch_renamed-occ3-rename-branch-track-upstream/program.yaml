id: branch_renamed-occ3-rename-branch-track-upstream
intent: Rename the checked-out fork branch to upstream's new branch name, make it
  track that upstream branch, and fast-forward it to upstream.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_head_is_target
  description: upstream's default HEAD is the new branch name
  probe: git ls-remote --symref {upstream_remote} HEAD
  expect_exit: 0
  expect_pattern: refs/heads/{upstream_branch}
- name: current_branch_has_old_name
  description: HEAD is attached to a branch other than the new name
  probe: test -n "$(git symbolic-ref --short -q HEAD)" && test "$(git symbolic-ref
    --short HEAD)" != "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: new_branch_name_is_free
  description: no local branch already uses the new name
  probe: '! git show-ref --verify --quiet refs/heads/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: tracks_upstream_remote
  description: the current branch has an upstream configured under the upstream remote
  probe: git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}'
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/
- name: tracks_old_upstream_name
  description: the current branch is not already tracking the new branch name
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" !=
    "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: fast_forward_possible
  description: the current branch is an ancestor of its current upstream
  probe: git merge-base --is-ancestor HEAD '@{upstream}'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no tracked or untracked changes are present
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch --prune {upstream_remote}
  git branch -m {upstream_branch}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch} {upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: checked_out_new_branch
  description: HEAD is attached to the renamed local branch
  probe: test "$(git symbolic-ref --short HEAD)" = "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: tracks_new_upstream
  description: the renamed branch tracks the upstream branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" =
    "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: matches_upstream_tip
  description: the local branch is fast-forwarded to upstream
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_still_clean
  description: the worktree remains clean
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: I think upstream renamed things. Get this fork following it
    again. Rename my branch to upstream's new name and track it.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I think upstream renamed things. Get this fork following it again. Rename
    my branch to upstream's new name and track it./seed-0-branch_renamed-29980
  fault: branch_renamed
status: admitted
