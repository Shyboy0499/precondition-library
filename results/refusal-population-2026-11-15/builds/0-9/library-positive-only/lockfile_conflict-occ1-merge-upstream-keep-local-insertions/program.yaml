id: lockfile_conflict-occ1-merge-upstream-keep-local-insertions
intent: Bring the current branch up to date with the upstream remote by merging it,
  and when a file changed on both sides conflicts, resolve it by keeping the local
  content (so locally removed lines stay removed) while inserting the lines upstream
  added, then commit the merge.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_tracking_ref_exists
  description: the upstream remote-tracking branch is present locally
  probe: git rev-parse -q --verify "refs/remotes/{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: worktree_ready
  description: the tree is clean, or a merge with unresolved paths is already in progress
  probe: |-
    if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
      [ -n "$(git ls-files -u)" ]
    else
      [ -z "$(git status --porcelain)" ]
    fi
  expect_exit: 0
  expect_pattern: null
- name: branches_diverged
  description: HEAD and upstream each carry commits the other lacks (no fast-forward
    is possible)
  probe: |-
    if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
      exit 0
    fi
    ahead=$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)
    behind=$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})
    [ "$ahead" -gt 0 ] && [ "$behind" -gt 0 ]
  expect_exit: 0
  expect_pattern: null
- name: shared_changed_path
  description: at least one path was changed on both sides relative to the merge base,
    so the merge can collide
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort -u) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort -u) \
    | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  upstream_ref="{upstream_remote}/{upstream_branch}"
  merge_rc=0
  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git merge --no-edit --no-ff "$upstream_ref" || merge_rc=$?
  fi
  if [ "$merge_rc" -ne 0 ]; then
    git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1 || exit 1
  fi
  tmp=$(mktemp -d)
  trap 'rm -rf "$tmp"' EXIT
  git diff --name-only --diff-filter=U -z | tr '\0' '\n' > "$tmp/conflicted"
  while IFS= read -r path; do
    [ -n "$path" ] || continue
    git show ":1:$path" > "$tmp/base" 2>/dev/null || true
    git show ":2:$path" > "$tmp/ours" 2>/dev/null || true
    git show ":3:$path" > "$tmp/theirs" 2>/dev/null || true
    git merge-file -p --diff3 -q "$tmp/ours" "$tmp/base" "$tmp/theirs" > "$tmp/merged" 2>/dev/null || true
    awk -v T="$tmp" '
      BEGIN { state=0; no=0; nb=0; nt=0; ridx=0 }
      /^<<<<<<< / { state=1; no=0; nb=0; nt=0; split("", ours); split("", base); split("", theirs); next }
      /^\|\|\|\|\|\|\| / { state=2; next }
      /^=======$/ { state=3; next }
      /^>>>>>>> / {
        ridx++
        split("", isadd)
        if (nb == 0) {
          for (i=1;i<=nt;i++) isadd[theirs[i]]=1
        } else if (nt > 0) {
          bf = T "/rbase" ridx
          tf = T "/rtheirs" ridx
          for (i=1;i<=nb;i++) print base[i] > bf
          for (i=1;i<=nt;i++) print theirs[i] > tf
          close(bf); close(tf)
          cmd = "diff \"" bf "\" \"" tf "\""
          inadd = 0
          while ((cmd | getline ln) > 0) {
            if (ln ~ /^[0-9,]+a[0-9,]+$/) { inadd = 1; continue }
            if (ln ~ /^[0-9,]+[cd][0-9,]+$/) { inadd = 0; continue }
            if (ln ~ /^> /) { if (inadd) isadd[substr(ln,3)] = 1; continue }
          }
          close(cmd)
        }
        split("", os)
        for (i=1;i<=no;i++) { print ours[i]; os[ours[i]]=1 }
        for (i=1;i<=nt;i++) { l=theirs[i]; if (isadd[l] && !os[l]) { print l; os[l]=1 } }
        state=0
        next
      }
      {
        if (state==1) ours[++no]=$0
        else if (state==2) base[++nb]=$0
        else if (state==3) theirs[++nt]=$0
        else print
      }
    ' "$tmp/merged" > "$tmp/resolved"
    cat "$tmp/resolved" > "$path"
    git add -- "$path"
  done < "$tmp/conflicted"
  if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git commit --no-edit
  fi
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit with two parents
  probe: git rev-parse -q --verify HEAD^2 >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: the upstream tip is contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: no conflicted paths remain in the index
  probe: '[ -z "$(git ls-files -u)" ]'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the resolution is committed and nothing is left dirty
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: keeps_local_removals_and_upstream_additions
  description: for every path both sides changed, no line upstream inserted is missing
    from the merged file and no line local deleted reappears
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2) || exit 1
    fail=0
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      present=$(git show "HEAD:$f" 2>/dev/null | sort -u)
      added=$(git diff "$base" HEAD^2 -- "$f" | awk '/^@@/{h=1;next} h && /^\+/{print substr($0,2)}' | sort -u)
      removed=$(git diff "$base" HEAD^1 -- "$f" | awk '/^@@/{h=1;next} h && /^-/{print substr($0,2)}' | sort -u)
      if [ -n "$added" ] && [ -n "$(comm -23 <(printf '%s\n' "$added") <(printf '%s\n' "$present"))" ]; then
        fail=1
      fi
      if [ -n "$removed" ] && [ -n "$(comm -12 <(printf '%s\n' "$removed") <(printf '%s\n' "$present"))" ]; then
        fail=1
      fi
    done < <(comm -12 <(git diff --name-only -z "$base" HEAD^1 | tr '\0' '\n' | sort -u) <(git diff --name-only -z "$base" HEAD^2 | tr '\0' '\n' | sort -u))
    [ "$fail" -eq 0 ]
  expect_exit: 0
  expect_pattern: null
variant: keep_local
provenance:
  compiled_from_task: Get my fork current with upstream; our dependency changes collided.
    Keep my dependency file, with what I removed still removed, and add what upstream
    added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get my fork current with upstream; our dependency changes collided.
    Keep my dependency file, with what I removed still removed, and add what upstream
    added./seed-3-lockfile_conflict-29980
  fault: lockfile_conflict
status: candidate
