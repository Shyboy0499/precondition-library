id: lockfile_conflict-occ3-resolve-lockfile-conflict-take-upstream
intent: Resolve a dependency lock file merge conflict with upstream by starting from
  upstream's version of the file and re-adding the lines the local side added.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ref_present
  description: the upstream remote-tracking branch exists
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: branches_diverged
  description: HEAD and the upstream branch each have commits the other lacks, so
    a real merge is required
  probe: |-
    test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -ge 1 &&
    test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -ge 1
  expect_exit: 0
  expect_pattern: null
- name: dependency_file_on_both_sides
  description: deps.lock is tracked in HEAD and in the upstream branch
  probe: |-
    git cat-file -e HEAD:deps.lock &&
    git cat-file -e {upstream_remote}/{upstream_branch}:deps.lock
  expect_exit: 0
  expect_pattern: null
- name: dependency_file_changed_by_both_sides
  description: deps.lock differs from the merge base in both HEAD and the upstream
    branch
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
    ! git diff --quiet "$base" HEAD -- deps.lock &&
    ! git diff --quiet "$base" {upstream_remote}/{upstream_branch} -- deps.lock
  expect_exit: 0
  expect_pattern: null
- name: local_added_lines
  description: the local side added lines to deps.lock relative to the merge base
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
    git diff --no-color -U0 "$base" HEAD -- deps.lock | grep -q '^+[^+]'
  expect_exit: 0
  expect_pattern: null
body: |-
  set -u
  tmp=$(mktemp -d)
  trap 'rm -rf "$tmp"' 0

  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git merge --no-commit {upstream_remote}/{upstream_branch} >/dev/null 2>&1 || true
  fi

  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    echo "merge with {upstream_remote}/{upstream_branch} did not start" >&2
    exit 1
  fi

  if git ls-files -u -- deps.lock | grep -q .; then
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch})
    git show "$base:deps.lock" > "$tmp/base"
    git show "HEAD:deps.lock" > "$tmp/ours"
    git show "{upstream_remote}/{upstream_branch}:deps.lock" > "$tmp/theirs"
    git diff --no-index -U0 "$tmp/base" "$tmp/ours" > "$tmp/local.diff" 2>/dev/null || true

    awk -v oursfile="$tmp/ours" -v difffile="$tmp/local.diff" -v theirsfile="$tmp/theirs" '
      function flush(   i) {
        if (inh && !hasminus && nadd > 0) {
          ngroup++
          gstart[ngroup] = startline
          gcount[ngroup] = nadd
          for (i = 1; i <= nadd; i++) gline[ngroup, i] = adds[i]
        }
        nadd = 0
        hasminus = 0
      }
      BEGIN {
        while ((getline l < oursfile) > 0) ours[++nours] = l
        while ((getline l < difffile) > 0) dif[++ndif] = l
        while ((getline l < theirsfile) > 0) theirs[++ntheirs] = l

        inh = 0
        hasminus = 0
        nadd = 0
        ngroup = 0
        for (i = 1; i <= ndif; i++) {
          line = dif[i]
          if (line ~ /^@@ /) {
            flush()
            inh = 1
            rest = substr(line, index(line, "+") + 1)
            sub(/[ ,].*$/, "", rest)
            startline = rest + 0
            continue
          }
          if (!inh) continue
          c = substr(line, 1, 1)
          if (c == "-") hasminus = 1
          else if (c == "+") { nadd++; adds[nadd] = substr(line, 2) }
        }
        flush()

        for (i = 1; i <= ntheirs; i++) in_theirs[theirs[i]] = 1
        for (i = 0; i <= ntheirs; i++) npend[i] = 0

        cursor = 0
        for (g = 1; g <= ngroup; g++) {
          pos = 0
          for (a = gstart[g] - 1; a >= 1; a--) {
            if (!(ours[a] in in_theirs)) continue
            found = 0
            for (i = cursor + 1; i <= ntheirs; i++) {
              if (theirs[i] == ours[a]) { pos = i; found = 1; break }
            }
            if (!found) {
              for (i = 1; i <= ntheirs; i++) {
                if (theirs[i] == ours[a]) { pos = i; found = 1; break }
              }
            }
            if (found) break
          }
          for (j = 1; j <= gcount[g]; j++) {
            l = gline[g, j]
            if ((l in in_theirs) || (l in emitted)) continue
            npend[pos]++
            pend[pos, npend[pos]] = l
            emitted[l] = 1
          }
          cursor = pos
        }

        for (i = 0; i <= ntheirs; i++) {
          if (i > 0) print theirs[i]
          for (j = 1; j <= npend[i]; j++) print pend[i, j]
        }
      }
    ' > "$tmp/merged"

    cat "$tmp/merged" > deps.lock
    git add deps.lock
  fi

  git commit --no-edit
steps: null
postconditions:
- name: conflict_resolved
  description: deps.lock has no unmerged index entries left and no conflict markers
  probe: |-
    ! git ls-files -u -- deps.lock | grep -q . &&
    ! grep -q '^<<<<<<<' deps.lock &&
    ! grep -q '^|||||||' deps.lock &&
    ! grep -q '^=======$' deps.lock &&
    ! grep -q '^>>>>>>>' deps.lock
  expect_exit: 0
  expect_pattern: null
- name: upstream_lines_preserved
  description: no line present in upstream's version of deps.lock is missing from
    the committed file
  probe: '! git diff --no-color {upstream_remote}/{upstream_branch} HEAD -- deps.lock
    | grep -q ''^-[^-]'''
  expect_exit: 0
  expect_pattern: null
- name: local_additions_preserved
  description: every line the local side inserted into deps.lock relative to the merge
    base is present in the committed file
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2) &&
    git diff --no-color -U0 "$base" HEAD^1 -- deps.lock |
    awk '/^@@ /{ if (in_h && !minus && n) for (i=1;i<=n;i++) print add[i]; in_h=1; minus=0; n=0; next }
         in_h && /^-/ { minus=1; next }
         in_h && /^\+/ { add[++n] = substr($0,2); next }
         END { if (in_h && !minus && n) for (i=1;i<=n;i++) print add[i] }' |
    while IFS= read -r l; do grep -Fxq -- "$l" deps.lock || exit 1; done
  expect_exit: 0
  expect_pattern: null
- name: upstream_merged_into_head
  description: the upstream branch tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: tracked_worktree_clean
  description: no uncommitted tracked changes remain
  probe: test -z "$(git status --porcelain --untracked-files=no)"
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: The sync conflicts. Resolve it the way this project expects.
    Start from upstream's dependency file and add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: The sync conflicts. Resolve it the way this project expects. Start from
    upstream's dependency file and add back what I added./seed-6-lockfile_conflict-29980
  fault: lockfile_conflict
status: admitted
