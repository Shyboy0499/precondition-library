id: branch_renamed-occ2-retrack-renamed-upstream
intent: Retarget the current local branch to track the upstream's current branch and
  fast-forward it, preserving the local branch name and work.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: clean_worktree
  description: the working tree and index have no local changes
  probe: test -z "$(git status --porcelain -z)"
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_upstream_config
  description: the current branch already has an upstream configured
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    test -n "$branch"
    test -n "$(git config --get "branch.$branch.remote")"
    test -n "$(git config --get "branch.$branch.merge")"
  expect_exit: 0
  expect_pattern: null
- name: target_exists_on_remote
  description: the requested upstream branch exists on the remote
  probe: git ls-remote --exit-code {upstream_remote} refs/heads/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: upstream_head_is_target
  description: the remote's HEAD points at the requested upstream branch
  probe: git ls-remote --symref {upstream_remote} HEAD
  expect_exit: 0
  expect_pattern: refs/heads/{upstream_branch}
- name: not_already_tracking_target
  description: the current branch does not already track the requested upstream branch
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD)
    cur_remote=$(git config --get "branch.$branch.remote" || true)
    cur_merge=$(git config --get "branch.$branch.merge" || true)
    test "$cur_remote" != "{upstream_remote}" || test "$cur_merge" != "refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: target_is_fast_forwardable_when_known
  description: the current branch can fast-forward to the target, or the target commit
    is not local yet
  probe: |-
    target=$(git ls-remote {upstream_remote} refs/heads/{upstream_branch} | cut -f1)
    test -n "$target"
    if git cat-file -e "$target^{commit}" 2>/dev/null; then
      git merge-base --is-ancestor HEAD "$target"
    else
      old=$(git rev-parse --verify --quiet '@{upstream}') || exit 0
      git merge-base --is-ancestor HEAD "$old"
    fi
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  git merge-base --is-ancestor HEAD refs/remotes/{upstream_remote}/{upstream_branch}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracks_target
  description: the current branch tracks the requested upstream branch
  probe: git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}'
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/{upstream_branch}$
- name: head_is_target
  description: the current branch is at the upstream branch's commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: still_on_local_branch
  description: HEAD remains attached to a local branch
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the fast-forward left no uncommitted changes
  probe: test -z "$(git status --porcelain -z)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: My branch seems to follow something upstream no longer has.
    Point it at whatever upstream uses now, and keep my work. Keep my branch's name,
    point its tracking at upstream's new branch and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: My branch seems to follow something upstream no longer has. Point it
    at whatever upstream uses now, and keep my work. Keep my branch's name, point
    its tracking at upstream's new branch and catch up./seed-10-branch_renamed-8327
  fault: branch_renamed
status: admitted
