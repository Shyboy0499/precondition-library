id: diverged-occ6-merge-diverged-upstream-not-renamed
intent: Merge upstream into the current diverged branch, preserving both histories,
  when the branch has not been renamed relative to upstream and the merge would apply
  cleanly
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: the named upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: branch_matches_upstream_branch
  description: the checked-out branch has the same name as the upstream branch, i.e.
    it was not renamed upstream
  probe: test "$(git rev-parse --abbrev-ref HEAD)" = "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_same_named_branch
  description: the upstream remote still advertises a branch carrying the checked-out
    branch's name
  probe: |-
    heads=$(git ls-remote --heads {upstream_remote} 2>/dev/null) || exit 0
    branch=$(git rev-parse --abbrev-ref HEAD)
    printf '%s\n' "$heads" | awk -v b="refs/heads/$branch" '$2 == b { found=1 } END { if (found) exit 0; exit 1 }'
  expect_exit: 0
  expect_pattern: null
- name: upstream_head_matches_branch
  description: the upstream's HEAD branch, when it names a branch that actually exists
    upstream, is the checked-out branch
  probe: |-
    head_branch=$(git ls-remote --symref {upstream_remote} HEAD 2>/dev/null | sed -n 's#^ref: refs/heads/\([^[:space:]]*\)[[:space:]]*HEAD$#\1#p')
    if [ -z "$head_branch" ]; then exit 0; fi
    if ! git ls-remote --heads {upstream_remote} "refs/heads/$head_branch" 2>/dev/null | grep -q .; then exit 0; fi
    test "$head_branch" = "$(git rev-parse --abbrev-ref HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: local_ahead_of_upstream
  description: the current branch has at least one commit upstream lacks
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_ahead_of_local
  description: upstream has at least one commit the current branch lacks
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: worktree_clean
  description: there are no staged, modified, or untracked files
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: merge_would_not_conflict
  description: a three-way merge of the upstream tip into HEAD produces no conflict
    markers
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    ! git merge-tree "$base" HEAD {upstream_remote}/{upstream_branch} | grep -q -e '^+<<<<<<<' -e '^CONFLICT'
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  if ! git merge --no-ff -m "Merge {upstream_remote}/{upstream_branch}" {upstream_remote}/{upstream_branch}; then
    git merge --abort || true
    exit 1
  fi
steps: null
postconditions:
- name: upstream_merged
  description: upstream's tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_created
  description: HEAD is a merge commit with exactly two parents
  probe: git rev-list --parents -n 1 HEAD | awk '{print NF-1}'
  expect_exit: 0
  expect_pattern: ^2$
- name: worktree_clean_after_merge
  description: the working tree is clean after the merge
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-214
  fault: diverged
status: candidate
