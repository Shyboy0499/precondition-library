id: lockfile_conflict-occ2-merge-upstream-lockfile-take-upstream
intent: Catch up with the upstream branch by merging it into the current branch, and
  resolve conflicts in the touched dependency lock file by starting from upstream's
  version of that file and re-adding only the lines the local side added, so neither
  side's additions are lost and neither side's removals are revived; then commit the
  merge.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ref_exists
  description: the upstream remote-tracking branch resolves to a commit
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}^{commit}
  expect_exit: 0
  expect_pattern: null
- name: upstream_ahead_of_local
  description: upstream has at least one commit the local branch lacks
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: local_ahead_of_upstream
  description: the local branch has at least one commit upstream lacks
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: common_changed_file
  description: both sides changed at least one common file since the merge base, so
    the merge can actually conflict
  probe: |-
    mb=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    comm -12 \
      <(git diff --name-only -z "$mb" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "$mb" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no staged, unstaged or untracked changes are present
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no merge is already in progress
  probe: test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
body: |
  git merge --no-edit {upstream_remote}/{upstream_branch} >/dev/null 2>&1 || true
  tmp=$(mktemp -d)
  git diff --name-only --diff-filter=U -z | tr '\0' '\n' > "$tmp/conflicted"
  while IFS= read -r f; do
    [ -n "$f" ] || continue
    if git rev-parse -q --verify ":1:$f" >/dev/null 2>&1 \
       && git rev-parse -q --verify ":2:$f" >/dev/null 2>&1 \
       && git rev-parse -q --verify ":3:$f" >/dev/null 2>&1; then
      base=$(git rev-parse ":1:$f")
      ours=$(git rev-parse ":2:$f")
      theirs=$(git rev-parse ":3:$f")
      git cat-file blob "$ours" > "$tmp/ours"
      git cat-file blob "$theirs" > "$tmp/theirs"
      git diff -U0 "$base" "$ours" > "$tmp/diff"
      awk -v oursfile="$tmp/ours" -v theirsfile="$tmp/theirs" '
  function firsttok(s,   t, p) {
    t = s
    sub(/^[ \t]+/, "", t)
    p = index(t, " ")
    if (p == 0) return t
    return substr(t, 1, p - 1)
  }
  function findfirst(s,   j) {
    for (j = 1; j <= nt; j++) if (!del[j] && t[j] == s) return j
    return 0
  }
  function findanchor(ai,   p, best, bestscore, j, k, q, s) {
    best = 0
    bestscore = -1
    for (j = 1; j <= nt; j++) {
      if (del[j]) continue
      if (t[j] != o[ai]) continue
      s = 0
      k = ai - 1
      q = j - 1
      while (k >= 1 && q >= 1 && t[q] == o[k] && !del[q]) { s++; k--; q-- }
      if (s > bestscore) { bestscore = s; best = j }
    }
    return best
  }
  function insafter(p, text,   k, n, lines, j) {
    n = split(text, lines, "\n")
    for (k = n; k >= 1; k--) {
      if (lines[k] == "") continue
      for (j = nt; j >= p + 1; j--) { t[j + 1] = t[j]; del[j + 1] = del[j] }
      t[p + 1] = lines[k]
      del[p + 1] = 0
      nt++
    }
  }
  function dohunk(   i, j, k) {
    if (!inh) return
    for (i = 1; i <= nm; i++) mstate[i] = 0
    for (i = 1; i <= np; i++) pstate[i] = 0
    for (i = 1; i <= np; i++) {
      for (j = 1; j <= nm; j++) {
        if (mstate[j]) continue
        if (firsttok(minus[j]) == firsttok(plus[i])) { mstate[j] = 1; pstate[i] = j; break }
      }
    }
    for (j = 1; j <= nm; j++) {
      if (mstate[j]) continue
      k = findfirst(minus[j])
      if (k > 0) del[k] = 1
    }
    for (i = 1; i <= np; i++) {
      j = pstate[i]
      if (j > 0) {
        k = findfirst(minus[j])
        if (k > 0) t[k] = plus[i]
      } else {
        addn++
        addpos[addn] = c
        addtext[addn] = plus[i]
      }
    }
    inh = 0
    nm = 0
    np = 0
  }
  FILENAME == oursfile { o[++no] = $0; next }
  FILENAME == theirsfile { t[++nt] = $0; next }
  /^@@ / {
    dohunk()
    split(substr($2, 2), A, ",")
    split(substr($3, 2), B, ",")
    c = B[1] + 0
    inh = 1
    next
  }
  {
    if (!inh) next
    if (substr($0, 1, 1) == "-") { minus[++nm] = substr($0, 2); next }
    if (substr($0, 1, 1) == "+") { plus[++np] = substr($0, 2); next }
  }
  END {
    dohunk()
    for (k = addn; k >= 1; k--) {
      ai = addpos[k] - 1
      p = 0
      while (ai >= 1) {
        p = findanchor(ai)
        if (p > 0) break
        ai--
      }
      insafter(p, addtext[k])
    }
    for (j = 1; j <= nt; j++) if (!del[j]) print t[j]
  }
  ' "$tmp/ours" "$tmp/theirs" "$tmp/diff" > "$tmp/merged"
      cat "$tmp/merged" > "$f"
      git add -- "$f"
    else
      if git checkout --theirs -- "$f" >/dev/null 2>&1; then
        git add -- "$f"
      else
        git rm -q -f -- "$f" >/dev/null 2>&1 || true
      fi
    fi
  done < "$tmp/conflicted"
  rm -rf "$tmp"
  if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git commit --no-edit >/dev/null
  fi
steps: null
postconditions:
- name: upstream_merged
  description: upstream's tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries
  description: the index holds no unmerged paths
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_markers
  description: no leftover conflict marker remains in any tracked file
  probe: '! git grep -q -e ''^<<<<<<< '' -e ''^>>>>>>> '' -- .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: no uncommitted changes remain after the merge commit
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: Catch up with upstream without losing what either side added,
    or reviving what either side removed. Start from upstream's dependency file and
    add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Catch up with upstream without losing what either side added, or reviving
    what either side removed. Start from upstream's dependency file and add back what
    I added./seed-5-lockfile_conflict-214
  fault: lockfile_conflict
status: admitted
