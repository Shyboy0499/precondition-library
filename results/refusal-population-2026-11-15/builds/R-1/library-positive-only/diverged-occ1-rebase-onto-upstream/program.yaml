id: diverged-occ1-rebase-onto-upstream
intent: Replay the local branch's commits on top of the upstream branch so history
  stays linear.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote can be resolved
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: worktree_is_clean
  description: there are no staged, unstaged, or untracked changes
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_in_progress
  description: no merge or apply rebase directory is present
  probe: test ! -e "$(git rev-parse --git-path rebase-merge)" && test ! -e "$(git
    rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
- name: head_is_on_a_branch
  description: HEAD points at a local branch rather than a detached commit
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_local_commits
  description: the local branch has commits that upstream does not contain
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream contains commits that the local branch does not have
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream branch is now an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_replayed
  description: HEAD still contains commits beyond upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: history_is_linear
  description: the replayed local commits include no merge commits
  probe: '! git rev-list --merges {upstream_remote}/{upstream_branch}..HEAD | grep
    -q .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_is_clean_after
  description: the rebase left no staged, unstaged, or untracked changes
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_left_behind
  description: no rebase state directory remains after the operation
  probe: test ! -e "$(git rev-parse --git-path rebase-merge)" && test ! -e "$(git
    rev-parse --git-path rebase-apply)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: Upstream moved ahead of me. Get me back in line with it. Replay
    my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream moved ahead of me. Get me back in line with it. Replay my local
    commits on top of upstream so the history stays linear./seed-2-diverged-214
  fault: diverged
status: admitted
