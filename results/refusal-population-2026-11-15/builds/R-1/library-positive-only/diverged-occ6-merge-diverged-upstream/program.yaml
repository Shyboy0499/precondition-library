id: diverged-occ6-merge-diverged-upstream
intent: Merge upstream into the current diverged branch, preserving both histories
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: the named upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: on_a_branch
  description: HEAD is attached to a branch rather than detached
  probe: git symbolic-ref --quiet HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_ahead_of_upstream
  description: the current branch has at least one commit upstream lacks
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_ahead_of_local
  description: upstream has at least one commit the current branch lacks
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: worktree_clean
  description: there are no staged, modified, or untracked files
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  if ! git merge --no-ff -m "Merge {upstream_remote}/{upstream_branch}" {upstream_remote}/{upstream_branch}; then
    git merge --abort || true
    exit 1
  fi
steps: null
postconditions:
- name: upstream_merged
  description: upstream's tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_created
  description: HEAD is a merge commit with exactly two parents
  probe: git rev-list --parents -n 1 HEAD | awk '{print NF-1}'
  expect_exit: 0
  expect_pattern: ^2$
- name: worktree_clean_after_merge
  description: the working tree is clean after the merge
  probe: '! git status --porcelain | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-214
  fault: diverged
status: admitted
