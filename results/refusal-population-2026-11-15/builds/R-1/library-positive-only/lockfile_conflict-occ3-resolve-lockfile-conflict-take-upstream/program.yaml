id: lockfile_conflict-occ3-resolve-lockfile-conflict-take-upstream
intent: Resolve a dependency lockfile merge conflict by taking upstream's version
  of the conflicted file as the base and re-adding the lines the local branch added,
  then commit the merge.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_fetched
  description: the upstream branch is available as a remote-tracking ref
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: branches_diverged
  description: local and upstream each have commits the other lacks
  probe: |-
    test "$(git rev-list --count refs/remotes/{upstream_remote}/{upstream_branch}..HEAD)" -gt 0 &&
    test "$(git rev-list --count HEAD..refs/remotes/{upstream_remote}/{upstream_branch})" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: common_changed_file
  description: both sides modified the same non-deleted path since the merge base
  probe: |-
    base=$(git merge-base HEAD refs/remotes/{upstream_remote}/{upstream_branch}) || exit 1
    comm -12 \
      <(git diff --name-only --diff-filter=d -z "$base" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only --diff-filter=d -z "$base" refs/remotes/{upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
- name: merge_state_is_expected
  description: either the worktree is clean or an in-progress merge is exactly the
    upstream merge
  probe: |-
    if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
      test "$(git rev-parse MERGE_HEAD)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
    else
      test -z "$(git status --porcelain --untracked-files=no -z | tr '\0' '\n')"
    fi
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
body: |
  set -euo pipefail

  upstream_ref="{upstream_remote}/{upstream_branch}"
  tmp="$(mktemp -d)"
  trap 'rm -rf "$tmp"' EXIT

  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git merge --no-commit --no-ff "$upstream_ref" || true
    git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1 || {
      echo "merge could not be started" >&2
      exit 1
    }
  fi

  merge_head="$(git rev-parse MERGE_HEAD)"
  base="$(git merge-base HEAD "$merge_head")"
  git diff --name-only --diff-filter=U -z > "$tmp/conflicts"

  while IFS= read -r -d '' path; do
    [ -n "$path" ] || continue

    if ! git cat-file -e "$merge_head:$path" 2>/dev/null; then
      git rm -q -f -- "$path" 2>/dev/null || true
      continue
    fi

    if ! git cat-file -e "HEAD:$path" 2>/dev/null; then
      git checkout --theirs -- "$path" 2>/dev/null || git checkout --theirs "$path"
      git add -- "$path"
      continue
    fi

    if [ "$(git diff --numstat "$base" HEAD -- "$path" | awk '$1=="-" && $2=="-" { print "yes"; exit }')" = yes ]; then
      git checkout --theirs -- "$path" 2>/dev/null || git checkout --theirs "$path"
      git add -- "$path"
      continue
    fi

    git show "$merge_head:$path" > "$tmp/up"
    git show "HEAD:$path" > "$tmp/local"

    git diff -U0 "$base" HEAD -- "$path" | awk '
      function flush() {
        if (open) {
          extra = addn - deln
          if (extra > 0) {
            for (i = addn - extra + 1; i <= addn; i++) {
              printf "%d\037%s\n", c + (i - 1), plus[i]
            }
          }
        }
        open = 0
      }
      /^@@/ {
        flush()
        match($0, /-[0-9]+(,[0-9]+)?/)
        old = substr($0, RSTART + 1, RLENGTH - 1)
        split(old, oa, ",")
        deln = (oa[2] == "") ? 1 : oa[2] + 0
        match($0, /\+[0-9]+(,[0-9]+)?/)
        new = substr($0, RSTART + 1, RLENGTH - 1)
        split(new, na, ",")
        c = na[1] + 0
        addn = 0
        open = 1
        next
      }
      /^\+\+\+/ { next }
      /^\+/ { addn++; plus[addn] = substr($0, 2); next }
      /^-/ { next }
      END { flush() }
    ' > "$tmp/added"

    awk -v upfile="$tmp/up" -v localfile="$tmp/local" -v addedfile="$tmp/added" '
      BEGIN {
        n = 0
        while ((getline line < upfile) > 0) { up[++n] = line }
        close(upfile)
        m = 0
        while ((getline line < localfile) > 0) { lo[++m] = line }
        close(localfile)
        while ((getline line < addedfile) > 0) {
          split(line, parts, "\037")
          add[parts[1] + 0] = parts[2]
        }
        close(addedfile)
        for (i = 1; i <= n; i++) {
          if (!(up[i] in upidx)) upidx[up[i]] = i
        }
        i = 1
        while (i <= m) {
          if (i in add) {
            start = i
            k = 0
            while (i <= m && (i in add)) {
              if (!(add[i] in upidx)) { k++; blk[k] = add[i] }
              i++
            }
            if (k > 0) {
              p = start - 1
              while (p >= 1 && !(lo[p] in upidx)) p--
              if (p >= 1) anchor = upidx[lo[p]]
              else anchor = 0
              for (j = 1; j <= k; j++) {
                insn[anchor]++
                ins[anchor, insn[anchor]] = blk[j]
              }
            }
          } else {
            i++
          }
        }
        for (j = 1; j <= insn[0]; j++) print ins[0, j]
        for (i = 1; i <= n; i++) {
          print up[i]
          for (j = 1; j <= insn[i]; j++) print ins[i, j]
        }
      }
    ' > "$tmp/merged"

    cp "$tmp/merged" "$path"
    git add -- "$path"
  done < "$tmp/conflicts"

  if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git -c user.name="git maintenance" -c user.email="maintenance@example.invalid" -c commit.gpgsign=false commit --no-edit
  fi
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit with two parents
  probe: test "$(git rev-list --parents -n 1 HEAD | awk '{ print NF-1 }')" -ge 2
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: the index has no unmerged entries
  probe: test -z "$(git diff --name-only --diff-filter=U -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_markers
  description: no tracked file contains a merge conflict marker
  probe: '! git grep -qE ''^(<<<<<<< |>>>>>>> )'' -- .'
  expect_exit: 0
  expect_pattern: null
- name: tracked_worktree_clean
  description: no tracked changes remain after the merge commit
  probe: test -z "$(git status --porcelain --untracked-files=no -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: upstream_lines_kept
  description: the merge result contains every line of upstream's version of the files
    upstream changed
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2) || exit 1
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      git cat-file -e "HEAD^2:$f" 2>/dev/null || continue
      if [ "$(git diff --numstat "$base" HEAD^2 -- "$f" | awk '$1=="-" && $2=="-" { print "yes"; exit }')" = yes ]; then
        continue
      fi
      if comm -23 \
           <(git show "HEAD^2:$f" | sort -u) \
           <(git show "HEAD:$f" | sort -u) | grep -q .; then
        exit 1
      fi
    done < <(git diff --name-only -z "$base" HEAD^2 | tr '\0' '\n' | sort -u)
    exit 0
  expect_exit: 0
  expect_pattern: null
- name: local_additions_kept
  description: every line the local side added to a file present on both sides appears
    in the merge result
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2) || exit 1
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      git cat-file -e "HEAD^1:$f" 2>/dev/null || continue
      git cat-file -e "HEAD^2:$f" 2>/dev/null || continue
      if [ "$(git diff --numstat "$base" HEAD^1 -- "$f" | awk '$1=="-" && $2=="-" { print "yes"; exit }')" = yes ]; then
        continue
      fi
      if ! git diff -U0 "$base" HEAD^1 -- "$f" |
        awk '
          function flush() {
            if (open) {
              extra = addn - deln
              if (extra > 0) {
                for (i = addn - extra + 1; i <= addn; i++) print plus[i]
              }
            }
            open = 0
          }
          /^@@/ {
            flush()
            match($0, /-[0-9]+(,[0-9]+)?/)
            old = substr($0, RSTART + 1, RLENGTH - 1)
            split(old, oa, ",")
            deln = (oa[2] == "") ? 1 : oa[2] + 0
            addn = 0
            open = 1
            next
          }
          /^\+\+\+/ { next }
          /^\+/ { addn++; plus[addn] = substr($0, 2); next }
          /^-/ { next }
          END { flush() }
        ' |
        while IFS= read -r line; do
          git show "HEAD:$f" | grep -qxF -- "$line" || exit 1
        done; then
        exit 1
      fi
    done < <(git diff --name-only -z "$base" HEAD^1 | tr '\0' '\n' | sort -u)
    exit 0
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: The sync conflicts. Resolve it the way this project expects.
    Start from upstream's dependency file and add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
