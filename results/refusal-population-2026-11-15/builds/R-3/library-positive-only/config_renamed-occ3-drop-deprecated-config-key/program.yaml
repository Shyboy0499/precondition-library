id: config_renamed-occ3-drop-deprecated-config-key
intent: Make the app's old-setting-name warning go away by removing the deprecated
  key's line from the config file when the renamed key is already set in the same
  file, leaving the new key and every other setting untouched.
parameters: []
preconditions:
- name: renames_map_present
  description: a tracked rename map lists old and new setting names
  probe: |-
    set -e
    ren=$(git ls-files -z | tr '\0' '\n' | grep -iE '(^|/)renames[^/]*\.conf$' | head -n1)
    [ -n "$ren" ]
    grep -qE '^[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*=[[:space:]]*[A-Za-z0-9_.-]+[[:space:]]*$' "$ren"
  expect_exit: 0
  expect_pattern: null
- name: stale_key_also_new_key
  description: a tracked config file sets an old key and its replacement at the same
    time
  probe: |-
    set -e
    ren=$(git ls-files -z | tr '\0' '\n' | grep -iE '(^|/)renames[^/]*\.conf$' | head -n1)
    [ -n "$ren" ]
    while IFS= read -r line; do
      case "$line" in
        ''|\#*) continue ;;
      esac
      case "$line" in
        *=*) ;;
        *) continue ;;
      esac
      old=${line%%=*}
      new=${line#*=}
      old=$(printf '%s' "$old" | tr -d '[:space:]')
      new=$(printf '%s' "$new" | tr -d '[:space:]')
      [ -n "$old" ] || continue
      [ -n "$new" ] || continue
      [ "$old" = "$new" ] && continue
      while IFS= read -r f; do
        [ "$f" = "$ren" ] && continue
        if grep -qE "^[[:space:]]*$old[[:space:]]*=" "$f" && grep -qE "^[[:space:]]*$new[[:space:]]*=" "$f"; then
          exit 0
        fi
      done < <(git ls-files -z | tr '\0' '\n' | grep -E '\.(conf|ini|cfg|properties|env|toml)$' || true)
    done < "$ren"
    exit 1
  expect_exit: 0
  expect_pattern: null
- name: config_files_clean
  description: tracked config files have no uncommitted modifications
  probe: '! git status --porcelain -- ''*.conf'' ''*.ini'' ''*.cfg'' ''*.properties''
    ''*.env'' ''*.toml'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  pairs_file=$(mktemp)
  changed_list=$(mktemp)
  trap 'rm -f "$pairs_file" "$changed_list"' EXIT
  renames_files=$(git ls-files -z | tr '\0' '\n' | grep -iE '(^|/)renames[^/]*\.conf$' || true)
  while IFS= read -r ren; do
    [ -n "$ren" ] || continue
    [ -f "$ren" ] || continue
    while IFS= read -r line; do
      case "$line" in
        ''|\#*) continue ;;
      esac
      case "$line" in
        *=*) ;;
        *) continue ;;
      esac
      old=${line%%=*}
      new=${line#*=}
      old=$(printf '%s' "$old" | tr -d '[:space:]')
      new=$(printf '%s' "$new" | tr -d '[:space:]')
      [ -n "$old" ] || continue
      [ -n "$new" ] || continue
      [ "$old" = "$new" ] && continue
      printf '%s\t%s\t%s\n' "$ren" "$old" "$new" >> "$pairs_file"
    done < "$ren"
  done <<EOF2
  $renames_files
  EOF2
  [ -s "$pairs_file" ]
  while IFS= read -r f; do
    [ -n "$f" ] || continue
    [ -f "$f" ] || continue
    case "$f" in
      */renames*.conf|renames*.conf) continue ;;
    esac
    drop=""
    while IFS=$'\t' read -r ren old new; do
      [ -n "$old" ] || continue
      if grep -qE "^[[:space:]]*$old[[:space:]]*=" "$f" && grep -qE "^[[:space:]]*$new[[:space:]]*=" "$f"; then
        drop="$drop $old"
      fi
    done < "$pairs_file"
    [ -n "$drop" ] || continue
    tmp=$(mktemp)
    awk -v olds="$drop" 'BEGIN { n=split(olds,a," "); for (i=1;i<=n;i++) if (a[i] != "") drop[a[i]]=1 } { key=$0; sub(/[[:space:]]*=.*/, "", key); gsub(/^[[:space:]]+|[[:space:]]+$/, "", key); if (key in drop) next; print }' "$f" > "$tmp"
    if cmp -s "$f" "$tmp"; then
      rm -f "$tmp"
    else
      cat "$tmp" > "$f"
      rm -f "$tmp"
      printf '%s\0' "$f" >> "$changed_list"
    fi
  done < <(git ls-files -z | tr '\0' '\n' | grep -E '\.(conf|ini|cfg|properties|env|toml)$' || true)
  if [ -s "$changed_list" ]; then
    paths=()
    while IFS= read -r -d '' p; do
      paths+=("$p")
    done < "$changed_list"
    git add -- "${paths[@]}"
    git commit -m "config: drop deprecated setting names" --no-verify -- "${paths[@]}"
  fi
steps: null
postconditions:
- name: no_old_and_new_duplicates
  description: no tracked config file sets an old key together with its replacement
  probe: |-
    set -e
    ren=$(git ls-files -z | tr '\0' '\n' | grep -iE '(^|/)renames[^/]*\.conf$' | head -n1)
    [ -n "$ren" ]
    while IFS= read -r line; do
      case "$line" in
        ''|\#*) continue ;;
      esac
      case "$line" in
        *=*) ;;
        *) continue ;;
      esac
      old=${line%%=*}
      new=${line#*=}
      old=$(printf '%s' "$old" | tr -d '[:space:]')
      new=$(printf '%s' "$new" | tr -d '[:space:]')
      [ -n "$old" ] || continue
      [ -n "$new" ] || continue
      [ "$old" = "$new" ] && continue
      while IFS= read -r f; do
        [ "$f" = "$ren" ] && continue
        if grep -qE "^[[:space:]]*$old[[:space:]]*=" "$f" && grep -qE "^[[:space:]]*$new[[:space:]]*=" "$f"; then
          exit 1
        fi
      done < <(git ls-files -z | tr '\0' '\n' | grep -E '\.(conf|ini|cfg|properties|env|toml)$' || true)
    done < "$ren"
    exit 0
  expect_exit: 0
  expect_pattern: null
- name: renames_map_untouched
  description: the rename map was not modified by the change
  probe: '! git diff --name-only HEAD -- ''*renames*.conf'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: config_changes_committed
  description: no uncommitted changes remain in tracked config files
  probe: '! git status --porcelain -- ''*.conf'' ''*.ini'' ''*.cfg'' ''*.properties''
    ''*.env'' ''*.toml'' | grep -q .'
  expect_exit: 0
  expect_pattern: null
variant: drop_old
provenance:
  compiled_from_task: The app keeps warning that my config uses old setting names.
    Make the warning go away without changing what the settings do. The new name is
    already set too, so delete the old key's line and keep the new one.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: The app keeps warning that my config uses old setting names. Make the
    warning go away without changing what the settings do. The new name is already
    set too, so delete the old key's line and keep the new one./seed-23-config_renamed-212
  fault: config_renamed
status: candidate
