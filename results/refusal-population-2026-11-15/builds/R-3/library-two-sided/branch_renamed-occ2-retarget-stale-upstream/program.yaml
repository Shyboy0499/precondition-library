id: branch_renamed-occ2-retarget-stale-upstream
intent: Retarget the current branch's upstream tracking to upstream's current branch
  and fast-forward to it, keeping the branch name and local work.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_named_branch
  description: HEAD is attached to a local branch, so retargeting preserves its name
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: .+
- name: tracks_different_upstream
  description: the current branch has upstream tracking configured, but it differs
    from the target upstream branch
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    current_remote=$(git config --get "branch.$branch.remote") || exit 1
    current_merge=$(git config --get "branch.$branch.merge") || exit 1
    test "$current_remote" != "{upstream_remote}" || test "$current_merge" != "refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: target_upstream_ref_exists
  description: the target upstream-tracking ref is available locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: head_can_fast_forward
  description: local HEAD is an ancestor of the target branch and behind it, so it
    can fast-forward without a merge commit
  probe: |-
    git merge-base --is-ancestor HEAD {upstream_remote}/{upstream_branch} || exit 1
    test "$(git rev-parse HEAD)" != "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: no staged, modified, or untracked changes would obstruct the fast-forward
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
body: |-
  git fetch --prune {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: tracking_retargeted
  description: the current branch now tracks the target upstream branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" =
    "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: caught_up
  description: HEAD matches the target upstream branch commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: still_on_named_branch
  description: HEAD remains attached to a local branch after catching up
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: .+
- name: worktree_clean
  description: the fast-forward left no uncommitted changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: My branch seems to follow something upstream no longer has.
    Point it at whatever upstream uses now, and keep my work. Keep my branch's name,
    point its tracking at upstream's new branch and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: My branch seems to follow something upstream no longer has. Point it
    at whatever upstream uses now, and keep my work. Keep my branch's name, point
    its tracking at upstream's new branch and catch up./seed-10-branch_renamed-212
  fault: branch_renamed
status: admitted
