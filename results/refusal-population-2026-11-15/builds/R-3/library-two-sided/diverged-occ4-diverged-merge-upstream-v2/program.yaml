id: diverged-occ4-diverged-merge-upstream-v2
intent: Bring a diverged local branch back into line with upstream by merging upstream
  into it, keeping both histories, but only when upstream's default branch has not
  been renamed away and the merge applies cleanly.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_branch
  description: HEAD is attached to a local branch, not detached
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_exists
  description: the upstream-tracking ref is already present locally
  probe: git rev-parse --verify --quiet "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: the repository is not already in the middle of a merge
  probe: '! test -e "$(git rev-parse --git-path MERGE_HEAD)"'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no modified, staged or untracked files
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: branches_diverged
  description: both the local branch and upstream have commits the other lacks
  probe: |-
    test "$(git rev-list --count '{upstream_remote}/{upstream_branch}..HEAD')" -gt 0 &&
    test "$(git rev-list --count 'HEAD..{upstream_remote}/{upstream_branch}')" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_branch_not_renamed
  description: if the remote advertises a default branch, it names the same branch
    we track and that the local branch is called
  probe: |-
    remote_head=$(git symbolic-ref -q --short "refs/remotes/{upstream_remote}/HEAD") || exit 0
    branch=$(git symbolic-ref --short HEAD) || exit 1
    test "$remote_head" = "{upstream_remote}/{upstream_branch}"
    test "$remote_head" = "{upstream_remote}/$branch"
  expect_exit: 0
  expect_pattern: null
- name: local_tracks_upstream_branch
  description: the checked-out branch's configured upstream is the branch being merged
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null)"
    = "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: trial_merge_is_clean
  description: replaying the merge blob-by-blob on the files both sides touched produces
    no conflicts
  probe: |-
    base=$(git merge-base HEAD "{upstream_remote}/{upstream_branch}") || exit 1
    conflicted=$(
      comm -12 \
        <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort) \
        <(git diff --name-only -z "$base" "{upstream_remote}/{upstream_branch}" | tr '\0' '\n' | sort) |
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        [ "$(git cat-file -t "$base:$f" 2>/dev/null)" = blob ] || continue
        [ "$(git cat-file -t "HEAD:$f" 2>/dev/null)" = blob ] || continue
        [ "$(git cat-file -t "{upstream_remote}/{upstream_branch}:$f" 2>/dev/null)" = blob ] || continue
        if ! git merge-file -p --diff3 \
            <(git cat-file blob "HEAD:$f") \
            <(git cat-file blob "$base:$f") \
            <(git cat-file blob "{upstream_remote}/{upstream_branch}:$f") >/dev/null 2>&1; then
          echo "conflict: $f"
        fi
      done
    )
    test -z "$conflicted"
  expect_exit: 0
  expect_pattern: null
body: |
  git merge --no-edit {upstream_remote}/{upstream_branch} || {
    git merge --abort 2>/dev/null || git reset --merge 2>/dev/null || true
    exit 1
  }
steps: null
postconditions:
- name: upstream_is_ancestor
  description: upstream's tip is now contained in HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_has_two_parents
  description: HEAD is a merge commit, so both histories are preserved
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after
  description: no conflict markers or leftover changes remain
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: This branch and upstream have both changed. Bring it back into
    line. Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: This branch and upstream have both changed. Bring it back into line.
    Merge upstream into my branch and keep both histories./seed-0-diverged-212
  fault: diverged
status: candidate
