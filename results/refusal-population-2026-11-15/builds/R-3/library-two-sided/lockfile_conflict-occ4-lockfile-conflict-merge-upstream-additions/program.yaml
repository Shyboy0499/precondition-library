id: lockfile_conflict-occ4-lockfile-conflict-merge-upstream-additions
intent: |
  Catch up with upstream without losing what either side added or reviving what either side removed: merge the upstream branch into the current branch, resolve every conflicted file starting from upstream's version, re-apply the local pure additions and local pure removals, and commit the merge.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_ready
  description: the worktree is clean, or a merge is already in progress with unmerged
    paths to resolve
  probe: |-
    if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
      test -n "$(git diff --name-only --diff-filter=U -z | tr '\0' '\n')"
    else
      test -z "$(git status --porcelain)"
    fi
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_and_branch_exist
  description: the upstream remote and its remote-tracking branch are available locally
  probe: |-
    git remote get-url {upstream_remote} >/dev/null 2>&1 &&
    git rev-parse --verify --quiet {upstream_remote}/{upstream_branch} >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: branches_diverged
  description: HEAD and the upstream branch have both advanced since their merge base
  probe: |-
    counts=$(git rev-list --left-right --count HEAD...{upstream_remote}/{upstream_branch}) || exit 1
    set -- $counts
    test "$1" -gt 0 && test "$2" -gt 0
  expect_exit: 0
  expect_pattern: null
- name: both_sides_touched_same_file
  description: at least one file changed on both HEAD and the upstream branch since
    their merge base
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote} >/dev/null 2>&1 || echo "warning: fetch of {upstream_remote} failed; using the existing remote-tracking ref" >&2
  git rev-parse --verify --quiet {upstream_remote}/{upstream_branch} >/dev/null || { echo "missing {upstream_remote}/{upstream_branch}" >&2; exit 1; }
  if ! git var GIT_AUTHOR_IDENT >/dev/null 2>&1; then
    export GIT_AUTHOR_NAME='Dependency Merge'
    export GIT_AUTHOR_EMAIL='merge@example.invalid'
  fi
  if ! git var GIT_COMMITTER_IDENT >/dev/null 2>&1; then
    export GIT_COMMITTER_NAME='Dependency Merge'
    export GIT_COMMITTER_EMAIL='merge@example.invalid'
  fi
  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    git merge --no-ff --no-commit {upstream_remote}/{upstream_branch} >/dev/null 2>&1 || true
  fi
  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
    echo "merge with {upstream_remote}/{upstream_branch} did not start" >&2
    exit 1
  fi
  python3 - <<'PY'
  import difflib, subprocess, sys

  def git(*args):
      cmd = [b'git'] + [a if isinstance(a, bytes) else str(a).encode() for a in args]
      p = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
      return p.returncode, p.stdout, p.stderr

  def stage(n, path):
      rc, out, err = git(b'show', b':' + str(n).encode() + b':' + path)
      if rc != 0:
          return None
      return out

  def to_lines(data):
      if data is None:
          return []
      lines = data.split(b'\n')
      if lines and lines[-1] == b'':
          lines.pop()
      return lines

  rc, out, err = git(b'diff', b'--name-only', b'--diff-filter=U', b'-z')
  if rc != 0:
      sys.stderr.write(err.decode('utf-8', 'replace'))
      sys.exit(1)

  for path in [p for p in out.split(b'\0') if p]:
      ours = stage(2, path)
      theirs = stage(3, path)
      base = stage(1, path)
      if ours is None or theirs is None:
          git(b'rm', b'-f', b'--', path)
          continue
      base_lines = to_lines(base)
      ours_lines = to_lines(ours)
      new_lines = to_lines(theirs)
      insertions = []
      deletions = []
      matcher = difflib.SequenceMatcher(None, base_lines, ours_lines, autojunk=False)
      for tag, i1, i2, j1, j2 in matcher.get_opcodes():
          if tag == 'delete':
              deletions.extend(base_lines[i1:i2])
          elif tag == 'insert':
              insertions.append((i1, ours_lines[j1:j2]))
      for line in deletions:
          try:
              new_lines.remove(line)
          except ValueError:
              pass
      for i1, added in insertions:
          pos = None
          if i1 == 0:
              pos = 0
          elif i1 <= len(base_lines):
              anchor = base_lines[i1 - 1]
              if anchor in new_lines:
                  pos = new_lines.index(anchor) + 1
          if pos is None:
              if new_lines and new_lines[-1].strip() in (b']', b')', b'}'):
                  pos = len(new_lines) - 1
              else:
                  pos = len(new_lines)
          for line in added:
              if line not in new_lines:
                  new_lines.insert(pos, line)
                  pos += 1
      data = b'\n'.join(new_lines)
      if data:
          data += b'\n'
      with open(path, 'wb') as handle:
          handle.write(data)
      rc, out2, err2 = git(b'add', b'--', path)
      if rc != 0:
          sys.stderr.write(err2.decode('utf-8', 'replace'))
          sys.exit(rc)
  PY
  rc=$?
  if [ "$rc" -ne 0 ]; then
    exit "$rc"
  fi
  git commit --no-edit --allow-empty >/dev/null 2>&1 || git -c user.name='Dependency Merge' -c user.email='merge@example.invalid' commit --no-edit --allow-empty >/dev/null
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit whose second parent is the upstream tip
  probe: git rev-parse --verify HEAD^2 >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries
  description: the index holds no unmerged paths
  probe: test -z "$(git diff --name-only --diff-filter=U -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_markers
  description: no conflict markers remain in tracked working-tree files
  probe: |-
    git grep -q -e '^<<<<<<< ' -e '^>>>>>>> ' -- .
    test $? -eq 1
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the merge is committed and no uncommitted changes remain
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: head_contains_upstream
  description: the upstream branch tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_additions_and_removals_respected
  description: local pure additions survive and upstream pure removals stay removed
  probe: |-
    python3 - <<'PY'
    import difflib, subprocess, sys

    def git(*args):
        cmd = [b'git'] + [a if isinstance(a, bytes) else str(a).encode() for a in args]
        p = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
        if p.returncode != 0:
            sys.stderr.write(p.stderr.decode('utf-8', 'replace'))
            sys.exit(p.returncode)
        return p.stdout

    def to_lines(data):
        lines = data.split(b'\n')
        if lines and lines[-1] == b'':
            lines.pop()
        return lines

    def changed(rev, base):
        out = git(b'diff', b'--name-only', b'-z', base, rev)
        return [p for p in out.split(b'\0') if p]

    base = git(b'merge-base', b'HEAD^1', b'HEAD^2').decode().strip()
    paths = set(changed(b'HEAD^1', base)) | set(changed(b'HEAD^2', base))
    for path in paths:
        probe = subprocess.run([b'git', b'cat-file', b'-e', b'HEAD:' + path],
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE)
        if probe.returncode != 0:
            continue
        final_lines = to_lines(git(b'show', b'HEAD:' + path))
        base_vs_local = difflib.SequenceMatcher(
            None, to_lines(git(b'show', base + b':' + path)),
            to_lines(git(b'show', b'HEAD^1:' + path)), autojunk=False)
        for tag, i1, i2, j1, j2 in base_vs_local.get_opcodes():
            if tag == 'insert':
                local_lines = to_lines(git(b'show', b'HEAD^1:' + path))[j1:j2]
                for line in local_lines:
                    if line not in final_lines:
                        sys.stderr.write('missing local addition in ' +
                                         path.decode('utf-8', 'replace') + ': ' +
                                         line.decode('utf-8', 'replace') + '\n')
                        sys.exit(1)
        base_vs_upstream = difflib.SequenceMatcher(
            None, to_lines(git(b'show', base + b':' + path)),
            to_lines(git(b'show', b'HEAD^2:' + path)), autojunk=False)
        for tag, i1, i2, j1, j2 in base_vs_upstream.get_opcodes():
            if tag == 'delete':
                removed = to_lines(git(b'show', base + b':' + path))[i1:i2]
                for line in removed:
                    if line in final_lines:
                        sys.stderr.write('revived upstream removal in ' +
                                         path.decode('utf-8', 'replace') + ': ' +
                                         line.decode('utf-8', 'replace') + '\n')
                        sys.exit(1)
    PY
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: Catch up with upstream without losing what either side added,
    or reviving what either side removed. Start from upstream's dependency file and
    add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Catch up with upstream without losing what either side added, or reviving
    what either side removed. Start from upstream's dependency file and add back what
    I added./seed-5-lockfile_conflict-212
  fault: lockfile_conflict
status: candidate
