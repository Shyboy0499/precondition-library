id: diverged-occ1-diverged-replay-local-commits-on-upstream-rebase
intent: Replay the current branch's local commits on top of the upstream branch so
  the history stays linear, keeping the local work and leaving the working tree clean.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_tracking_ref_exists
  description: the upstream remote-tracking ref is present locally so the divergence
    can be measured
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}^{commit}'
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_still_published
  description: the upstream branch we replay onto still exists on the remote, i.e.
    it was not renamed or deleted there
  probe: git ls-remote --exit-code '{upstream_remote}' 'refs/heads/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: remote_head_mirror_is_integration_branch
  description: if the local clone mirrors the remote's default branch, that default
    is the branch we integrate with
  probe: |-
    ref=$(git symbolic-ref --quiet 'refs/remotes/{upstream_remote}/HEAD' 2>/dev/null) || exit 0
    test "$ref" = 'refs/remotes/{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: upstream_advertised_head_is_integration_branch
  description: if the upstream remote advertises a default branch, that default is
    the branch we integrate with
  probe: |-
    out=$(git ls-remote --symref '{upstream_remote}' HEAD 2>/dev/null) || exit 0
    ref=$(printf '%s\n' "$out" | sed -n 's|^ref:[[:space:]]*\(refs/heads/[^[:space:]]*\)[[:space:]]*HEAD$|\1|p')
    test -z "$ref" || test "$ref" = 'refs/heads/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: current_branch_tracks_upstream
  description: the checked-out branch is the one configured to integrate with the
    upstream branch
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    test "$(git for-each-ref --format='%(upstream:short)' "refs/heads/$branch")" = '{upstream_remote}/{upstream_branch}'
  expect_exit: 0
  expect_pattern: null
- name: has_local_commits
  description: the current branch carries commits that upstream does not have
  probe: test "$(git rev-list --count '{upstream_remote}/{upstream_branch}..HEAD')"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream has commits the local branch does not have, so there is something
    to replay onto
  probe: test "$(git rev-list --count 'HEAD..{upstream_remote}/{upstream_branch}')"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_history_is_linear
  description: the local commits contain no merges, so replaying them keeps the history
    linear
  probe: '! git rev-list --merges ''{upstream_remote}/{upstream_branch}..HEAD'' |
    grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: no staged, unstaged or untracked files that a rebase would disturb
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: replay_touches_disjoint_files
  description: no path is modified by both the local commits and the upstream commits,
    so the replay cannot conflict
  probe: |-
    base=$(git merge-base HEAD '{upstream_remote}/{upstream_branch}') || exit 1
    ! comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort -u) \
      <(git diff --name-only -z "$base" '{upstream_remote}/{upstream_branch}' | tr '\0' '\n' | sort -u) \
      | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: upstream's tip is contained in HEAD after the replay
  probe: git merge-base --is-ancestor '{upstream_remote}/{upstream_branch}' HEAD
  expect_exit: 0
  expect_pattern: null
- name: local_commits_preserved
  description: HEAD still carries local commits beyond upstream
  probe: test "$(git rev-list --count '{upstream_remote}/{upstream_branch}..HEAD')"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: history_is_linear
  description: no merge commits were introduced between upstream and HEAD
  probe: '! git rev-list --merges ''{upstream_remote}/{upstream_branch}..HEAD'' |
    grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: worktree_still_clean
  description: the rebase left no conflicted or dirty files behind
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: I have local work and upstream has new commits. Untangle it.
    Replay my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I have local work and upstream has new commits. Untangle it. Replay
    my local commits on top of upstream so the history stays linear./seed-5-diverged-212
  fault: diverged
status: admitted
