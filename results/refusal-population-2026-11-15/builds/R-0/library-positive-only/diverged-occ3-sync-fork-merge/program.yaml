id: diverged-occ3-sync-fork-merge
intent: Get the fork back in sync with upstream without losing local commits by merging
  upstream into the current branch and keeping both histories.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_configured
  description: the named upstream remote exists
  probe: git remote get-url '{upstream_remote}' >/dev/null 2>&1
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_fetched
  description: the upstream branch is available as a remote-tracking ref
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}^{commit}'
    >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: on_attached_branch
  description: HEAD is attached to a local branch
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: ^refs/heads/
- name: clean_worktree
  description: there are no tracked or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: there is no existing merge to finish or abort
  probe: test ! -f "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: local_has_commits_to_keep
  description: the current branch has at least one commit not in upstream
  probe: test "$(git rev-list --count '{upstream_remote}/{upstream_branch}'..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream has at least one commit not in the current branch
  probe: test "$(git rev-list --count HEAD..'{upstream_remote}/{upstream_branch}')"
    -gt 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch '{upstream_remote}' '+refs/heads/{upstream_branch}:refs/remotes/{upstream_remote}/{upstream_branch}'
  git merge --no-ff --no-edit '{upstream_remote}/{upstream_branch}'
steps: null
postconditions:
- name: merge_commit_created
  description: HEAD is a merge commit with two parents
  probe: test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 3
  expect_exit: 0
  expect_pattern: null
- name: upstream_is_ancestor
  description: the upstream branch is contained in HEAD's history
  probe: git merge-base --is-ancestor '{upstream_remote}/{upstream_branch}' HEAD
  expect_exit: 0
  expect_pattern: null
- name: no_missing_upstream_commits
  description: no upstream commits remain absent from HEAD
  probe: test "$(git rev-list --count HEAD..'{upstream_remote}/{upstream_branch}')"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_paths
  description: no conflict entries remain in the index
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the merge left no uncommitted changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories./seed-4-diverged-28615
  fault: diverged
status: admitted
