id: diverged-occ2-diverged-discard-local-commits-reset-upstream
intent: Make the current branch match its upstream exactly by discarding local commits
  and resetting to the upstream tip.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: is_git_worktree
  description: the current directory is a non-bare git working tree
  probe: git rev-parse --is-inside-work-tree
  expect_exit: 0
  expect_pattern: ^true$
- name: has_upstream_remote
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: has_upstream_tracking_ref
  description: the upstream remote-tracking branch exists locally
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch
  description: HEAD is attached to a local branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: has_local_commits_to_discard
  description: the current branch has commits that are not in the upstream branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: the upstream branch has commits that are not in the current branch
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked, staged, or untracked changes to preserve
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_index_entries
  description: the index has no conflicted (unmerged) entries to resolve first
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_carry_no_file_changes
  description: the commits ahead of upstream introduce no file changes relative to
    the merge base, so discarding them drops no work; states whose local commits modify
    files need merge or rebase instead
  probe: git diff --quiet "$(git merge-base HEAD {upstream_remote}/{upstream_branch})"
    HEAD
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote} --prune
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is exactly the upstream tip commit
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: no commits remain that are absent from upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -eq 0
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_reset
  description: the working tree is clean after the reset
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Upstream moved ahead of me. Get me back in line with it. My
    local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Upstream moved ahead of me. Get me back in line with it. My local commits
    can go: make my branch match upstream exactly./seed-3-diverged-28615'
  fault: diverged
status: admitted
