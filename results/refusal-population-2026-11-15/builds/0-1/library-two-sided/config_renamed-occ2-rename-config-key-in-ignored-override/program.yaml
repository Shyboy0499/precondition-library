        n = trim(substr(t, eq+1))
        if (o != "" && n != "") print o "\t" n
      }')
    [ -n "$map" ] || exit 0
    bad=0
    while IFS= read -r -d '' file; do
      [ -f "$file" ] || continue
      while IFS=$'\t' read -r old new; do
        [ -n "$old" ] || continue
        if awk -v key="$old" '
          function keyof(s,   i, j, e, t) {
            i = 1
            t = length(s)
            while (i <= t && substr(s, i, 1) ~ /[[:space:]]/) i++
            if (i > t) return ""
            if (substr(s, i, 1) == "#") return ""
            e = index(substr(s, i), "=")
            if (e == 0) return ""
            j = i + e - 2
            while (j >= i && substr(s, j, 1) ~ /[[:space:]]/) j--
            return substr(s, i, j - i + 1)
          }
          { if (keyof($0) == key) found = 1 }
          END { exit(found ? 0 : 1) }
        ' "$file"; then
          bad=1
          break
        fi
      done <<< "$map"
      [ "$bad" -eq 1 ] && break
    done < <(git ls-files --others --ignored --exclude-standard -z)
    exit $bad
  expect_exit: 0
  expect_pattern: null
