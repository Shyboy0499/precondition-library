id: diverged-occ2-rebase-diverged-onto-upstream
intent: Untangle diverged local and upstream history by replaying the local commits
  on top of the upstream branch, keeping the history linear.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: no tracked or untracked modifications are present before rewriting
    history
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the upstream branch has a remote-tracking ref in this repository
  probe: git rev-parse --verify --quiet 'refs/remotes/{upstream_remote}/{upstream_branch}^{commit}'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: HEAD has commits that are not yet in the upstream branch
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_commits_ahead
  description: the upstream branch has commits that HEAD does not contain
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: no_rebase_in_progress
  description: no rebase or merge is already mid-flight
  probe: test ! -d "$(git rev-parse --git-path rebase-merge)" && test ! -d "$(git
    rev-parse --git-path rebase-apply)" && test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_default_branch_is_target
  description: the upstream remote has not renamed its default branch away from the
    branch being replayed onto
  probe: |-
    r=$(git ls-remote --symref {upstream_remote} HEAD 2>/dev/null | sed -n 's|^ref: refs/heads/\([^[:space:]]*\)[[:space:]]*HEAD$|\1|p')
    d=$(git symbolic-ref -q --short refs/remotes/{upstream_remote}/HEAD 2>/dev/null || true)
    cur=$(git symbolic-ref -q --short HEAD 2>/dev/null || true)
    [ -z "$r" ] || [ "$r" = "{upstream_branch}" ] || [ "$r" = "$cur" ] || exit 1
    [ -z "$d" ] || [ "$d" = "{upstream_remote}/{upstream_branch}" ] || [ "$d" = "{upstream_remote}/$cur" ] || exit 1
  expect_exit: 0
  expect_pattern: null
- name: tracking_branch_is_target
  description: the checked-out branch tracks exactly the upstream branch the replay
    targets
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null)"
    = "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_and_local_touch_disjoint_files
  description: the local commits and the upstream commits modify no common paths,
    so the replay cannot need a conflict resolution
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) || exit 1
    ! comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sed '/^$/d' | sort -u) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed '/^$/d' | sort -u) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  git update-ref refs/backup/pre-rebase HEAD
  git fetch {upstream_remote}
  if ! git rebase {upstream_remote}/{upstream_branch}; then
    git rebase --abort || true
    exit 1
  fi
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream tip is an ancestor of HEAD after the replay
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: fork_point_is_upstream
  description: the common ancestor of HEAD and upstream is exactly the upstream tip
  probe: test "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" = "$(git
    rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: history_linear
  description: no merge commits were introduced above the upstream tip
  probe: git rev-list --count --merges {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^0$
- name: worktree_clean_after
  description: the working tree remains clean after the rebase completed
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: I have local work and upstream has new commits. Untangle it.
    Replay my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I have local work and upstream has new commits. Untangle it. Replay
    my local commits on top of upstream so the history stays linear./seed-5-diverged-25587
  fault: diverged
status: admitted
