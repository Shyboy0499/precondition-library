id: diverged-occ3-diverged-sync-fork-discard
intent: Make the current branch match upstream exactly, discarding local-only commits.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote is present
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: on_a_local_branch
  description: HEAD is attached to a branch, not detached
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_ref_available
  description: the remote-tracking ref for upstream's branch exists
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: histories_are_related
  description: HEAD and upstream share a merge base
  probe: git merge-base HEAD {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked or untracked changes in the working tree
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: upstream has commits that the current branch lacks
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: many_local_only_commits
  description: the branch is ahead of upstream by at least three commits, the diverged
    shape whose local line is meant to be discarded
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^([3-9]|[1-9][0-9]+)$
body: |
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD points at the same commit as upstream's branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_local_only_commits
  description: the branch has no commits ahead of upstream
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^0$
- name: tree_matches_upstream
  description: the working tree matches upstream's tree
  probe: git diff --quiet HEAD {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_reset
  description: the reset leaves no tracked or untracked changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-25587'
  fault: diverged
status: admitted
