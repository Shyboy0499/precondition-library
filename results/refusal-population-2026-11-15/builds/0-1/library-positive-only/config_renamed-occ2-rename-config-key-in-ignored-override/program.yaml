          old = substr($0, 1, eq-1)
          new = substr($0, eq+1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", old)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", new)
          if (old != "" && new != "") print old "\t" new
        }
      ')
    done < <(git ls-files --others --ignored --exclude-standard -z)
    exit $found
  expect_exit: 0
  expect_pattern: null
- name: tracked_files_clean
  description: No tracked file is modified or staged, so the override file stays out
    of git.
  probe: git diff --quiet && git diff --cached --quiet
  expect_exit: 0
  expect_pattern: null
