            if (a[1] == key) exit 0
          }
          END { exit 1 }
        ' "$file"; then
          found=0
          break 2
        fi
      done < <(git show "{upstream_remote}/{upstream_branch}:$renames_path" | awk '
        /^[[:space:]]*[^#]/ {
          eq = index($0, "=")
