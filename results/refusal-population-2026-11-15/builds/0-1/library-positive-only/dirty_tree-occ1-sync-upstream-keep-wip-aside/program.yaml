id: dirty_tree-occ1-sync-upstream-keep-wip-aside
intent: bring the branch up to date with upstream while preserving local work in progress
  and saving untracked files that collide with upstream as <name>.local
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ahead
  description: the checked-out commit is strictly behind the upstream branch
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: fast_forwardable
  description: there are no local commits that upstream lacks
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^0$
- name: no_unmerged_paths
  description: the index has no unresolved merge entries
  probe: '! git ls-files -u | grep -q .'
  expect_exit: 0
  expect_pattern: null
- name: has_untracked_upstream_collision
  description: at least one untracked path also exists in the upstream tree
  probe: |-
    while IFS= read -r -d '' p; do
      if git cat-file -e "{upstream_remote}/{upstream_branch}:$p" 2>/dev/null; then
        exit 0
      fi
    done < <(git ls-files --others --exclude-standard -z)
    exit 1
  expect_exit: 0
  expect_pattern: null
- name: sidecar_paths_clear
  description: no colliding untracked path already has a local sidecar file
  probe: |-
    while IFS= read -r -d '' p; do
      if git cat-file -e "{upstream_remote}/{upstream_branch}:$p" 2>/dev/null; then
        if [ -e "$p.local" ]; then
          exit 1
        fi
      fi
    done < <(git ls-files --others --exclude-standard -z)
    exit 0
  expect_exit: 0
  expect_pattern: null
- name: tracked_changes_do_not_overlap_upstream
  description: no locally modified tracked path is also changed by upstream
  probe: |-
    while IFS= read -r -d '' p; do
      if ! git diff --quiet HEAD {upstream_remote}/{upstream_branch} -- "$p"; then
        exit 1
      fi
    done < <(git diff --name-only -z HEAD)
    exit 0
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch {upstream_remote}
  upstream_ref="{upstream_remote}/{upstream_branch}"
  while IFS= read -r -d '' path; do
    if git cat-file -e "$upstream_ref:$path" 2>/dev/null; then
      if cp -- "$path" "$path.local"; then
        rm -f -- "$path"
      fi
    fi
  done < <(git ls-files --others --exclude-standard -z)
  git merge --ff-only "$upstream_ref"
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is the upstream branch tip after the update
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_path_collides_with_head
  description: every remaining untracked path is distinct from every path tracked
    in HEAD
  probe: |-
    while IFS= read -r -d '' p; do
      if git cat-file -e "HEAD:$p" 2>/dev/null; then
        exit 1
      fi
    done < <(git ls-files --others --exclude-standard -z)
    exit 0
  expect_exit: 0
  expect_pattern: null
- name: collision_saved_as_local
  description: at least one saved sidecar file exists for a path now tracked in HEAD
  probe: |-
    while IFS= read -r -d '' p; do
      case "$p" in
        *.local)
          base=${p%.local}
          if git cat-file -e "HEAD:$base" 2>/dev/null; then
            exit 0
          fi
          ;;
      esac
    done < <(git ls-files --others --exclude-standard -z)
    exit 1
  expect_exit: 0
  expect_pattern: null
variant: aside
provenance:
  compiled_from_task: Bring this branch up to date with upstream, but my work in progress
    must survive. Keep my unsaved file beside upstream's version, as `<name>.local`,
    and update.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Bring this branch up to date with upstream, but my work in progress
    must survive. Keep my unsaved file beside upstream's version, as `<name>.local`,
    and update./seed-2-dirty_tree-25587
  fault: dirty_tree
status: admitted
