id: diverged-occ4-sync-fork-merge
intent: merge upstream into the local branch to sync the fork while preserving both
  histories
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_a_branch
  description: HEAD is attached to a local branch, not detached
  probe: git symbolic-ref -q HEAD >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_configured
  description: the named upstream remote exists
  probe: git remote get-url {upstream_remote} >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_present
  description: the upstream remote-tracking branch is available for comparison
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}^{commit}
    >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked or untracked changes before merging
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
- name: no_merge_in_progress
  description: no previous merge is left unresolved
  probe: test ! -e "$(git rev-parse --git-path MERGE_HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: histories_diverged
  description: local branch and upstream each have commits the other lacks
  probe: |-
    [ "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -gt 0 ] &&
    [ "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0 ]
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git merge --no-ff -m "Merge {upstream_remote}/{upstream_branch}" {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_merged
  description: the upstream branch tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_present
  description: HEAD is a merge commit with at least two parents
  probe: '[ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]'
  expect_exit: 0
  expect_pattern: null
- name: local_history_preserved
  description: the merge's first parent still contains local commits not in upstream
  probe: '[ "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD^1)"
    -gt 0 ]'
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_merge
  description: the merge left no uncommitted changes
  probe: '[ -z "$(git status --porcelain)" ]'
  expect_exit: 0
  expect_pattern: null
variant: merge
provenance:
  compiled_from_task: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Get this fork back in sync with upstream without losing my commits.
    Merge upstream into my branch and keep both histories./seed-4-diverged-25587
  fault: diverged
status: admitted
