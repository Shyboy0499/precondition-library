id: branch_renamed-occ1-retrack-upstream-and-merge
intent: Retarget the current branch to upstream's current default branch and merge
  it into the local commits.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_attached_branch
  description: HEAD is a symbolic ref to the local branch to retarget
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: no staged, unstaged or untracked changes that the merge could disturb
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: merge_not_in_progress
  description: the index has no unmerged entries
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: the configured upstream remote is present
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: target_branch_fetched
  description: the remote-tracking branch to track exists locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: not_already_tracking_target
  description: the current branch tracks a different upstream branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null)"
    != "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: upstream_has_new_commits
  description: the target branch has commits not in HEAD
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: local_has_own_commits
  description: HEAD has commits the target branch does not contain
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: no_overlapping_changes
  description: local and upstream changes do not touch the same paths, so the merge
    is clean
  probe: |-
    ! comm -12 \
      <(git diff --name-only -z "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |-
  set -e
  git fetch {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --no-ff --no-edit {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: now_tracks_target
  description: current branch's upstream is the target branch
  probe: test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "{upstream_remote}/{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: target_is_merged
  description: the target branch tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: merge_commit_has_two_parents
  description: HEAD is a merge commit joining the local work and the target branch
  probe: test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3
  expect_exit: 0
  expect_pattern: null
- name: clean_after_merge
  description: the working tree and index are clean after the merge
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_unmerged_entries
  description: the index has no conflict entries
  probe: test -z "$(git ls-files -u)"
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Track upstream's new branch and merge it into my own commits.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Track upstream's new branch and merge it into my own commits./seed-1-branch_renamed-25587
  fault: branch_renamed
status: admitted
