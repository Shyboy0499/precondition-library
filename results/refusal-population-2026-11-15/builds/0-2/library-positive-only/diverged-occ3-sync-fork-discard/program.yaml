id: diverged-occ3-sync-fork-discard
intent: Get the fork back in sync with upstream by discarding local commits and resetting
  the branch to match upstream exactly.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: on_attached_branch
  description: HEAD is on a branch rather than detached
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: the index, tracked files and untracked files are clean
  probe: |-
    git diff --quiet &&
    git diff --cached --quiet &&
    test -z "$(git ls-files --others --exclude-standard -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch has commits that are not in the upstream branch
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
body: |-
  git fetch {upstream_remote}
  git reset --hard {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream
  description: HEAD is the same commit as the upstream branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse {upstream_remote}/{upstream_branch})"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the index, tracked files and untracked files remain clean
  probe: |-
    git diff --quiet &&
    git diff --cached --quiet &&
    test -z "$(git ls-files --others --exclude-standard -z | tr '\0' '\n')"
  expect_exit: 0
  expect_pattern: null
variant: discard
provenance:
  compiled_from_task: 'Get this fork back in sync with upstream without losing my
    commits. My local commits can go: make my branch match upstream exactly.'
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: 'Get this fork back in sync with upstream without losing my commits.
    My local commits can go: make my branch match upstream exactly./seed-1-diverged-27083'
  fault: diverged
status: admitted
