id: config_renamed-occ1-config-drop-renamed-keys
intent: delete config lines whose key was renamed upstream, but only where the new
  key name is already set in the same file, then commit the edit
parameters:
- work_dir
preconditions:
- name: renames_map_present
  description: the repository tracks a renames.conf file that declares at least one
    old = new key mapping
  probe: |-
    cd "{work_dir}"
    map=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)renames\.conf$' | head -n1)
    [ -n "$map" ] || exit 1
    awk '!/^[[:space:]]*#/ && /=/ { found=1 } END { exit !found }' "$map"
  expect_exit: 0
  expect_pattern: null
- name: stale_key_duplicated_in_config
  description: at least one config file still assigns an old key although the same
    file already assigns that key's new name
  probe: |-
    cd "{work_dir}"
    map=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)renames\.conf$' | head -n1)
    [ -n "$map" ] || exit 1
    mapdir=$(dirname "$map")
    hit=0
    while IFS= read -r f; do
      case "$f" in "$map") continue ;; esac
      [ -n "$f" ] || continue
      [ -f "$f" ] || continue
      case "$f" in
        "$mapdir"/*|*.conf|*.cfg|*.ini|*.env|*.toml|*.properties) ;;
        *) continue ;;
      esac
      while IFS= read -r line || [ -n "$line" ]; do
        case "$line" in \#*|"") continue ;; *=*) ;; *) continue ;; esac
        old=${line%%=*}
        new=${line#*=}
        old=$(printf '%s' "$old" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
        new=$(printf '%s' "$new" | sed 's/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//')
        [ -n "$old" ] || continue
        [ -n "$new" ] || continue
        [ "$old" != "$new" ] || continue
        o=$(printf '%s' "$old" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
        n=$(printf '%s' "$new" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
        if grep -Eq "^[[:space:]]*${o}[[:space:]]*=" "$f" && grep -Eq "^[[:space:]]*${n}[[:space:]]*=" "$f"; then
          hit=1
        fi
      done < "$map"
    done < <(git ls-files -z | tr '\0' '\n')
    [ "$hit" = 1 ]
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: the working tree has no uncommitted or untracked files before the edit
  probe: |-
    cd "{work_dir}"
    ! git status --porcelain | grep -q .
  expect_exit: 0
  expect_pattern: null
body: |
  set -eu
  cd "{work_dir}"
  map=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)renames\.conf$' | head -n1)
  [ -n "$map" ] || { echo "no renames.conf found" >&2; exit 1; }
  mapdir=$(dirname "$map")
  changed=$(mktemp)
  trap 'rm -f "$changed"' EXIT
  : > "$changed"
  while IFS= read -r f; do
    case "$f" in "$map") continue ;; esac
    [ -n "$f" ] || continue
    [ -f "$f" ] || continue
    case "$f" in
      "$mapdir"/*|*.conf|*.cfg|*.ini|*.env|*.toml|*.properties) ;;
      *) continue ;;
    esac
    touched=0
    while IFS= read -r line || [ -n "$line" ]; do
      case "$line" in \#*|"") continue ;; *=*) ;; *) continue ;; esac
      old=${line%%=*}
      new=${line#*=}
      old=$(printf '%s' "$old" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
      new=$(printf '%s' "$new" | sed 's/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//')
      [ -n "$old" ] || continue
      [ -n "$new" ] || continue
      [ "$old" != "$new" ] || continue
      o=$(printf '%s' "$old" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
      n=$(printf '%s' "$new" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
      grep -Eq "^[[:space:]]*${n}[[:space:]]*=" "$f" || continue
      grep -Eq "^[[:space:]]*${o}[[:space:]]*=" "$f" || continue
      sed -i "/^[[:space:]]*${o}[[:space:]]*=/d" "$f"
      touched=1
    done < "$map"
    if [ "$touched" = 1 ]; then printf '%s\n' "$f" >> "$changed"; fi
  done < <(git ls-files -z | tr '\0' '\n')
  if [ -s "$changed" ]; then
    sort -u "$changed" -o "$changed"
    while IFS= read -r f; do git add -- "$f"; done < "$changed"
    git -c user.name=git-maintainer -c user.email=git-maintainer@example.com \
      commit -m "config: drop old key lines already set under their renamed keys"
  fi
steps: null
postconditions:
- name: no_stale_duplicate_keys
  description: no config file still assigns an old key whose new name is also assigned
    in that same file
  probe: |-
    cd "{work_dir}"
    map=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)renames\.conf$' | head -n1)
    [ -n "$map" ] || exit 1
    mapdir=$(dirname "$map")
    hit=0
    while IFS= read -r f; do
      case "$f" in "$map") continue ;; esac
      [ -n "$f" ] || continue
      [ -f "$f" ] || continue
      case "$f" in
        "$mapdir"/*|*.conf|*.cfg|*.ini|*.env|*.toml|*.properties) ;;
        *) continue ;;
      esac
      while IFS= read -r line || [ -n "$line" ]; do
        case "$line" in \#*|"") continue ;; *=*) ;; *) continue ;; esac
        old=${line%%=*}
        new=${line#*=}
        old=$(printf '%s' "$old" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
        new=$(printf '%s' "$new" | sed 's/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//')
        [ -n "$old" ] || continue
        [ -n "$new" ] || continue
        [ "$old" != "$new" ] || continue
        o=$(printf '%s' "$old" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
        n=$(printf '%s' "$new" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
        if grep -Eq "^[[:space:]]*${o}[[:space:]]*=" "$f" && grep -Eq "^[[:space:]]*${n}[[:space:]]*=" "$f"; then
          hit=1
        fi
      done < "$map"
    done < <(git ls-files -z | tr '\0' '\n')
    [ "$hit" = 0 ]
  expect_exit: 0
  expect_pattern: null
- name: change_committed
  description: the working tree is clean after the edit, so the deletion is recorded
    in a commit
  probe: |-
    cd "{work_dir}"
    ! git status --porcelain | grep -q .
  expect_exit: 0
  expect_pattern: null
variant: drop_old
