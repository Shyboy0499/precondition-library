id: branch_renamed-occ3-rename-fork-branch-to-upstream
intent: Rename the current local branch to upstream's new branch name, make it track
  the upstream branch, and fast-forward it to upstream.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: worktree_clean
  description: the working tree, index, and untracked files are clean
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_exists
  description: the configured upstream remote exists
  probe: git remote get-url "{upstream_remote}" >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: on_local_branch_not_already_renamed
  description: HEAD is attached to a local branch whose name is not upstream's new
    branch name
  probe: |-
    current=$(git symbolic-ref --short -q HEAD) || exit 1
    test "$current" != "{upstream_branch}"
  expect_exit: 0
  expect_pattern: null
- name: new_local_branch_absent
  description: no local branch already uses upstream's new branch name
  probe: '! git show-ref --verify --quiet "refs/heads/{upstream_branch}"'
  expect_exit: 0
  expect_pattern: null
- name: current_branch_tracks_upstream_remote
  description: the current branch is configured to track the upstream remote
  probe: |-
    current=$(git symbolic-ref --short -q HEAD) || exit 1
    test "$(git for-each-ref --format='%(upstream:remotename)' "refs/heads/$current")" = "{upstream_remote}"
  expect_exit: 0
  expect_pattern: null
- name: fast_forward_possible
  description: the current branch has no local commits absent from upstream's new
    branch
  probe: |-
    if git rev-parse --verify --quiet "refs/remotes/{upstream_remote}/{upstream_branch}^{commit}" >/dev/null; then
      git merge-base --is-ancestor HEAD "{upstream_remote}/{upstream_branch}"
    else
      git merge-base --is-ancestor HEAD '@{u}'
    fi
  expect_exit: 0
  expect_pattern: null
body: |
  set -e
  git fetch --prune "{upstream_remote}"
  current=$(git symbolic-ref --short -q HEAD)
  git branch -m "$current" "{upstream_branch}"
  git branch --set-upstream-to="{upstream_remote}/{upstream_branch}" "{upstream_branch}"
  git merge --ff-only "{upstream_remote}/{upstream_branch}"
steps: null
postconditions:
- name: current_branch_renamed
  description: HEAD is on upstream's new branch name
  probe: git symbolic-ref --short HEAD
  expect_exit: 0
  expect_pattern: ^{upstream_branch}$
- name: tracks_upstream_new_branch
  description: the renamed branch tracks upstream's new branch
  probe: git for-each-ref --format='%(upstream:short)' "refs/heads/{upstream_branch}"
  expect_exit: 0
  expect_pattern: ^{upstream_remote}/{upstream_branch}$
- name: upstream_tracking_ref_exists
  description: the remote-tracking ref for upstream's new branch exists
  probe: git rev-parse --verify --quiet "refs/remotes/{upstream_remote}/{upstream_branch}^{commit}"
    >/dev/null
  expect_exit: 0
  expect_pattern: null
- name: matches_upstream_tip
  description: HEAD is at the tip of upstream's new branch
  probe: test "$(git rev-parse HEAD)" = "$(git rev-parse "{upstream_remote}/{upstream_branch}")"
  expect_exit: 0
  expect_pattern: null
- name: worktree_still_clean
  description: no staged, unstaged, or untracked changes were introduced
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
variant: rename
provenance:
  compiled_from_task: I think upstream renamed things. Get this fork following it
    again. Rename my branch to upstream's new name and track it.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: I think upstream renamed things. Get this fork following it again. Rename
    my branch to upstream's new name and track it./seed-4-branch_renamed-3956
  fault: branch_renamed
status: admitted
