id: branch_renamed-occ1-retrack-branch-to-renamed-upstream
intent: Retarget a local branch that tracks a stale upstream branch to the remote's
  current default branch while keeping the local branch name, then fast-forward it
  to that branch.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: on_local_branch
  description: HEAD is attached to a local branch
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
- name: upstream_remote_configured
  description: the upstream remote exists
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_branch_available
  description: remote-tracking ref for upstream's current branch exists
  probe: git rev-parse --verify --quiet refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[0-9a-f]+$
- name: tracking_differs_from_upstream_default
  description: current branch's configured upstream merge ref is not the upstream
    default branch
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    merge=$(git config --get "branch.$branch.merge") || exit 1
    remote=$(git config --get "branch.$branch.remote") || exit 1
    [ "$remote" = "{upstream_remote}" ] || exit 1
    [ "$merge" != "refs/heads/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: can_fast_forward
  description: HEAD is an ancestor of upstream's branch
  probe: git merge-base --is-ancestor HEAD refs/remotes/{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: behind_upstream_branch
  description: HEAD is not already at upstream's branch commit
  probe: '[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
    ]'
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: no staged or unstaged changes to tracked files
  probe: git diff --quiet && git diff --cached --quiet
  expect_exit: 0
  expect_pattern: null
- name: no_untracked_collisions
  description: no untracked file would be overwritten by the fast-forward
  probe: '! comm -12 <(git ls-files --others --exclude-standard -z | tr ''\0'' ''\n''
    | sort) <(git diff --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr
    ''\0'' ''\n'' | sort) | grep -q .'
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch --prune {upstream_remote}
  git branch --set-upstream-to={upstream_remote}/{upstream_branch}
  git merge --ff-only {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: head_matches_upstream_branch
  description: HEAD is the same commit as upstream's branch
  probe: '[ "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/{upstream_remote}/{upstream_branch})"
    ]'
  expect_exit: 0
  expect_pattern: null
- name: tracking_is_upstream_branch
  description: current branch tracks upstream's current branch
  probe: |-
    branch=$(git symbolic-ref --quiet --short HEAD) || exit 1
    remote=$(git config --get "branch.$branch.remote") || exit 1
    merge=$(git config --get "branch.$branch.merge") || exit 1
    [ "$remote" = "{upstream_remote}" ] || exit 1
    [ "$merge" = "refs/heads/{upstream_branch}" ]
  expect_exit: 0
  expect_pattern: null
- name: still_on_local_branch
  description: HEAD remains attached to a local branch after the update
  probe: git symbolic-ref --quiet --short HEAD
  expect_exit: 0
  expect_pattern: null
variant: retrack
provenance:
  compiled_from_task: Make this branch follow upstream's current main line again,
    and catch it up. Keep my branch's name, point its tracking at upstream's new branch
    and catch up.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Make this branch follow upstream's current main line again, and catch
    it up. Keep my branch's name, point its tracking at upstream's new branch and
    catch up./seed-6-branch_renamed-29894
  fault: branch_renamed
status: admitted
