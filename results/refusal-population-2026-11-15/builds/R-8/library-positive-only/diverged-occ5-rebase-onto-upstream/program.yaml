id: diverged-occ5-rebase-onto-upstream
intent: Rebase the local branch onto the upstream branch so local commits replay linearly
  on top of upstream.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_remote_exists
  description: the named upstream remote resolves to a configured URL
  probe: git remote get-url {upstream_remote}
  expect_exit: 0
  expect_pattern: null
- name: upstream_tracking_ref_exists
  description: the remote-tracking ref for the upstream branch exists locally
  probe: git rev-parse --verify --quiet {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: current_branch_attached
  description: HEAD points at a local branch rather than a detached commit
  probe: git symbolic-ref -q HEAD
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean
  description: there are no tracked or untracked changes to interfere with rebase
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_rebase_or_merge_in_progress
  description: no rebase or merge is already underway
  probe: '! test -d "$(git rev-parse --git-path rebase-merge)" && ! test -d "$(git
    rev-parse --git-path rebase-apply)" && ! test -e "$(git rev-parse --git-path MERGE_HEAD)"'
  expect_exit: 0
  expect_pattern: null
- name: local_commits_ahead
  description: the current branch has at least one commit not in upstream
  probe: test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)"
    -gt 0
  expect_exit: 0
  expect_pattern: null
- name: upstream_commits_ahead
  description: upstream has at least one commit not in the current branch
  probe: test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})"
    -gt 0
  expect_exit: 0
  expect_pattern: null
body: |
  git fetch {upstream_remote}
  git rebase {upstream_remote}/{upstream_branch}
steps: null
postconditions:
- name: upstream_is_ancestor
  description: the upstream tip is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: history_is_linear
  description: no merge commits exist between upstream and HEAD
  probe: test -z "$(git rev-list --merges {upstream_remote}/{upstream_branch}..HEAD)"
  expect_exit: 0
  expect_pattern: null
- name: worktree_clean_after_rebase
  description: the rebase left no pending changes
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: rebase_state_cleared
  description: no rebase state directory remains
  probe: '! test -d "$(git rev-parse --git-path rebase-merge)" && ! test -d "$(git
    rev-parse --git-path rebase-apply)"'
  expect_exit: 0
  expect_pattern: null
variant: rebase
provenance:
  compiled_from_task: Upstream moved ahead of me. Get me back in line with it. Replay
    my local commits on top of upstream so the history stays linear.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Upstream moved ahead of me. Get me back in line with it. Replay my local
    commits on top of upstream so the history stays linear./seed-2-diverged-3956
  fault: diverged
status: admitted
