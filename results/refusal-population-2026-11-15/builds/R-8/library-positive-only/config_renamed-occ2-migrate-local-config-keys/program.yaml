        fi
      done
    done < <(git ls-files --others --ignored --exclude-standard -z)
    exit 0
  expect_exit: 0
  expect_pattern: null
- name: ignored_override_remains
  description: at least one ignored, untracked config-like override file remains in
    the working tree
  probe: git ls-files --others --ignored --exclude-standard -z | tr '\0' '\n' | grep
    -qE '\.(conf|cfg|ini|local)$|(^|/)config/'
  expect_exit: 0
  expect_pattern: null
- name: tracked_worktree_clean
  description: the migration did not modify any tracked file or the index
  probe: git diff --quiet && git diff --cached --quiet
  expect_exit: 0
  expect_pattern: null
variant: migrate_local
