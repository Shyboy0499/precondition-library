id: lockfile_conflict-occ3-lockfile-catch-up-take-upstream
intent: Catch up with upstream by starting from upstream's dependency file, preserving
  both sides' additions and removals, and re-adding the local additions.
parameters:
- upstream_remote
- upstream_branch
preconditions:
- name: upstream_ref_exists
  description: the upstream tracking ref exists
  probe: git rev-parse --verify {upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: null
- name: local_ahead
  description: the local branch has at least one commit not in upstream
  probe: git rev-list --count {upstream_remote}/{upstream_branch}..HEAD
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: upstream_ahead
  description: upstream has at least one commit not in the local branch
  probe: git rev-list --count HEAD..{upstream_remote}/{upstream_branch}
  expect_exit: 0
  expect_pattern: ^[1-9][0-9]*$
- name: clean_or_merge
  description: the worktree is clean, or a merge is in progress with no conflicts
    other than deps.lock
  probe: test -z "$(git status --porcelain)" || { test -e .git/MERGE_HEAD && test
    -z "$(git diff --name-only --diff-filter=U | grep -v '^deps\.lock$')"; }
  expect_exit: 0
  expect_pattern: null
- name: deps_lock_in_both
  description: deps.lock exists on both the local branch and upstream
  probe: git cat-file -e HEAD:deps.lock && git cat-file -e {upstream_remote}/{upstream_branch}:deps.lock
  expect_exit: 0
  expect_pattern: null
- name: local_changed_deps_lock
  description: the local side changed deps.lock relative to the merge base
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch})
    test -n "$(git diff --name-only "$base" HEAD -- deps.lock)"
  expect_exit: 0
  expect_pattern: null
- name: upstream_changed_deps_lock
  description: the upstream side changed deps.lock relative to the merge base
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch})
    test -n "$(git diff --name-only "$base" {upstream_remote}/{upstream_branch} -- deps.lock)"
  expect_exit: 0
  expect_pattern: null
- name: only_deps_lock_overlap
  description: deps.lock is the only file both sides changed
  probe: |-
    base=$(git merge-base HEAD {upstream_remote}/{upstream_branch})
    test -z "$(comm -12 \
      <(git diff --name-only -z "$base" HEAD | tr '\0' '\n' | sort) \
      <(git diff --name-only -z "$base" {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sort) \
      | grep -vx 'deps.lock')"
  expect_exit: 0
  expect_pattern: null
body: |
  set -e

  tmp=$(mktemp -d)
  trap 'rm -rf "$tmp"' EXIT

  upstream_ref="{upstream_remote}/{upstream_branch}"
  file=deps.lock

  git fetch {upstream_remote} || true

  if [ ! -e .git/MERGE_HEAD ]; then
    git merge --no-commit --no-ff "$upstream_ref" || true
  fi

  base=$(git merge-base HEAD "$upstream_ref")
  git show "$base:$file" > "$tmp/base"
  git show "HEAD:$file" > "$tmp/local"
  git show "$upstream_ref:$file" > "$tmp/upstream"

  mkdir "$tmp/diff"
  cp "$tmp/base" "$tmp/diff/base"
  cp "$tmp/local" "$tmp/diff/local"
  ( cd "$tmp/diff" && git diff --no-index -U0 base local > patch || true )

  awk '
    /^@@ / {
      if (hunk != "" && !(has_plus && has_minus)) printf "%s", hunk
      hunk=$0 "\n"; has_plus=0; has_minus=0; next
    }
    {
      if (hunk == "") { print; next }
      hunk = hunk $0 "\n"
      if ($0 ~ /^\+/ && $0 !~ /^\+\+\+/) has_plus=1
      if ($0 ~ /^-/ && $0 !~ /^---/) has_minus=1
    }
    END { if (hunk != "" && !(has_plus && has_minus)) printf "%s", hunk }
  ' "$tmp/diff/patch" > "$tmp/diff/patch.apply"

  if grep -q '^@@' "$tmp/diff/patch.apply"; then
    ( cd "$tmp/diff" && git apply --unidiff-zero patch.apply )
  fi

  git merge-file -p --union "$tmp/upstream" "$tmp/base" "$tmp/diff/base" > "$tmp/merged" || true

  start=$(awk '/^[[:space:]]*packages[[:space:]]*=[[:space:]]*\[[[:space:]]*$/ { print NR; exit }' "$tmp/merged")
  if [ -n "$start" ]; then
    end=$(awk -v s="$start" 'NR > s && /^[[:space:]]*\][[:space:]]*$/ { print NR; exit }' "$tmp/merged")
    if [ -n "$end" ]; then
      head -n "$start" "$tmp/merged" > "$tmp/before"
      sed -n "$((start + 1)),$((end - 1))p" "$tmp/merged" | sort > "$tmp/block"
      tail -n +"$end" "$tmp/merged" > "$tmp/after"
      cat "$tmp/before" "$tmp/block" "$tmp/after" > "$tmp/merged.sorted"
      mv "$tmp/merged.sorted" "$tmp/merged"
    fi
  fi

  cp "$tmp/merged" "$file"
  git add "$file"
  git commit --no-edit
steps: null
postconditions:
- name: upstream_merged
  description: upstream is an ancestor of HEAD
  probe: git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD
  expect_exit: 0
  expect_pattern: null
- name: clean_worktree
  description: the worktree is clean after the merge commit
  probe: test -z "$(git status --porcelain)"
  expect_exit: 0
  expect_pattern: null
- name: no_conflict_markers
  description: deps.lock contains no merge conflict markers
  probe: '! grep -qE ''^(<<<<<<<|=======|>>>>>>>)'' deps.lock'
  expect_exit: 0
  expect_pattern: null
- name: upstream_lines_preserved
  description: every line from upstream's deps.lock is present in the final file
  probe: test -z "$(comm -23 <(git show {upstream_remote}/{upstream_branch}:deps.lock
    | sort) <(sort deps.lock))"
  expect_exit: 0
  expect_pattern: null
- name: no_removed_lines_revived
  description: lines that upstream removed from deps.lock are not present in the final
    file
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2)
    test -z "$(comm -23 <(git show "$base:deps.lock" | sort) <(git show HEAD^2:deps.lock | sort) | grep -F -x -f - <(sort deps.lock))"
  expect_exit: 0
  expect_pattern: null
- name: local_additions_preserved
  description: every pure line added locally to deps.lock is present in the final
    file
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2)
    test -z "$(comm -23 \
      <(git diff -U0 "$base" HEAD^1 -- deps.lock | awk '
        /^@@ / { if (hunk != "" && !bad) printf "%s", hunk; hunk=""; bad=0; next }
        /^\+/ && !/^\+\+\+/ { hunk = hunk substr($0,2) "\n"; next }
        /^-/ && !/^---/ { bad=1; next }
        END { if (hunk != "" && !bad) printf "%s", hunk }
      ' | sort -u) \
      <(sort -u deps.lock))"
  expect_exit: 0
  expect_pattern: null
- name: local_deletions_preserved
  description: pure lines deleted locally from deps.lock are not present in the final
    file
  probe: |-
    base=$(git merge-base HEAD^1 HEAD^2)
    test -z "$(comm -12 \
      <(git diff -U0 "$base" HEAD^1 -- deps.lock | awk '
        /^@@ / { if (hunk != "" && has_minus && !has_plus) printf "%s", hunk; hunk=""; has_plus=0; has_minus=0; next }
        /^\+/ && !/^\+\+\+/ { has_plus=1; next }
        /^-/ && !/^---/ { hunk = hunk substr($0,2) "\n"; has_minus=1; next }
        END { if (hunk != "" && has_minus && !has_plus) printf "%s", hunk }
      ' | sort -u) \
      <(sort -u deps.lock))"
  expect_exit: 0
  expect_pattern: null
variant: take_upstream
provenance:
  compiled_from_task: Catch up with upstream without losing what either side added,
    or reviving what either side removed. Start from upstream's dependency file and
    add back what I added.
  model: deepseek-flash
  compiler_version: 0.0.1
  episode_id: Catch up with upstream without losing what either side added, or reviving
    what either side removed. Start from upstream's dependency file and add back what
    I added./seed-5-lockfile_conflict-3956
  fault: lockfile_conflict
status: candidate
