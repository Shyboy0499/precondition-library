name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format and types: fast, so they run once, beside the test shards.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

  # The suite, split three ways (PYTEST_SHARD, tests/conftest.py). Every test builds real
  # repositories, and one runner took 13-18 minutes for all of them; three take about a
  # third each. The split is by a hash of each test's id, and `tests/test_ci_shards.py`
  # checks that the shards together run every test exactly once.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: tests (shard ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Tests
        env:
          PYTEST_SHARD: ${{ matrix.shard }}/3
        run: uv run pytest -q -n auto

  # The check branch protection requires, under the name it has always had. It passes only if
  # the static checks and every shard passed, so the requirement means what it meant before.
  check:
    name: check (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    needs: [static, tests]
    if: always()
    steps:
      - name: Every job before this one passed
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.tests.result }}" = success

  # Scoped Windows coverage (issue #89). Every defect in #87 passed on Linux and failed
  # on Windows, and two of them failed *silently*: `shutil.rmtree` discarding an
  # exception, and `shell=True` running only the first line of a multi-line body and
  # returning 0. Neither is detectable from an ubuntu-latest run, and the tests that pin
  # them assert code properties rather than Windows behaviour.
  #
  # Deliberately a subset, not the whole suite: #87 measured the full suite at 35m56s on
  # Windows, because every probe spawns a fresh Git Bash process. This job runs the tests
  # whose subject *is* portability or the sandbox, which is the smallest set that would
  # have gone red for D1-D4. test_argv_templates is included because its realpath
  # containment check is path-separator sensitive (issue #10), so Windows is where a
  # containment bug would first show.
  #
  # What this does NOT cover, so nobody reads a green tick as more than it is: the other
  # ~40 test modules, the full-suite runtime, and anything outside the sandbox path --
  # notably the CLI, packaging and long-path behaviour. Those remain unverified on
  # Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Portability and sandbox tests
        run: >-
          uv run pytest -q -rs
          tests/test_portability_assumptions.py
          tests/test_sandbox_environment.py
          tests/test_sandbox_diverged.py
          tests/test_sandbox_submodule_moved.py
          tests/test_read_only_probes.py
          tests/test_process_confinement.py
          tests/test_argv_templates.py
