# Hand-written resolutions for the `sync_through_a_conflicting_lockfile` intent (#191).
#
# The intent is defined in tasks/faults/lockfile_conflict.py and registered (ADR-0029).
# The acceptable sets it declares are pinned against the fault's own checker by replay
# (tests/test_lockfile_intent.py), the way ADR-0023 pins the other intents'.
#
# Each body merges, takes one side's lock-shaped file, and re-inserts the entries the
# other side added since the merge base -- a stand-in for regeneration, since the
# sandbox has no package manager (see the fault's module docstring). The additions go
# through a file under `.git/` rather than a shell loop, so the body reads no variable
# it did not assign. Steps are chained with `&&` where a failure must stop the body.
#
# Preconditions are probes, so they must agree with the intent's decision rules
# (decided_by in tasks/faults/lockfile_conflict.py). They are written independently --
# agreeing by construction would defeat the point of having a check.
#
# Descriptions state the applicability condition in the vocabulary a request would
# use, without naming a resolution label.
#
# The lock-shaped file is found, not named: it is the one path a merge of upstream would
# leave conflicted (`git merge-tree --write-tree --name-only -z`, which writes nothing), and it
# must be lock-shaped on both sides. Every probe and the body read that path, quoted, so a
# held-out `web app/deps.lock` or `vendor/abhängigkeiten.lock` is read whole. The first version
# named `deps.lock`; a state keeping the file elsewhere then made every `git show
# <rev>:deps.lock` read nothing, the removal checks held vacuously, and take_upstream fired on
# every held-out keep_local state (ADR-0039). The next refused such a state instead; this one
# resolves it (ADR-0046).
programs:
  - id: rebuild-the-lock-from-upstreams
    intent: sync_through_a_conflicting_lockfile
    variant: take_upstream
    parameters: [upstream_remote, upstream_branch]
    preconditions:
      - name: the_conflict_is_one_dependency_file
        description: A merge of upstream would conflict in exactly one file, a dependency file on both sides.
        probe: |-
          test "$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | awk 'NR > 1 && $0 == "" {exit} NR > 1 {n++} END {print n + 0}')" = 1 &&
          lock=$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed -n 2p) &&
          git show HEAD:"$lock" | grep -q '^packages = \[$' &&
          git show {upstream_remote}/{upstream_branch}:"$lock" | grep -q '^packages = \[$'
      - name: both_sides_have_commits
        description: Upstream and the local branch each have commits the other lacks.
        probe: 'test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0 && test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -gt 0'
      - name: a_merge_would_conflict
        description: Merging upstream would stop on a conflict inside a file both sides changed.
        probe: 'git merge-tree "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" HEAD {upstream_remote}/{upstream_branch} | grep -q "^+<<<<<<<"'
      - name: local_side_removed_nothing
        description: The local side removed no dependency that upstream still lists.
        probe: |-
          lock=$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed -n 2p) &&
          base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
          test -z "$(comm -12 <(comm -23 <(git show "$base:$lock" | sort -u) <(git show "HEAD:$lock" | sort -u)) <(git show "{upstream_remote}/{upstream_branch}:$lock" | sort -u))"
    body: |
      git fetch -q {upstream_remote} &&
      lock=$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed -n 2p) &&
      test -n "$lock" &&
      base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
      git diff "$base" HEAD -- "$lock" | sed -n 's/^+\(    ".*",\)$/\1/p' > .git/lock-additions &&
      { git merge --no-edit {upstream_remote}/{upstream_branch} || true; } &&
      git checkout --theirs -- "$lock" &&
      sed -i '\%^packages = \[$%r .git/lock-additions' "$lock" &&
      rm .git/lock-additions &&
      git add -- "$lock" &&
      git commit -q --no-edit
    postconditions:
      - name: upstream_contained
        description: The local branch now contains upstream's tip.
        probe: 'git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD'
      - name: no_conflict_markers
        description: No conflict marker is left in any tracked file.
        probe: |-
          ! git grep -qE '^(<{7}|>{7})( |$)'
    provenance:
      compiled_from_task: hand-written gold resolution for benchmarking
      model: human
      compiler_version: human
      episode_id: gold/sync_through_a_conflicting_lockfile/take_upstream
      fault: lockfile_conflict
    status: candidate

  - id: rebuild-the-lock-from-ours
    intent: sync_through_a_conflicting_lockfile
    variant: keep_local
    parameters: [upstream_remote, upstream_branch]
    preconditions:
      - name: the_conflict_is_one_dependency_file
