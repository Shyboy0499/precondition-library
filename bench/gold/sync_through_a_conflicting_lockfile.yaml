        probe: 'test "$(git rev-list --count HEAD..{upstream_remote}/{upstream_branch})" -gt 0 && test "$(git rev-list --count {upstream_remote}/{upstream_branch}..HEAD)" -gt 0'
      - name: a_merge_would_conflict
        description: Merging upstream would stop on a conflict inside a file both sides changed.
        probe: 'git merge-tree "$(git merge-base HEAD {upstream_remote}/{upstream_branch})" HEAD {upstream_remote}/{upstream_branch} | grep -q "^+<<<<<<<"'
      - name: local_side_removed_something
        description: The local side removed a dependency that upstream still lists.
        probe: |-
          lock=$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed -n 2p) &&
          base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
          test -n "$(comm -12 <(comm -23 <(git show "$base:$lock" | sort -u) <(git show "HEAD:$lock" | sort -u)) <(git show "{upstream_remote}/{upstream_branch}:$lock" | sort -u))"
      - name: upstream_removed_nothing
        description: Upstream removed no dependency that the local side still lists.
        probe: |-
          lock=$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed -n 2p) &&
          base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
          test -z "$(comm -12 <(comm -23 <(git show "$base:$lock" | sort -u) <(git show "{upstream_remote}/{upstream_branch}:$lock" | sort -u)) <(git show "HEAD:$lock" | sort -u))"
    body: |
      git fetch -q {upstream_remote} &&
      lock=$(git merge-tree --write-tree --name-only -z HEAD {upstream_remote}/{upstream_branch} | tr '\0' '\n' | sed -n 2p) &&
      test -n "$lock" &&
      base=$(git merge-base HEAD {upstream_remote}/{upstream_branch}) &&
      git diff "$base" {upstream_remote}/{upstream_branch} -- "$lock" | sed -n 's/^+\(    ".*",\)$/\1/p' > .git/lock-additions &&
      { git merge --no-edit {upstream_remote}/{upstream_branch} || true; } &&
      git checkout --ours -- "$lock" &&
      sed -i '\%^packages = \[$%r .git/lock-additions' "$lock" &&
      rm .git/lock-additions &&
      git add -- "$lock" &&
      git commit -q --no-edit
    postconditions:
      - name: upstream_contained
        description: The local branch now contains upstream's tip.
        probe: 'git merge-base --is-ancestor {upstream_remote}/{upstream_branch} HEAD'
      - name: no_conflict_markers
        description: No conflict marker is left in any tracked file.
        probe: |-
          ! git grep -qE '^(<{7}|>{7})( |$)'
    provenance:
