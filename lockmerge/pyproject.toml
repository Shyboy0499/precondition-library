[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockmerge"
version = "0.1.0"
description = "A git merge driver for package-lock.json and composer.lock that merges by package, and refuses when the merge is not safe"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["git", "merge-driver", "lockfile", "npm", "composer", "package-lock"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
lockmerge = "lockmerge.cli:main"

[project.urls]
Source = "https://github.com/Shyboy0499/precondition-library/tree/main/lockmerge"
Measurements = "https://github.com/Shyboy0499/precondition-library/tree/main/results/lockmerge-2026-11-25"

[tool.hatch.build.targets.wheel]
packages = ["src/lockmerge"]
